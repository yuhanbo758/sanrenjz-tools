<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; cursor: crosshair; background: #111; }
        #screen { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
        #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .32); pointer-events: none; }
        #selection { position: fixed; display: none; border: 2px solid #36a3ff; background: rgba(54, 163, 255, .08); box-shadow: 0 0 0 99999px rgba(0, 0, 0, .42); pointer-events: none; }
        #tip { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 14px; color: #fff; background: rgba(0,0,0,.72); border-radius: 6px; font: 13px "Microsoft YaHei", sans-serif; pointer-events: none; }
        #size { position: fixed; display: none; padding: 4px 7px; color: #fff; background: rgba(0,0,0,.8); border-radius: 4px; font: 12px monospace; pointer-events: none; }
    </style>
</head>
<body>
    <img id="screen" alt="屏幕截图">
    <div id="shade"></div>
    <div id="selection"></div>
    <div id="size"></div>
    <div id="tip">拖拽选择截图区域 · Esc 或右键取消</div>
    <script>
        const { ipcRenderer } = require('electron');
        let displayId = '';
        let start = null;
        let currentRect = null;
        const selection = document.getElementById('selection');
        const size = document.getElementById('size');

        ipcRenderer.on('screenshot-overlay-init', (event, payload) => {
            displayId = String(payload.displayId);
            document.getElementById('screen').src = payload.dataUrl;
        });

        function updateSelection(x, y) {
            const left = Math.min(start.x, x);
            const top = Math.min(start.y, y);
            const width = Math.abs(x - start.x);
            const height = Math.abs(y - start.y);
            currentRect = { x: left, y: top, width, height };
            Object.assign(selection.style, { display: 'block', left: `${left}px`, top: `${top}px`, width: `${width}px`, height: `${height}px` });
            Object.assign(size.style, { display: 'block', left: `${Math.min(innerWidth - 90, x + 12)}px`, top: `${Math.min(innerHeight - 30, y + 12)}px` });
            size.textContent = `${Math.round(width)} × ${Math.round(height)}`;
        }

        addEventListener('mousedown', event => {
            if (event.button === 2) return ipcRenderer.send('screenshot-region-cancel');
            if (event.button !== 0) return;
            start = { x: event.clientX, y: event.clientY };
            updateSelection(event.clientX, event.clientY);
        });
        addEventListener('mousemove', event => { if (start) updateSelection(event.clientX, event.clientY); });
        addEventListener('mouseup', event => {
            if (event.button !== 0 || !start || !currentRect) return;
            const rect = currentRect;
            start = null;
            if (rect.width < 4 || rect.height < 4) {
                selection.style.display = 'none';
                size.style.display = 'none';
                return;
            }
            ipcRenderer.send('screenshot-region-selected', { displayId, rect });
        });
        addEventListener('keydown', event => { if (event.key === 'Escape') ipcRenderer.send('screenshot-region-cancel'); });
        addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
