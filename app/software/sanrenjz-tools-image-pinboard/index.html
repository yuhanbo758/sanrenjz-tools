<!DOCTYPE html>
<html lang="zh-CN" data-layout="floating-frame">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片悬浮板</title>
<style>
:root{
  --accent:#ad1457;--accent-2:#d81b60;--accent-soft:rgba(173,20,87,.1);--accent-line:rgba(173,20,87,.3);
  --bg:#f9f4f7;--surface:#fff;--surface-2:#f3e8ee;--border:#e6d0dc;
  --ink:#2d0f1f;--muted:#7a526a;--faint:#a88098;
  --ok:#16a34a;--err:#dc2626;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
/* indicator view - floating */
body.indicator{padding:0;background:transparent;overflow:hidden}
body.indicator #floatView{width:100vw;height:100vh;display:flex!important;align-items:center;justify-content:center;overflow:hidden;-webkit-app-region:drag}
body.indicator .float-img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
body.indicator .float-controls{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(45,15,31,.88);padding:6px;border-radius:999px;opacity:0;transition:.2s;-webkit-app-region:no-drag}
body.indicator:hover .float-controls{opacity:1}
body.indicator .fc-btn{border:0;background:transparent;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
body.indicator .fc-btn:hover{background:rgba(255,255,255,.15)}
body.indicator .fc-btn svg{width:14px;height:14px}
/* main view */
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.head-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.head-btn:hover{border-color:var(--accent-line)}
.head-btn svg{width:14px;height:14px}
.head-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:0;overflow:hidden}
.stage{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.stage-area{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px;background:repeating-conic-gradient(#f5edf2 0% 25%,#faf5f8 0% 50%) 50%/16px 16px}
.stage-area.drag-over:after{content:'松开导入图片';position:absolute;inset:12px;z-index:2;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:14px;background:rgba(255,248,252,.9);color:var(--accent);font-size:18px;font-weight:700;pointer-events:none}
.pin-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);transition:transform .15s,opacity .15s}
.stage-empty{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--faint);cursor:pointer}
.stage-empty svg{width:56px;height:56px;opacity:.3}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface);flex:none;flex-wrap:wrap}
.slider-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.slider{width:95px;accent-color:var(--accent)}
.slider-val{font:600 12px var(--mono);color:var(--accent);min-width:40px}
.ctrl-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.ctrl-btn:hover{border-color:var(--accent-line);color:var(--accent)}
.ctrl-btn svg{width:16px;height:16px}
.side{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:auto}
.side-h{padding:14px 18px;border-bottom:1px solid var(--border);flex:none}
.side-h h2{margin:0 0 4px;font-size:15px;font-weight:700}
.side-h p{margin:0;font-size:12px;color:var(--muted)}
.side-body{padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:10px}
.action-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.action-btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.action-btn svg{width:16px;height:16px}
.action-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.pinned-list{display:flex;flex-direction:column;gap:8px}
.pinned-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;cursor:pointer;transition:.12s}
.pinned-item:hover{outline:1px solid var(--accent-line)}
.pinned-item button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;padding:4px}
.pinned-item button:hover{color:var(--err)}
.pinned-item .pi-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--border)}
.pinned-item .pi-name{font:12px var(--mono);color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-actions .action-btn{padding:9px 5px}
.meta{min-height:20px;color:var(--muted);font-size:12px;padding:0 2px}
.list-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin:6px 0}
@media(max-width:960px){.body{grid-template-columns:minmax(0,1fr) 220px}.slider{width:72px}.toolbar{gap:5px}.side-body{padding:12px}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d0f1f;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e0bcd0;border-radius:4px}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('view')==='indicator')document.body.className='indicator';</script>
<div id="floatView" style="display:none"><img class="float-img" id="floatImg" alt="悬浮图片"><div class="float-controls"><button class="fc-btn" id="fcZoomOut" title="缩小">−</button><button class="fc-btn" id="fcZoomIn" title="放大">＋</button><button class="fc-btn" id="fcClose" title="关闭悬浮">×</button></div></div>
<main class="app" id="mainView">
  <div class="body">
    <div class="stage">
      <div class="stage-area" id="stageArea">
        <div class="stage-empty" id="stageEmpty" onclick="$('#pickBtn').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>拖入图片，或点击选择文件；也可按 Ctrl+V 粘贴</span>
        </div>
      </div>
      <div class="toolbar">
        <button class="ctrl-btn" id="zoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
        <div class="slider-row"><span>缩放</span><input type="range" class="slider" id="scaleSlider" min="10" max="300" value="100"><span class="slider-val" id="scaleVal">100%</span></div>
        <button class="ctrl-btn" id="zoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="slider-row"><span>旋转</span><input type="range" class="slider" id="rotateSlider" min="0" max="360" value="0"><span class="slider-val" id="rotateVal">0°</span></div>
        <div class="slider-row"><span>透明度</span><input type="range" class="slider" id="opacitySlider" min="20" max="100" value="100"><span class="slider-val" id="opacityVal">100%</span></div>
        <button class="ctrl-btn" id="resetBtn" title="重置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg></button>
        <button class="ctrl-btn" id="flipXBtn" title="水平翻转">⇋</button>
        <button class="ctrl-btn" id="flipYBtn" title="垂直翻转">⇵</button>
        <button class="ctrl-btn" id="turnBtn" title="顺时针旋转 90°">⟳</button>
      </div>
    </div>
    <aside class="side">
      <div class="side-body">
        <div class="side-actions"><button class="action-btn" id="pasteBtn">从剪贴板取图</button><button class="action-btn" id="pickBtn">选择图片</button></div>
        <div class="meta" id="imageMeta">支持 PNG、JPEG、WebP、BMP、GIF</div>
        <button class="action-btn primary" id="floatBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="5"/></svg>悬浮置顶</button>
        <div class="side-actions"><button class="action-btn" id="saveBtn">保存当前视图</button><button class="action-btn" id="copyBtn">复制当前视图</button></div>
        <button class="action-btn" id="favoriteBtn">☆ 收藏当前图片</button>
        <div>
          <div class="list-title"><span>已收藏图片</span><span id="favoriteCount">0 / 12</span></div>
          <div class="pinned-list" id="pinnedList"><div style="color:var(--faint);font-size:13px">暂无收藏</div></div>
        </div>
      </div>
    </aside>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
const isIndicator=new URLSearchParams(location.search).get('view')==='indicator';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
if(isIndicator){
  $('#mainView').style.display='none';$('#floatView').style.display='block';
  (async()=>{
    const [image,view]=await Promise.all([api.storage.get('pinboard-current'),api.storage.get('pinboard-view')]);
    if(image)$('#floatImg').src=image;
    if(view){$('#floatImg').style.transform=`rotate(${view.rotate||0}deg) scale(${view.flipX?-1:1},${view.flipY?-1:1})`;$('#floatImg').style.opacity=(view.opacity||100)/100;}
  })().catch(()=>{});
  $('#fcClose').onclick=async()=>{await api.window.closeIndicator();};
  let zoom=1;
  function floatZoom(delta){zoom=Math.max(.25,Math.min(3,zoom+delta));$('#floatImg').style.zoom=zoom;}
  $('#fcZoomIn').onclick=()=>floatZoom(.15);
  $('#fcZoomOut').onclick=()=>floatZoom(-.15);
}else{
  let currentImg='',sourceImage=null,pinned=[],flipX=false,flipY=false;
  const imageExt=/\.(png|jpe?g|webp|bmp|gif)$/i;
  function view(){return {rotate:+$('#rotateSlider').value,opacity:+$('#opacitySlider').value,flipX,flipY};}
  function updateFavoriteButton(){const exists=pinned.some(item=>item.dataUrl===currentImg);$('#favoriteBtn').textContent=exists?'★ 取消收藏':'☆ 收藏当前图片';$('#favoriteCount').textContent=`${pinned.length} / 12`;}
  async function loadImage(dataUrl,name='图片'){
    if(!dataUrl||dataUrl.length>28*1024*1024)throw new Error('图片不能超过 20 MB');
    const img=new Image();img.decoding='async';img.src=dataUrl;
    await img.decode();
    currentImg=dataUrl;sourceImage=img;img.id='pinImg';img.className='pin-img';img.alt=name;
    $('#stageArea').replaceChildren(img);
    $('#imageMeta').textContent=`${name} · ${img.naturalWidth} × ${img.naturalHeight}`;
    resetView();updateFavoriteButton();
  }
  async function fromFile(file){
    if(!file||!imageExt.test(file.name)||file.size>20*1024*1024){toast('请选择 20 MB 内的常见图片文件');return;}
    const reader=new FileReader();
    reader.onload=()=>loadImage(reader.result,file.name).catch(err=>toast(err.message||'图片无法打开'));
    reader.onerror=()=>toast('读取图片失败');reader.readAsDataURL(file);
  }
  async function loadFromClipboard(){try{const d=api.readClipboardImage();if(d)await loadImage(d,'剪贴板图片');else toast('剪贴板无图片');}catch(err){toast(err.message||'读取剪贴板失败');}}
  function loadFromFile(){try{const selected=api.selectFiles({multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp','gif']}]});const file=selected?.[0];if(file)loadImage(api.readImageFile(file),file.split(/[\\/]/).pop()).catch(err=>toast(err.message));}catch(err){toast(err.message||'读取图片失败');}}
  function applyTransform(){const img=$('#pinImg');if(!img)return;const s=+$('#scaleSlider').value/100,r=+$('#rotateSlider').value,o=+$('#opacitySlider').value/100;img.style.transform=`scale(${flipX?-s:s},${flipY?-s:s}) rotate(${r}deg)`;img.style.opacity=o;$('#scaleVal').textContent=Math.round(s*100)+'%';$('#rotateVal').textContent=r+'°';$('#opacityVal').textContent=Math.round(o*100)+'%';}
  function resetView(){flipX=false;flipY=false;$('#scaleSlider').value=100;$('#rotateSlider').value=0;$('#opacitySlider').value=100;applyTransform();}
  function changeZoom(delta){$('#scaleSlider').value=Math.max(10,Math.min(300,+$('#scaleSlider').value+delta));applyTransform();}
  ['scaleSlider','rotateSlider','opacitySlider'].forEach(id=>$('#'+id).oninput=applyTransform);
  $('#zoomIn').onclick=()=>changeZoom(10);$('#zoomOut').onclick=()=>changeZoom(-10);
  $('#resetBtn').onclick=resetView;
  $('#flipXBtn').onclick=()=>{flipX=!flipX;applyTransform();};
  $('#flipYBtn').onclick=()=>{flipY=!flipY;applyTransform();};
  $('#turnBtn').onclick=()=>{$('#rotateSlider').value=(+$('#rotateSlider').value+90)%360;applyTransform();};
  $('#pasteBtn').onclick=loadFromClipboard;$('#pickBtn').onclick=loadFromFile;
  // 缩放仅用于查看；导出使用原始像素，应用旋转、镜像和透明度。
  function renderedImage(){
    if(!sourceImage)throw new Error('请先加载图片');
    const r=+$('#rotateSlider').value*Math.PI/180,w=sourceImage.naturalWidth,h=sourceImage.naturalHeight;
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.ceil(Math.abs(w*Math.cos(r))+Math.abs(h*Math.sin(r))));canvas.height=Math.max(1,Math.ceil(Math.abs(w*Math.sin(r))+Math.abs(h*Math.cos(r))));
    const ctx=canvas.getContext('2d');ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(r);ctx.scale(flipX?-1:1,flipY?-1:1);ctx.globalAlpha=+$('#opacitySlider').value/100;ctx.drawImage(sourceImage,-w/2,-h/2);
    return canvas.toDataURL('image/png');
  }
  $('#floatBtn').onclick=async()=>{if(!currentImg){toast('请先加载图片');return;}try{await api.storage.set('pinboard-current',currentImg);await api.storage.set('pinboard-view',view());await api.window.closeIndicator();const shown=await api.window.showIndicator();if(shown)await api.window.keepAlive();toast(shown?'已悬浮置顶，可拖动或调整边缘':'悬浮窗口打开失败');}catch(err){toast(err.message||'悬浮失败');}};
  $('#saveBtn').onclick=()=>{try{const saved=api.saveResult({title:'保存当前视图',defaultPath:'pinboard.png',filters:[{name:'PNG',extensions:['png']}],dataUrl:renderedImage()});if(!saved.cancelled)toast('已保存');}catch(err){toast(err.message||'保存失败');}};
  $('#copyBtn').onclick=()=>{try{api.copyImage(renderedImage());toast('已复制图片');}catch(err){toast(err.message||'复制失败');}};
  async function persistPinned(){await api.storage.set('pinboard-list',pinned);renderPinned();}
  function renderPinned(){const list=$('#pinnedList');list.replaceChildren();if(!pinned.length){list.textContent='暂无收藏';updateFavoriteButton();return;}
    pinned.forEach((item,index)=>{const row=document.createElement('div');row.className='pinned-item';const thumb=document.createElement('img');thumb.className='pi-thumb';thumb.src=item.dataUrl;const label=document.createElement('span');label.className='pi-name';label.textContent=`图片 ${index+1}`;const remove=document.createElement('button');remove.textContent='×';remove.title='删除收藏';remove.onclick=async event=>{event.stopPropagation();pinned.splice(index,1);try{await persistPinned();}catch(err){toast('删除收藏失败');}};row.onclick=()=>loadImage(item.dataUrl,`收藏图片 ${index+1}`).catch(err=>toast(err.message));row.append(thumb,label,remove);list.append(row);});updateFavoriteButton();}
  $('#favoriteBtn').onclick=async()=>{if(!currentImg){toast('请先加载图片');return;}const index=pinned.findIndex(item=>item.dataUrl===currentImg);if(index>=0)pinned.splice(index,1);else{if(currentImg.length>8*1024*1024){toast('收藏图片需小于 6 MB');return;}pinned=[{dataUrl:currentImg,time:Date.now()},...pinned].slice(0,12);}try{await persistPinned();toast(index>=0?'已取消收藏':'已收藏');}catch(err){toast('收藏保存失败');}};
  api.storage.get('pinboard-list').then(value=>{pinned=Array.isArray(value)?value.filter(item=>typeof item?.dataUrl==='string').slice(0,12):[];renderPinned();}).catch(()=>renderPinned());
  let dragDepth=0;
  window.addEventListener('dragenter',event=>{if(event.dataTransfer?.types.includes('Files')){event.preventDefault();dragDepth++;$('#stageArea').classList.add('drag-over');}});
  window.addEventListener('dragover',event=>{if(event.dataTransfer?.types.includes('Files')){event.preventDefault();event.dataTransfer.dropEffect='copy';}});
  window.addEventListener('dragleave',event=>{event.preventDefault();if(--dragDepth<=0){dragDepth=0;$('#stageArea').classList.remove('drag-over');}});
  window.addEventListener('drop',event=>{event.preventDefault();dragDepth=0;$('#stageArea').classList.remove('drag-over');const files=[...event.dataTransfer.files];if(files.length>1)toast('一次只导入一张图片');else if(files[0])fromFile(files[0]);});
  window.addEventListener('paste',event=>{const file=[...event.clipboardData.items].find(item=>item.kind==='file'&&item.type.startsWith('image/'))?.getAsFile();if(file){event.preventDefault();fromFile(file);}else loadFromClipboard();});
  $('#stageArea').addEventListener('wheel',event=>{if(currentImg&&event.ctrlKey){event.preventDefault();changeZoom(event.deltaY<0?10:-10);}},{passive:false});
  window.addEventListener('plugin-enter',loadFromClipboard);
}
</script>
</body></html>
