<!DOCTYPE html>
<html lang="zh-CN" data-layout="floating-frame">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片悬浮板</title>
<style>
:root{
  --accent:#ad1457;--accent-2:#d81b60;--accent-soft:rgba(173,20,87,.1);--accent-line:rgba(173,20,87,.3);
  --bg:#f9f4f7;--surface:#fff;--surface-2:#f3e8ee;--border:#e6d0dc;
  --ink:#2d0f1f;--muted:#7a526a;--faint:#a88098;
  --ok:#16a34a;--err:#dc2626;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
/* indicator view - floating */
body.indicator{padding:0;background:transparent;overflow:hidden}
body.indicator .float-img{max-width:100vw;max-height:100vh;object-fit:contain;-webkit-app-region:drag}
body.indicator .float-controls{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(45,15,31,.85);padding:6px;border-radius:999px;opacity:0;transition:.2s;-webkit-app-region:no-drag}
body.indicator:hover .float-controls{opacity:1}
body.indicator .fc-btn{border:0;background:transparent;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
body.indicator .fc-btn:hover{background:rgba(255,255,255,.15)}
body.indicator .fc-btn svg{width:14px;height:14px}
/* main view */
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.head-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.head-btn:hover{border-color:var(--accent-line)}
.head-btn svg{width:14px;height:14px}
.head-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 280px;gap:0;overflow:hidden}
.stage{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.stage-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px;background:repeating-conic-gradient(#f5edf2 0% 25%,#faf5f8 0% 50%) 50%/16px 16px}
.pin-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);transition:transform .15s,opacity .15s}
.stage-empty{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--faint);cursor:pointer}
.stage-empty svg{width:56px;height:56px;opacity:.3}
.toolbar{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);flex:none;flex-wrap:wrap}
.slider-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.slider{width:120px;accent-color:var(--accent)}
.slider-val{font:600 12px var(--mono);color:var(--accent);min-width:40px}
.ctrl-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.ctrl-btn:hover{border-color:var(--accent-line);color:var(--accent)}
.ctrl-btn svg{width:16px;height:16px}
.side{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:auto}
.side-h{padding:16px 20px;border-bottom:1px solid var(--border);flex:none}
.side-h h2{margin:0 0 4px;font-size:15px;font-weight:700}
.side-h p{margin:0;font-size:12px;color:var(--muted)}
.side-body{padding:16px 20px;flex:1;display:flex;flex-direction:column;gap:16px}
.action-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.action-btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.action-btn svg{width:16px;height:16px}
.action-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.pinned-list{display:flex;flex-direction:column;gap:8px}
.pinned-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;cursor:pointer;transition:.12s}
.pinned-item:hover{border:1px solid var(--accent-line)}
.pinned-item .pi-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--border)}
.pinned-item .pi-name{font:12px var(--mono);color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d0f1f;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e0bcd0;border-radius:4px}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('view')==='indicator')document.body.className='indicator';</script>
<div id="floatView" style="display:none"><img class="float-img" id="floatImg"><div class="float-controls"><button class="fc-btn" id="fcClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button><button class="fc-btn" id="fcZoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4-4"/></svg></button><button class="fc-btn" id="fcZoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4-4"/></svg></button></div></div>
<main class="app" id="mainView">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div><h1>图片悬浮板</h1><p>从剪贴板取图，置顶查看并控制缩放、旋转与透明度</p></div>
    <div class="spacer"></div>
    <button class="head-btn" id="pasteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M5 5h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>从剪贴板取图</button>
    <button class="head-btn" id="pickBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5"/></svg>选择图片</button>
  </div>
  <div class="body">
    <div class="stage">
      <div class="stage-area" id="stageArea">
        <div class="stage-empty" id="stageEmpty" onclick="$('#pasteBtn').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>点击从剪贴板取图或选择图片文件</span>
        </div>
      </div>
      <div class="toolbar">
        <button class="ctrl-btn" id="zoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
        <div class="slider-row"><span>缩放</span><input type="range" class="slider" id="scaleSlider" min="10" max="300" value="100"><span class="slider-val" id="scaleVal">100%</span></div>
        <button class="ctrl-btn" id="zoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="slider-row"><span>旋转</span><input type="range" class="slider" id="rotateSlider" min="0" max="360" value="0"><span class="slider-val" id="rotateVal">0°</span></div>
        <div class="slider-row"><span>透明度</span><input type="range" class="slider" id="opacitySlider" min="20" max="100" value="100"><span class="slider-val" id="opacityVal">100%</span></div>
        <button class="ctrl-btn" id="resetBtn" title="重置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg></button>
      </div>
    </div>
    <aside class="side">
      <div class="side-h"><h2>悬浮操作</h2><p>将图片置顶到所有窗口之上</p></div>
      <div class="side-body">
        <button class="action-btn primary" id="floatBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="5"/></svg>悬浮置顶</button>
        <button class="action-btn" id="saveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>保存图片</button>
        <div>
          <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:10px">已收藏图片</div>
          <div class="pinned-list" id="pinnedList"><div style="color:var(--faint);font-size:13px">暂无收藏</div></div>
        </div>
      </div>
    </aside>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
const isIndicator=new URLSearchParams(location.search).get('view')==='indicator';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
if(isIndicator){
  $('#mainView').style.display='none';$('#floatView').style.display='block';
  (async()=>{const img=await api.storage.get('pinboard-current');if(img){$('#floatImg').src=img;}})();
  $('#fcClose').onclick=async()=>{await api.window.closeIndicator();};
  $('#fcZoomIn').onclick=()=>{const i=$('#floatImg');const s=parseFloat(i.style.transform.match(/scale\(([\d.]+)\)/)?.[1]||1);i.style.transform=`scale(${Math.min(3,s+0.2)})`;};
  $('#fcZoomOut').onclick=()=>{const i=$('#floatImg');const s=parseFloat(i.style.transform.match(/scale\(([\d.]+)\)/)?.[1]||1);i.style.transform=`scale(${Math.max(0.2,s-0.2)})`;};
}else{
  let currentImg='';
  async function loadFromClipboard(){const d=api.readClipboardImage();if(d){setImage(d);}else toast('剪贴板无图片');}
  async function loadFromFile(){const sel=api.selectFiles({multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});const f=Array.isArray(sel)?sel[0]:sel;if(f)setImage(api.readFileDataUrl(f));}
  function setImage(dataUrl,save=true){currentImg=dataUrl;const img=new Image();img.className='pin-img';img.onload=()=>{$('#stageArea').innerHTML='';img.id='pinImg';$('#stageArea').appendChild(img);applyTransform();};img.src=dataUrl;const empty=$('#stageEmpty');if(empty)empty.style.display='none';if(save)saveToPinned(dataUrl);}
  function applyTransform(){const img=$('#pinImg');if(!img)return;const s=+$('#scaleSlider').value/100,r=+$('#rotateSlider').value,o=+$('#opacitySlider').value/100;img.style.transform=`scale(${s}) rotate(${r}deg)`;img.style.opacity=o;}
  ['scaleSlider','rotateSlider','opacitySlider'].forEach(id=>$('#'+id).oninput=e=>{const k=id.replace('Slider','Val');$('#'+k).textContent=(id==='rotateSlider'?e.target.value+'°':e.target.value+'%');applyTransform();});
  $('#zoomIn').onclick=()=>{$('#scaleSlider').value=Math.min(300,+$('#scaleSlider').value+10);$('#scaleVal').textContent=$('#scaleSlider').value+'%';applyTransform();};
  $('#zoomOut').onclick=()=>{$('#scaleSlider').value=Math.max(10,+$('#scaleSlider').value-10);$('#scaleVal').textContent=$('#scaleSlider').value+'%';applyTransform();};
  $('#resetBtn').onclick=()=>{$('#scaleSlider').value=100;$('#rotateSlider').value=0;$('#opacitySlider').value=100;$('#scaleVal').textContent='100%';$('#rotateVal').textContent='0°';$('#opacityVal').textContent='100%';applyTransform();};
  $('#pasteBtn').onclick=loadFromClipboard;$('#pickBtn').onclick=loadFromFile;
  $('#floatBtn').onclick=async()=>{if(!currentImg){toast('请先加载图片');return;}await api.storage.set('pinboard-current',currentImg);await api.window.keepAlive();await api.window.showIndicator();toast('已悬浮置顶');};
  $('#saveBtn').onclick=()=>{if(!currentImg){toast('请先加载图片');return;}const saved=api.saveResult({title:'保存图片',defaultPath:'pinboard.png',filters:[{name:'PNG',extensions:['png']}],dataUrl:currentImg});if(!saved.cancelled)toast('已保存');};
  async function saveToPinned(dataUrl){let pinned=await api.storage.get('pinboard-list')||[];pinned=[{dataUrl,time:Date.now()},...pinned].slice(0,20);await api.storage.set('pinboard-list',pinned);renderPinned(pinned);}
  async function renderPinned(p){p=p||await api.storage.get('pinboard-list')||[];if(!p.length){$('#pinnedList').innerHTML='<div style="color:var(--faint);font-size:13px">暂无收藏</div>';return;}$('#pinnedList').innerHTML=p.map((it,i)=>`<div class="pinned-item" data-i="${i}"><img class="pi-thumb" src="${it.dataUrl}"><span class="pi-name">图片 ${i+1}</span></div>`).join('');$$('#pinnedList [data-i]').forEach(el=>el.onclick=()=>setImage(p[+el.dataset.i].dataUrl,false));}
  renderPinned();
  window.addEventListener('plugin-enter',e=>{loadFromClipboard();});
}
</script>
</body></html>
