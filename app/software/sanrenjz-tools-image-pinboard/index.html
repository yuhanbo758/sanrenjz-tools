<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片悬浮板</title>
<style>
:root{--bg:#1a1328;--panel:#241b3a;--text:#e8dff5;--muted:#7a6b96;--border:#2e2350;--accent:#d946ef;--accent2:#c084fc;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.custom-title-bar{background:var(--bg)!important;border-bottom:1px solid var(--border)!important}
.controls{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.controls button{padding:7px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.controls button:hover{border-color:var(--accent);color:var(--accent)}
.controls button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.controls button.primary:hover{filter:brightness(1.1)}
.controls .slider-group{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.controls .slider-group label{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.controls .slider-group input[type=range]{flex:1;min-width:60px;accent-color:var(--accent);height:4px}
.controls .slider-group .pct{font-size:11px;color:var(--accent);width:32px;text-align:right;flex-shrink:0;font-weight:600}
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px;overflow:hidden}
.canvas-wrap canvas{max-width:100%;max-height:100%;border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.4);object-fit:contain}
.placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-align:center}
.placeholder .icon{font-size:48px;opacity:.5;margin-bottom:4px}
.placeholder strong{font-size:15px;color:var(--text)}
.placeholder span{font-size:12px}
.status-bar{display:flex;align-items:center;gap:8px;padding:6px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);flex-shrink:0}
.status-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.status-bar .dot.active{background:var(--accent);box-shadow:0 0 6px var(--accent)}
</style>
</head>
<body>
<div class="controls">
  <button class="primary" id="pinBtn">从剪贴板获取</button>
  <div class="slider-group">
    <label>透明度</label>
    <input type="range" id="opacitySlider" min="10" max="100" value="100">
    <span class="pct" id="opacityVal">100%</span>
  </div>
  <button id="clearBtn">清除</button>
</div>
<div class="canvas-wrap" id="canvasWrap">
  <div class="placeholder" id="placeholder">
    <div class="icon">&#x1F5BC;</div>
    <strong>暂无图片</strong>
    <span>点击"从剪贴板获取"加载图片</span>
  </div>
  <canvas id="previewCanvas" style="display:none"></canvas>
</div>
<div class="status-bar">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">等待图片</span>
</div>
<script>
const api = window.pluginAPI;
const pinBtn = document.getElementById('pinBtn');
const clearBtn = document.getElementById('clearBtn');
const opacitySlider = document.getElementById('opacitySlider');
const opacityVal = document.getElementById('opacityVal');
const canvas = document.getElementById('previewCanvas');
const placeholder = document.getElementById('placeholder');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
let currentImage = null;

function setStatus(active, msg) {
  statusDot.className = 'dot' + (active ? ' active' : '');
  statusText.textContent = msg;
}

function loadImage(dataUrl) {
  if (!dataUrl) return;
  const img = new Image();
  img.onload = () => {
    const wrap = document.getElementById('canvasWrap');
    const maxW = wrap.clientWidth - 32;
    const maxH = wrap.clientHeight - 32;
    let w = img.width, h = img.height;
    if (w > maxW) { h = h * maxW / w; w = maxW; }
    if (h > maxH) { w = w * maxH / h; h = maxH; }
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    ctx.globalAlpha = parseInt(opacitySlider.value) / 100;
    ctx.drawImage(img, 0, 0, w, h);
    canvas.style.display = 'block';
    placeholder.style.display = 'none';
    currentImage = dataUrl;
    setStatus(true, `${img.width} x ${img.height}`);
  };
  img.onerror = () => {
    setStatus(false, '图片加载失败');
  };
  img.src = dataUrl;
}

function updateOpacity() {
  const val = parseInt(opacitySlider.value);
  opacityVal.textContent = val + '%';
  if (currentImage) loadImage(currentImage);
}

pinBtn.addEventListener('click', () => {
  try {
    const img = api.readClipboardImage();
    if (img) { loadImage(img); }
    else { setStatus(false, '剪贴板无图片'); }
  } catch (e) { setStatus(false, '读取失败'); }
});

clearBtn.addEventListener('click', () => {
  currentImage = null;
  canvas.style.display = 'none';
  placeholder.style.display = 'flex';
  setStatus(false, '等待图片');
});

opacitySlider.addEventListener('input', updateOpacity);

document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = () => loadImage(reader.result);
      reader.readAsDataURL(blob);
      break;
    }
  }
});
</script>
</body>
</html>
