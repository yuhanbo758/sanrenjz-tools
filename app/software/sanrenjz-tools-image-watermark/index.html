<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片水印</title>
<style>:root{--bg:#fff1f2;--panel:#fff;--surface:#ffe4e6;--text:#4c0519;--muted:#9d174d;--border:#fecdd3;--accent:#db2777;--accent2:#ec4899;--r:12px}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{display:flex;height:calc(100vh - 32px);padding:20px;gap:16px;overflow:hidden}.sidebar{width:270px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}.sidebar h1{font-size:20px;margin:0;color:var(--accent);font-weight:800;letter-spacing:-.3px}.pick-btn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:var(--r);background:var(--surface);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}.pick-btn:hover{border-color:var(--accent);background:var(--panel)}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}.card h3{font-size:13px;font-weight:700;margin:0;color:var(--text)}.card label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.card input[type=text]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;outline:none;transition:border .15s}.card input[type=text]:focus{border-color:var(--accent)}.card input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:var(--surface);outline:none}.card input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer}.card .range-row{display:flex;align-items:center;gap:8px}.card .range-row .val{min-width:32px;text-align:right;font-size:12px;color:var(--accent);font-weight:700}.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;width:100%;height:80px}.pos-grid button{border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;transition:all .15s;font-size:10px;color:var(--muted)}.pos-grid button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.pos-grid button:hover{background:var(--accent2);color:#fff}.actions{display:flex;gap:8px}.actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}.actions .apply{background:var(--accent);color:#fff}.actions .apply:hover{background:var(--accent2);box-shadow:0 4px 14px rgba(219,39,119,.3)}.actions .save{background:var(--surface);color:var(--accent);border:1px solid var(--border)}.actions .save:hover{background:var(--accent);color:#fff}.preview-area{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden}.preview-area canvas,.preview-area img{max-width:100%;max-height:100%;object-fit:contain}.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);opacity:.35}.empty svg{width:56px;height:56px}.saved{color:#16a34a;font-size:12px;font-weight:600;margin-left:6px}</style></head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>图片水印</h1>
    <button class="pick-btn" id="pickBtn">选择图片</button>
    <div class="card">
      <h3>水印设置</h3>
      <label>水印文字<input type="text" id="wmText" value="三人聚智" placeholder="输入水印文字"></label>
      <label>透明度 <div class="range-row"><input type="range" id="opacity" min="5" max="100" value="30"><span class="val" id="opVal">30%</span></div></label>
      <label>字号 <div class="range-row"><input type="range" id="fontSize" min="12" max="120" value="36"><span class="val" id="fsVal">36</span></div></label>
      <label>旋转角度 <div class="range-row"><input type="range" id="angle" min="-90" max="90" value="-30"><span class="val" id="angVal">-30°</span></div></label>
      <label>位置</label>
      <div class="pos-grid">
        <button data-pos="nw">左上</button><button data-pos="n">中上</button><button data-pos="ne">右上</button>
        <button data-pos="w">左中</button><button data-pos="c" class="active">居中</button><button data-pos="e">右中</button>
        <button data-pos="sw">左下</button><button data-pos="s">中下</button><button data-pos="se">右下</button>
      </div>
    </div>
    <div class="actions">
      <button class="apply" id="applyBtn">应用水印</button>
      <button class="save" id="saveBtn">导出</button>
      <span class="saved" id="savedLabel" hidden>已导出</span>
    </div>
  </div>
  <div class="preview-area" id="preview">
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><div>选择图片后添加水印</div></div>
  </div>
</div>
<script>
const api=window.pluginAPI,$=id=>document.getElementById(id);
let origDataUrl='',outDataUrl='',pos='c';
$('opacity').addEventListener('input',()=>$('opVal').textContent=$('opacity').value+'%');
$('fontSize').addEventListener('input',()=>$('fsVal').textContent=$('fontSize').value);
$('angle').addEventListener('input',()=>$('angVal').textContent=$('angle').value+'°');
document.querySelectorAll('.pos-grid button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pos-grid button').forEach(x=>x.classList.remove('active'));b.classList.add('active');pos=b.dataset.pos}));
function applyWatermark(){if(!origDataUrl)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const text=$('wmText').value||'Watermark';const fs=Number($('fontSize').value);const op=Number($('opacity').value)/100;const ang=Number($('angle').value)*Math.PI/180;ctx.save();ctx.globalAlpha=op;ctx.font=`bold ${fs}px -apple-system,"Microsoft YaHei",sans-serif`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';const tw=ctx.measureText(text).width;const pad=fs*.6;let x=img.width/2,y=img.height/2;const m={nw:[pad+tw/2,pad+fs/2],n:[img.width/2,pad+fs/2],ne:[img.width-pad-tw/2,pad+fs/2],w:[pad+tw/2,img.height/2],c:[img.width/2,img.height/2],e:[img.width-pad-tw/2,img.height/2],sw:[pad+tw/2,img.height-pad-fs/2],s:[img.width/2,img.height-pad-fs/2],se:[img.width-pad-tw/2,img.height-pad-fs/2]};[x,y]=m[pos]||m.c;ctx.translate(x,y);ctx.rotate(ang);ctx.translate(-x,-y);ctx.fillText(text,x,y+2);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillText(text,x,y);ctx.restore();outDataUrl=c.toDataURL();$('preview').innerHTML='';const el=document.createElement('img');el.src=outDataUrl;$('preview').appendChild(el)};img.src=origDataUrl}
$('pickBtn').addEventListener('click',()=>{const f=api.selectFiles({title:'选择图片',multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});if(f.length){origDataUrl=api.readFileDataUrl(f[0]);applyWatermark()}});
$('applyBtn').addEventListener('click',applyWatermark);
$('saveBtn').addEventListener('click',()=>{if(!outDataUrl)return;const r=api.saveResult({dataUrl:outDataUrl,defaultPath:'watermarked.png',title:'保存带水印图片',filters:[{name:'PNG',extensions:['png']},{name:'JPEG',extensions:['jpg']}]});if(!r.cancelled){$('savedLabel').hidden=0;setTimeout(()=>$('savedLabel').hidden=1,2000)}});
</script></body></html>
