<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>端口检查器</title>
<style>
:root{--bg:#061208;--panel:#0a1f0e;--text:#d4f5d9;--muted:#5a8a60;--border:#14361a;--accent:#22c55e;--accent2:#4ade80;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.custom-title-bar{background:var(--bg)!important;border-bottom:1px solid var(--border)!important}
.filter-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.filter-bar input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;outline:none;font-family:monospace}
.filter-bar input:focus{border-color:var(--accent)}
.filter-bar button{padding:8px 14px;border:1px solid var(--accent);border-radius:6px;background:transparent;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-bar button:hover{background:var(--accent);color:#061208}
.filter-bar input::placeholder{color:var(--muted)}
.table-wrap{flex:1;overflow-y:auto;min-height:0}
.table-wrap::-webkit-scrollbar{width:5px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
thead{position:sticky;top:0;z-index:1}
th{background:var(--panel);padding:8px 10px;text-align:left;font-weight:600;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:var(--panel)}
.state-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.state-listen{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.state-established{background:color-mix(in srgb,#3b82f6 20%,transparent);color:#3b82f6}
.state-close_wait{background:color-mix(in srgb,#f59e0b 20%,transparent);color:#f59e0b}
.state-time_wait{background:color-mix(in srgb,#8b5cf6 20%,transparent);color:#8b5cf6}
.state-bound{background:color-mix(in srgb,#64748b 20%,transparent);color:#94a3b8}
.mono{font-family:"Cascadia Code","Consolas",monospace;font-size:11px}
.port-num{color:var(--accent);font-weight:700}
.empty{display:flex;align-items:center;justify-content:center;height:120px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="filter-bar">
  <input type="text" id="filterInput" placeholder="筛选端口或地址，如 80, 443, 192.168...">
  <button id="refreshBtn">刷新</button>
</div>
<div class="table-wrap" id="tableWrap">
  <div class="empty">点击刷新加载端口信息</div>
</div>
<script>
const api = window.pluginAPI;
const filterInput = document.getElementById('filterInput');
const refreshBtn = document.getElementById('refreshBtn');
const tableWrap = document.getElementById('tableWrap');

function stateClass(state) {
  const s = String(state || '').toLowerCase();
  if (s === 'listen') return 'state-listen';
  if (s === 'established') return 'state-established';
  if (s === 'closewait' || s === 'close_wait') return 'state-close_wait';
  if (s === 'timewait' || s === 'time_wait') return 'state-time_wait';
  if (s === 'bound') return 'state-bound';
  return '';
}

async function loadPorts() {
  tableWrap.innerHTML = '<div class="empty">加载中...</div>';
  try {
    const res = await api.runTask({ input: '', options: {}, execute: false });
    if (!res.ok) { tableWrap.innerHTML = `<div class="empty">${res.error}</div>`; return; }
    const ports = Array.isArray(res.result) ? res.result : [];
    if (!ports.length) { tableWrap.innerHTML = '<div class="empty">无端口数据</div>'; return; }
    renderTable(ports);
  } catch (e) {
    tableWrap.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
  }
}

function renderTable(ports) {
  const q = filterInput.value.trim().toLowerCase();
  const filtered = q ? ports.filter(p => {
    return String(p.LocalPort || '').includes(q) ||
      String(p.LocalAddress || '').toLowerCase().includes(q) ||
      String(p.RemoteAddress || '').toLowerCase().includes(q) ||
      String(p.State || '').toLowerCase().includes(q) ||
      String(p.OwningProcess || '').includes(q);
  }) : ports;

  let html = `<table><thead><tr>
    <th style="width:18%">本地地址</th><th style="width:8%">端口</th>
    <th style="width:18%">远程地址</th><th style="width:8%">远程端口</th>
    <th style="width:12%">状态</th><th style="width:10%">进程 PID</th>
  </tr></thead><tbody>`;

  filtered.forEach(p => {
    html += `<tr>
      <td class="mono">${p.LocalAddress || '--'}</td>
      <td class="mono port-num">${p.LocalPort || '--'}</td>
      <td class="mono">${p.RemoteAddress || '--'}</td>
      <td class="mono">${p.RemotePort || '--'}</td>
      <td><span class="state-tag ${stateClass(p.State)}">${p.State || '--'}</span></td>
      <td class="mono">${p.OwningProcess || '--'}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  tableWrap.innerHTML = html;
}

filterInput.addEventListener('input', () => {
  if (tableWrap.querySelector('table')) loadPorts();
});

refreshBtn.addEventListener('click', loadPorts);
loadPorts();
</script>
</body>
</html>
