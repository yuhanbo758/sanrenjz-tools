<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
:root{--bg:#ecfdf5;--fg:#059669;--fg2:#047857;--card:#fff;--border:#a7f3d0;--input:#d1fae5;--text:#064e3b;--sub:#10b981;--radius:10px;--shadow:0 2px 8px rgba(5,150,105,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:32px}
input,select,button{font-family:inherit;font-size:13px;outline:none}
button{cursor:pointer;border:none;border-radius:var(--radius);transition:all .15s}
button:active{transform:scale(.97)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;padding:20px}
#converter-card{background:var(--card);border-radius:16px;padding:28px 32px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px}
#converter-card h2{font-size:16px;font-weight:700;color:var(--fg);text-align:center;margin:0}
#input-row{display:flex;gap:8px;align-items:stretch}
#input-row input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius);background:var(--input);color:var(--text);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
#input-row input:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
#input-row select{min-width:70px;padding:8px;border:2px solid var(--border);border-radius:var(--radius);background:var(--input);color:var(--text);font-weight:600}
#converter-row{display:flex;gap:10px;align-items:center}
#converter-row select{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-weight:500;flex:1;text-align:center}
#converter-row select:focus{border-color:var(--fg)}
#converter-row .arrow{font-size:20px;color:var(--fg);font-weight:700;flex-shrink:0}
#swap-btn{background:var(--input);color:var(--fg);padding:8px 12px;font-size:16px;font-weight:700;border-radius:var(--radius);flex-shrink:0}
#swap-btn:hover{background:var(--border)}
#result-box{background:var(--input);border-radius:var(--radius);padding:20px;text-align:center;border:2px solid var(--fg);min-height:70px;display:flex;align-items:center;justify-content:center}
#result-box .value{font-size:28px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;word-break:break-all}
#result-box .unit{font-size:14px;color:var(--sub);margin-left:6px;font-weight:600}
#type-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#type-tabs button{padding:6px 14px;background:var(--card);color:var(--sub);border:1.5px solid var(--border);font-weight:600;font-size:12px;border-radius:20px}
#type-tabs button:hover{background:var(--input)}
#type-tabs button.active{background:var(--fg);color:#fff;border-color:var(--fg)}
</style>
</head>
<body>
<div id="app">
  <div id="converter-card">
    <h2>单位换算</h2>
    <div id="type-tabs">
      <button class="active" data-type="length">长度</button>
      <button data-type="weight">重量</button>
      <button data-type="temperature">温度</button>
      <button data-type="speed">速度</button>
    </div>
    <div id="input-row">
      <input type="number" id="numInput" value="1" step="any">
      <select id="fromUnit"></select>
    </div>
    <div id="converter-row">
      <select id="toUnit"></select>
      <button id="swapBtn">&#8646;</button>
    </div>
    <div id="result-box">
      <span class="value" id="resultValue">1</span>
      <span class="unit" id="resultUnit"></span>
    </div>
  </div>
</div>
<script>
const api = window.pluginAPI;
const STORAGE_KEY = 'unitconv';
const numInput = document.getElementById('numInput');
const fromUnit = document.getElementById('fromUnit');
const toUnit = document.getElementById('toUnit');
const resultValue = document.getElementById('resultValue');
const resultUnit = document.getElementById('resultUnit');
const swapBtn = document.getElementById('swapBtn');

const UNITS = {
  length: [
    { name: '米 (m)', key: 'm', toBase: 1 },
    { name: '千米 (km)', key: 'km', toBase: 1000 },
    { name: '厘米 (cm)', key: 'cm', toBase: 0.01 },
    { name: '毫米 (mm)', key: 'mm', toBase: 0.001 },
    { name: '英里 (mi)', key: 'mi', toBase: 1609.344 },
    { name: '英尺 (ft)', key: 'ft', toBase: 0.3048 },
    { name: '英寸 (in)', key: 'in', toBase: 0.0254 },
    { name: '海里 (nm)', key: 'nm', toBase: 1852 }
  ],
  weight: [
    { name: '千克 (kg)', key: 'kg', toBase: 1 },
    { name: '克 (g)', key: 'g', toBase: 0.001 },
    { name: '毫克 (mg)', key: 'mg', toBase: 0.000001 },
    { name: '吨 (t)', key: 't', toBase: 1000 },
    { name: '磅 (lb)', key: 'lb', toBase: 0.453592 },
    { name: '盎司 (oz)', key: 'oz', toBase: 0.0283495 },
    { name: '斤', key: 'jin', toBase: 0.5 }
  ],
  temperature: [
    { name: '摄氏度 (°C)', key: 'C', toBase: 1 },
    { name: '华氏度 (°F)', key: 'F', toBase: 1 },
    { name: '开尔文 (K)', key: 'K', toBase: 1 }
  ],
  speed: [
    { name: '米/秒 (m/s)', key: 'ms', toBase: 1 },
    { name: '千米/时 (km/h)', key: 'kmh', toBase: 0.277778 },
    { name: '英里/时 (mph)', key: 'mph', toBase: 0.44704 },
    { name: '节 (kn)', key: 'kn', toBase: 0.514444 }
  ]
};

let currentType = 'length';

function convertTemp(val, from, to) {
  let c;
  if (from === 'C') c = val;
  else if (from === 'F') c = (val - 32) * 5 / 9;
  else c = val - 273.15;
  if (to === 'C') return c;
  if (to === 'F') return c * 9 / 5 + 32;
  return c + 273.15;
}

function calc() {
  const val = parseFloat(numInput.value) || 0;
  const from = fromUnit.value;
  const to = toUnit.value;
  let result;
  if (currentType === 'temperature') {
    result = convertTemp(val, from, to);
  } else {
    const units = UNITS[currentType];
    const fromU = units.find(u => u.key === from);
    const toU = units.find(u => u.key === to);
    result = val * fromU.toBase / toU.toBase;
  }
  resultValue.textContent = Number.isInteger(result) ? String(result) : Number(result.toPrecision(12)).toString();
  resultUnit.textContent = toUnit.selectedOptions[0]?.text.split(' ')[0] || '';
}

function populateUnits() {
  const units = UNITS[currentType];
  fromUnit.innerHTML = units.map(u => `<option value="${u.key}">${u.name}</option>`).join('');
  toUnit.innerHTML = units.map(u => `<option value="${u.key}">${u.name}</option>`).join('');
  if (units.length > 1) { fromUnit.value = units[0].key; toUnit.value = units[1].key; }
  calc();
}

numInput.addEventListener('input', calc);
fromUnit.addEventListener('change', calc);
toUnit.addEventListener('change', calc);
swapBtn.addEventListener('click', () => {
  const tmp = fromUnit.value;
  fromUnit.value = toUnit.value;
  toUnit.value = tmp;
  calc();
});
document.querySelectorAll('#type-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#type-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    populateUnits();
    api.storage.set(STORAGE_KEY, { type: currentType });
  });
});

(async () => {
  const data = await api.storage.get(STORAGE_KEY);
  if (data && data.type && UNITS[data.type]) {
    currentType = data.type;
    document.querySelectorAll('#type-tabs button').forEach(b => {
      b.classList.toggle('active', b.dataset.type === currentType);
    });
  }
  populateUnits();
})();
</script>
</body>
</html>
