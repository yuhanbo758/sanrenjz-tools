<!doctype html><html lang="zh-CN" data-layout="meeting-board"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 会议纪要</title><style>
:root{--a:#0f766e;--bg:#fffaf6;--ink:#18202b;--muted:#687284}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:linear-gradient(129deg,color-mix(in srgb,var(--a) 10%,var(--bg)),var(--bg) 45%);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}.mast{height:106px;flex:none;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--a) 18%,transparent)}.mast h1{margin:0;font-size:24px}.mast p{margin:4px 0 0;color:var(--muted)}.gear{border:1px solid color-mix(in srgb,var(--a) 30%,#ddd);background:white;color:var(--a);border-radius:8px;padding:9px 14px}.modes{display:flex;gap:8px;padding:12px 24px;overflow-x:auto;flex:none}.mode{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:999px;white-space:nowrap}.mode.active{background:var(--a);color:white}.desk{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 24px 20px;flex:1;min-height:0}.source-card,.result-card,.side-card{min-width:0;min-height:0;background:rgba(255,255,255,.9);border:1px solid color-mix(in srgb,var(--a) 16%,#d9dee7);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}.card-head{padding:12px 14px;border-bottom:1px solid #edf0f4;color:var(--muted);font-size:12px}.source,.result{border:0;outline:0;resize:none;padding:16px;flex:1;min-height:0;background:transparent;color:inherit;line-height:1.75}.result{overflow:auto;white-space:pre-wrap}.actions{padding:12px;display:flex;gap:8px}.primary,.stop{border:0;padding:10px 18px;border-radius:999px;color:white;background:var(--a)}.stop{background:#64748b}.side-card{padding:15px}.side-card h3{margin:0 0 12px}.hint{color:var(--muted);font-size:12px}.settings{position:fixed;inset:32px 0 0 auto;width:min(430px,92vw);background:white;box-shadow:-20px 0 60px #0002;padding:22px;z-index:5;display:none;overflow:auto}.settings.open{display:block}.settings label{display:block;margin:12px 0 5px;color:var(--muted)}.settings input{width:100%;padding:10px;border:1px solid #d9dee7;border-radius:8px}.settings button{margin-top:14px;padding:10px 14px;border:0;background:var(--a);color:#fff;border-radius:8px}@media(max-width:960px){.desk{grid-template-columns:1fr}.side-card{display:none}.mast p{display:none}}
</style><style data-composition>.mast{background:#dff7f3}.desk{grid-template-columns:1fr 1fr}.source-card,.result-card{border-radius:2px}.side-card{position:absolute;right:40px;top:48px;width:290px;background:#fffbe8;transform:rotate(1.2deg);box-shadow:4px 6px 18px #0002}.mast{padding-right:350px}</style></head><body><main class="app"><header class="mast"><div><h1>AI 会议纪要</h1><p>把转写文本整理为议题、结论、决策和待办。</p></div><button class="gear">供应商设置</button></header><nav class="modes"><button class="mode active">整理纪要</button><button class="mode">提取决策</button><button class="mode">提取待办</button></nav><section class="desk"><div class="source-card"><div class="card-head">素材与要求</div><textarea class="source" placeholder="粘贴内容，或描述你希望 AI 完成的任务"></textarea><div class="actions"><button class="primary">开始生成</button><button class="stop">取消</button></div></div><div class="result-card"><div class="card-head">生成结果</div><div class="result"></div></div><aside class="side-card"><h3>提取待办</h3><p class="hint">结果将按当前任务的结构输出。模型配置在十个 AI 插件间共享。</p><div class="hint status">等待输入</div></aside></section></main><aside class="settings"><h2>统一供应商配置</h2><label>服务名称</label><input class="provider-name" value="OpenAI 兼容服务"><label>Base URL</label><input class="base-url" value="https://api.openai.com/v1"><label>模型 ID</label><input class="model-id" value="gpt-4o-mini"><label>API Key</label><input class="api-key" type="password" placeholder="仅保存到系统安全存储"><button class="save-settings">保存并共享</button></aside><script>
const api=window.aiAPI,$=s=>document.querySelector(s);let requestId='',mode="整理纪要";document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.textContent});$('.gear').onclick=()=>$('.settings').classList.toggle('open');$('.save-settings').onclick=async()=>{const provider={id:'custom',name:$('.provider-name').value,baseUrl:$('.base-url').value,models:[{id:$('.model-id').value,label:$('.model-id').value,capabilities:['text','vision']}]};const config=await api.getConfig();config.providers=[provider,...config.providers.filter(x=>x.id!=='custom')];config.selections={text:{providerId:'custom',modelId:provider.models[0].id},vision:{providerId:'custom',modelId:provider.models[0].id}};await api.saveConfig(config);if($('.api-key').value)await api.saveProviderSecret('custom',$('.api-key').value);$('.settings').classList.remove('open')};api.onChunk(chunk=>{$('.result').textContent=chunk.text});$('.primary').onclick=async()=>{const text=$('.source').value.trim();if(!text)return;requestId=crypto.randomUUID();$('.result').textContent='';$('.status').textContent='生成中…';const capability="text";const prompt="AI 会议纪要"+' / '+mode+'\n请用中文清晰输出。\n\n'+text;try{const r=await api.complete({requestId,capability,stream:true,messages:[{role:'user',content:prompt}]});$('.result').textContent=r.text;$('.status').textContent='已完成'}catch(e){$('.result').textContent=e.message;$('.status').textContent='失败'}};$('.stop').onclick=()=>requestId&&api.cancel(requestId);window.addEventListener('plugin-enter',e=>{const text=e.detail?.payload||e.detail?.clipboardText||'';if(text)$('.source').value=text});
</script><script data-business>const bar=document.querySelector('.actions');const load=document.createElement('button');load.className='stop';load.textContent='载入转写文本';bar.prepend(load);load.onclick=()=>{const file=aiAPI.pickTranscript();if(file){document.querySelector('.source').value=aiAPI.readTranscript(file);document.querySelector('.status').textContent='转写文本已载入'}};</script></body></html>
