<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XML 工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fbfdf7;--pan:#fff;--sur:#f0f5e8;--brd:#c7d4b5;--txt:#1a2e05;--mu:#5a6c45;--ac:#2da44e;--tag:#1a7f37;--atr:#0550ae;--val:#8250df;--cmt:#6e7781}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);padding-top:32px}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--brd);flex-shrink:0;background:var(--pan)}
.bar span{font-size:14px;font-weight:600;color:var(--ac);margin-right:auto}
.btn{font:12px var(--sans);padding:5px 12px;border:1px solid var(--brd);border-radius:6px;background:var(--pan);color:var(--txt);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--sur)}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.stat{display:flex;align-items:center;gap:12px;padding:4px 14px;border-bottom:1px solid var(--brd);flex-shrink:0;font-size:11px;color:var(--mu);background:var(--sur)}
.stat em{font-style:normal;color:var(--txt);font-family:'JetBrains Mono',monospace;margin:0 2px}
.stat .sp{flex:1}
.main{flex:1;display:flex;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.pane:first-child{border-right:1px solid var(--brd)}
.ph{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;padding:5px 10px;background:var(--sur);border-bottom:1px solid var(--brd);flex-shrink:0}
#editor{flex:1;border:none;background:var(--pan);color:var(--txt);font:13px/1.6 'JetBrains Mono',Consolas,monospace;padding:10px 12px;resize:none;outline:none;white-space:pre;overflow:auto;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--brd);flex-shrink:0;background:var(--sur)}
.tab{padding:5px 12px;border:none;background:none;color:var(--mu);font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.fmtv{flex:1;overflow:auto;padding:10px 12px;font:13px/1.6 'JetBrains Mono',Consolas,monospace;white-space:pre-wrap;min-height:0}
.fmtv .xt{color:var(--tag)}.fmtv .xa{color:var(--atr)}.fmtv .xv{color:var(--val)}.fmtv .xc{color:var(--cmt);font-style:italic}
.treev{flex:1;overflow:auto;padding:6px 4px;font:12px/1.6 'JetBrains Mono',Consolas,monospace;min-height:0}
.treev .empty{color:var(--mu);text-align:center;padding-top:40px;font-family:var(--sans)}
.trow{display:flex;align-items:center;gap:2px;padding:1px 4px;border-radius:3px;white-space:nowrap}
.trow:hover{background:var(--sur)}
.toggle{width:14px;height:14px;border:none;background:none;color:var(--mu);cursor:pointer;font-size:9px;transition:transform .12s;flex-shrink:0}
.toggle.off{transform:rotate(-90deg)}.toggle.none{visibility:hidden}
.ttag{color:var(--tag);font-weight:500}.tatr{color:var(--atr);font-size:11px;margin-left:3px}.tval{color:var(--val);font-size:11px}.ttxt{color:var(--txt);margin-left:3px}.tcount{color:var(--mu);font-size:10px;margin-left:3px;padding:0 4px;border-radius:6px;background:var(--sur)}
.tkids{margin-left:16px;overflow:hidden;transition:max-height .15s}.tkids.off{max-height:0!important;opacity:0}
.flash{position:fixed;top:40px;left:50%;transform:translateX(-50%);padding:6px 16px;background:var(--ac);color:#fff;border-radius:6px;font-size:12px;z-index:100;opacity:0;transition:opacity .2s}
.flash.on{opacity:1}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
@media(max-width:700px){.main{flex-direction:column}.pane:first-child{border-right:none;border-bottom:1px solid var(--brd)}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <span>XML 工作台</span>
    <button class="btn ac" id="fmt">格式化</button>
    <button class="btn" id="min">压缩</button>
    <button class="btn" id="cpy">复制</button>
  </div>
  <div class="stat">
    <span>标签 <em id="tc">0</em></span>
    <span>属性 <em id="ac">0</em></span>
    <span>深度 <em id="dc">0</em></span>
    <span class="sp"></span>
    <button class="btn" id="expa" style="font-size:11px;padding:2px 8px">展开</button>
    <button class="btn" id="coll" style="font-size:11px;padding:2px 8px">折叠</button>
  </div>
  <div class="main">
    <div class="pane"><div class="ph">XML 源码</div><textarea id="editor" spellcheck="false" placeholder="粘贴 XML 或拖入 .xml 文件"></textarea></div>
    <div class="pane">
      <div class="tabs"><button class="tab on" data-t="fmt">格式化</button><button class="tab" data-t="tree">节点树</button></div>
      <div class="fmtv" id="fmtv"></div>
      <div class="treev" id="treev" style="display:none"><div class="empty">输入 XML 后显示节点树</div></div>
    </div>
  </div>
</div>
<div class="flash" id="fl">已复制</div>
<script>
(function(){
const $=id=>document.getElementById(id);const editor=$('editor'),fmtv=$('fmtv'),treev=$('treev');let toggles=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fl(){const f=$('fl');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),1000)}
function fmtXml(x){const c=x.replace(/>\s+</g,'><').trim();let d=0;return c.replace(/(<[^>]+>)/g,'$1\n').split('\n').filter(Boolean).map(t=>{t=t.trim();if(!t)return'';if(/^<\//.test(t))d=Math.max(0,d-1);const l='  '.repeat(d)+t;if(/^<[^!?/][^>]*[^/]>$/.test(t)&&!/<\/[^>]+>$/.test(t)&&!/\/>$/.test(t))d++;return l}).join('\n')}
function minXml(x){return x.replace(/>\s+</g,'><').replace(/^\s+|\s+$/g,'').replace(/\n\s*/g,'')}
function hl(x){let h=esc(x);h=h.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="xc">$1</span>');h=h.replace(/(&lt;\/?)([\w:.-]+)/g,'$1<span class="xt">$2</span>');h=h.replace(/([\w:.-]+)(=)(&quot;[^&]*?&quot;)/g,'<span class="xa">$1</span>$2<span class="xv">$3</span>');return h}
function rf(){const t=editor.value.trim();if(!t){fmtv.innerHTML='<span style="color:var(--mu)">输入 XML 后显示格式化结果</span>';return}try{fmtv.innerHTML=hl(fmtXml(t))}catch(e){fmtv.innerHTML='<span style="color:#cf222e">'+esc(e.message)+'</span>'}}
function bt(xml){toggles=[];treev.innerHTML='';try{const p=new DOMParser();const d=p.parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))throw 0;const r=d.documentElement;if(!r){treev.innerHTML='<div class="empty">无根元素</div>';return}treev.appendChild(mn(r,0))}catch(e){treev.innerHTML='<div class="empty" style="color:#cf222e">XML 解析失败</div>'}}
function mn(el,depth){const node=document.createElement('div');const row=document.createElement('div');row.className='trow';const ch=Array.from(el.children);const has=ch.length>0;const tg=document.createElement('button');tg.className='toggle'+(has?'':' none');tg.textContent='▼';row.appendChild(tg);const tn=document.createElement('span');tn.className='ttag';tn.textContent='<'+el.nodeName+'>';row.appendChild(tn);for(const a of el.attributes){const ae=document.createElement('span');ae.className='tatr';ae.textContent=' '+a.name+'=';row.appendChild(ae);const ve=document.createElement('span');ve.className='tval';ve.textContent='"'+a.value+'"';row.appendChild(ve)}const txt=el.textContent.trim();if(!has&&txt){const te=document.createElement('span');te.className='ttxt';te.textContent=' '+txt;row.appendChild(te)}if(has){const ct=document.createElement('span');ct.className='tcount';ct.textContent=ch.length;row.appendChild(ct);toggles.push(tg);if(depth>=2)tg.classList.add('off');const cc=document.createElement('div');cc.className='tkids'+(tg.classList.contains('off')?' off':'');for(const c of ch)cc.appendChild(mn(c,depth+1));tg.addEventListener('click',e=>{e.stopPropagation();tg.classList.toggle('off');cc.classList.toggle('off')});node.appendChild(row);node.appendChild(cc)}else node.appendChild(row);return node}
function us(){const t=editor.value;$('tc').textContent=(t.match(/<[^/!?][^>]*[^/]>/g)||[]).length;$('ac').textContent=(t.match(/[\w:.-]+=/g)||[]).length;let md=0,cd=0;(t.match(/<\/?[^>]+>|<!--[\s\S]*?-->|<\?[^?]*\?>/g)||[]).forEach(tk=>{if(/^<\//.test(tk))cd=Math.max(0,cd-1);else if(/^<[^!?/]/.test(tk)&&!/\/>$/.test(tk)){cd++;md=Math.max(md,cd)}});$('dc').textContent=md}
function ra(){us();rf();bt(editor.value)}
function st(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('fmtv').style.display=t==='fmt'?'':'none';$('treev').style.display=t==='tree'?'':'none'}
let dt;editor.addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(ra,300)});
editor.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();editor.value=fmtXml(editor.value);ra()}});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>st(b.dataset.t)));
$('fmt').addEventListener('click',()=>{editor.value=fmtXml(editor.value);ra()});
$('min').addEventListener('click',()=>{editor.value=minXml(editor.value);ra()});
$('cpy').addEventListener('click',()=>{if(editor.value.trim()){window.services.clipboard.writeText(editor.value);fl()}});
$('expa').addEventListener('click',()=>{toggles.forEach(t=>t.classList.remove('off'));document.querySelectorAll('.tkids').forEach(c=>c.classList.remove('off'))});
$('coll').addEventListener('click',()=>{toggles.forEach(t=>{if(!t.classList.contains('none'))t.classList.add('off')});document.querySelectorAll('.tkids').forEach(c=>c.classList.add('off'))});
window.addEventListener('plugin-enter',e=>{if(e.detail&&typeof e.detail==='string'){editor.value=e.detail;ra()}});
ra();
})();
</script>
</body>
</html>
