<!DOCTYPE html>
<html lang="zh-CN" data-layout="reading-room">
<head data-business>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 文档阅读器</title>
<style>
:root{--a:#2563eb;--a2:#3b82f6;--as:rgba(37,99,235,.1);--al:rgba(37,99,235,.3);--bg:#f5f8fe;--sf:#fff;--s2:#e8f0fc;--bd:#d0def5;--ink:#0a1e3a;--mt:#5a6b8a;--ft:#9aa8c0;--ok:#16a34a;--err:#dc2626;--mono:'JetBrains Mono',Consolas,monospace;--sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--sf);border-bottom:1px solid var(--bd);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;flex:none}.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}.head p{margin:0;color:var(--mt);font-size:12px}
.spacer{flex:1}
.gear{border:1px solid var(--bd);background:var(--sf);color:var(--a);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}.gear svg{width:14px;height:14px}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
.doc-side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bd);background:var(--sf)}
.doc-head{padding:12px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex:none}
.doc-head .title{font-weight:700;font-size:14px;flex:1}
.doc-head .cnt{font:11px var(--mono);color:var(--ft)}
.doc-text{flex:1;min-height:0;border:0;outline:0;resize:none;padding:18px;font:14px/1.8 var(--sans);background:var(--sf);color:var(--ink)}
.doc-text::placeholder{color:var(--ft)}
.doc-foot{padding:10px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;flex:none;align-items:center}
.doc-btn{border:1px solid var(--bd);background:var(--sf);color:var(--mt);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:5px}
.doc-btn:hover{border-color:var(--al);color:var(--a)}.doc-btn svg{width:13px;height:13px}
.chat-side{display:flex;flex-direction:column;min-height:0}
.chat-head{padding:12px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex:none}
.quick-btn{border:1px solid var(--al);background:var(--as);color:var(--a);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
.quick-btn:hover{background:var(--a);color:#fff}
.chat-list{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--a);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:var(--s2);color:var(--ink);margin-right:auto;border-bottom-left-radius:4px}
.msg.sys{background:transparent;color:var(--ft);font-size:12px;text-align:center;max-width:100%;padding:4px}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ft);gap:10px}
.chat-empty svg{width:48px;height:48px;opacity:.3}
.chat-input{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;flex:none;background:var(--sf)}
.chat-input textarea{flex:1;border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font:14px var(--sans);outline:none;resize:none;height:44px;max-height:120px}
.chat-input textarea:focus{border-color:var(--al)}
.send-btn{border:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-radius:8px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.send-btn:disabled{opacity:.4}.send-btn svg{width:18px;height:18px}
.drawer{position:fixed;top:32px;right:0;bottom:0;width:min(420px,92vw);background:var(--sf);box-shadow:-12px 0 40px rgba(0,0,0,.1);z-index:50;transform:translateX(100%);transition:.25s;overflow:auto;padding:24px}
.drawer.open{transform:translateX(0)}.drawer h2{margin:0 0 16px;font-size:16px}.drawer .close{position:absolute;top:16px;right:16px;border:0;background:transparent;font-size:20px;color:var(--ft);cursor:pointer}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:var(--mt);font-weight:600;margin-bottom:6px}
.field input{width:100%;border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font:14px var(--sans);outline:none;background:var(--s2);color:var(--ink)}.field input:focus{border-color:var(--al)}
.overlay{position:fixed;inset:32px 0 0 0;background:rgba(0,0,0,.3);z-index:40;display:none}.overlay.show{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0a1e3a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c8d4f0;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></div>
    <div><h1>AI 文档阅读器</h1><p>读取文本，生成摘要、目录并围绕文档问答</p></div>
    <div class="spacer"></div>
    <button class="gear" onclick="toggleDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 1-.1 1.2l2 1.5-2 3.4-2.3-1a7 7 0 0 1-2 1.2l-.4 2.5H9l-.4-2.5a7 7 0 0 1-2-1.2l-2.3 1-2-3.4 2-1.5A7 7 0 0 1 4 12a7 7 0 0 1 .1-1.2l-2-1.5 2-3.4 2.3 1a7 7 0 0 1 2-1.2L9 1h4l.4 2.5a7 7 0 0 1 2 1.2l2.3-1 2 3.4-2 1.5A7 7 0 0 1 19 12z"/></svg>供应商设置</button>
  </div>
  <div class="body">
    <div class="doc-side">
      <div class="doc-head"><span class="title">文档内容</span><span class="cnt" id="docCnt">0 字</span>
        <button class="doc-btn" onclick="loadDocument()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/></svg>上传文件</button>
      </div>
      <textarea class="doc-text" id="docText" spellcheck="false" placeholder="粘贴文档内容，或点击「上传文件」加载 TXT/Markdown 文件&#10;&#10;AI 将基于此文档回答你的问题"></textarea>
      <div class="doc-foot"><button class="doc-btn" onclick="clearDoc()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>清空文档</button></div>
    </div>
    <div class="chat-side">
      <div class="chat-head"><button class="quick-btn" onclick="quickAction('摘要')">生成摘要</button><button class="quick-btn" onclick="quickAction('目录')">生成目录</button><button class="quick-btn" onclick="quickAction('要点')">提取要点</button></div>
      <div class="chat-list" id="chatList"><div class="chat-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>输入问题或点击上方快捷按钮开始</span></div></div>
      <div class="chat-input"><textarea id="chatInput" placeholder="针对文档提问…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askAI();}"></textarea><button class="send-btn" id="sendBtn" onclick="askAI()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button></div>
    </div>
  </div>
</main>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<aside class="drawer" id="drawer"><button class="close" onclick="toggleDrawer()">×</button><h2>统一供应商配置</h2>
  <div class="field"><label>服务名称</label><input id="pName" value="OpenAI 兼容服务"></div>
  <div class="field"><label>Base URL</label><input id="pUrl" value="https://api.openai.com/v1"></div>
  <div class="field"><label>模型 ID</label><input id="pModel" value="gpt-4o-mini"></div>
  <div class="field"><label>API Key</label><input id="pKey" type="password" placeholder="仅保存到系统安全存储"></div>
  <button class="send-btn" style="width:100%;border-radius:8px" onclick="saveProvider()">保存并共享</button>
</aside>
<div class="toast" id="toast"></div>
<script src="../../plugin_runtime/ai-provider-manager.js"></script>
<script>
const api=window.aiAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let requestId='';let docContext='';
const providerManager=AIProviderManager.create(api,{capability:'text',notify:toast});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function toggleDrawer(){$('#drawer').classList.toggle('open');$('#overlay').classList.toggle('show');}
$('#docText').addEventListener('input',()=>{$('#docCnt').textContent=$('#docText').value.length+' 字';docContext=$('#docText').value;});
async function loadDocument(){const files=api.pickFiles();if(!files.length)return;try{const text=await api.readDocument(files[0]);$('#docText').value=text;$('#docCnt').textContent=text.length+' 字';docContext=text;}catch(error){toast('读取失败：'+error.message);}}
function clearDoc(){$('#docText').value='';docContext='';$('#docCnt').textContent='0 字';}
function addMsg(text,role){const list=$('#chatList');const empty=list.querySelector('.chat-empty');if(empty)empty.remove();const m=document.createElement('div');m.className='msg '+role;m.textContent=text;list.appendChild(m);list.scrollTop=list.scrollHeight;return m;}
function quickAction(type){
  if(!docContext.trim()){toast('请先输入文档内容');return;}
  const prompts={'摘要':'请为以下文档生成一段简洁的摘要（200字以内）：\n\n','目录':'请为以下文档生成目录大纲，用 Markdown 格式输出：\n\n','要点':'请从以下文档中提取 5-8 个核心要点，用列表格式输出：\n\n'};
  sendToAI(prompts[type]+docContext,type+'生成中…');
}
function askAI(){
  const q=$('#chatInput').value.trim();if(!q){toast('请输入问题');return;}
  if(!docContext.trim()){toast('请先输入文档内容');return;}
  $('#chatInput').value='';addMsg(q,'user');
  sendToAI(`请基于以下文档内容回答问题。\n\n文档：\n${docContext.slice(0,8000)}\n\n问题：${q}`,'思考中…');
}
async function sendToAI(prompt,loadingText){
  const aiMsg=addMsg(loadingText,'ai');requestId=crypto.randomUUID();
  api.onChunk(chunk=>{if(chunk.requestId===requestId)aiMsg.textContent=chunk.text;$('#chatList').scrollTop=$('#chatList').scrollHeight;});
  try{const r=await api.complete({requestId,capability:'text',selection:await providerManager.getSelection(),stream:true,messages:[{role:'user',content:prompt}]});aiMsg.textContent=r.text;}
  catch(e){aiMsg.textContent='错误：'+e.message;}
}
window.addEventListener('plugin-enter',e=>{const text=e.detail?.payload||e.detail?.clipboardText||'';if(text){$('#docText').value=text;$('#docCnt').textContent=text.length+' 字';docContext=text;}});
</script>
</body></html>
