<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
:root{--bg:#eff6ff;--fg:#2563eb;--fg2:#1d4ed8;--card:#fff;--border:#bfdbfe;--input:#dbeafe;--text:#1e3a5f;--sub:#3b82f6;--radius:10px;--shadow:0 1px 3px rgba(37,99,235,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:32px}
input,textarea,select,button{font-family:inherit;font-size:13px;outline:none}
button{cursor:pointer;border:none;border-radius:var(--radius);transition:all .15s}
button:active{transform:scale(.97)}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#input-area{display:flex;gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
#input-area input[type="text"]{flex:2;min-width:160px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input);color:var(--text)}
#input-area input[type="text"]:focus{border-color:var(--fg);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
#input-area select,#input-area input[type="date"]{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input);color:var(--text);min-width:90px}
#input-area select:focus,#input-area input[type="date"]:focus{border-color:var(--fg)}
#input-area button{padding:8px 16px;background:var(--fg);color:#fff;font-weight:600;font-size:12px}
#input-area button:hover{background:var(--fg2)}
#tab-bar{display:flex;gap:2px;padding:8px 14px 0;background:var(--card)}
#tab-bar button{padding:6px 14px;background:transparent;color:var(--sub);font-size:12px;font-weight:500;border-radius:var(--radius) var(--radius) 0 0;border:1px solid transparent;border-bottom:none}
#tab-bar button:hover{background:var(--input)}
#tab-bar button.active{background:var(--bg);color:var(--fg);font-weight:700;border-color:var(--border)}
#task-list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#task-list::-webkit-scrollbar{width:5px}
#task-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.group-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--fg);padding:8px 4px 2px;letter-spacing:.5px;border-bottom:1px solid var(--border);margin-bottom:4px}
.task-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);transition:all .12s}
.task-row:hover{border-color:var(--fg);box-shadow:var(--shadow)}
.task-row.done{opacity:.55;background:var(--input)}
.task-row.done .task-text{text-decoration:line-through}
.task-row input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--fg);flex-shrink:0}
.task-text{flex:1;font-size:13px;line-height:1.4;word-break:break-word}
.task-meta{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.task-meta span{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.priority-high{background:#fef2f2;color:#dc2626}
.priority-mid{background:#fffbeb;color:#d97706}
.priority-low{background:#f0fdf4;color:#16a34a}
.task-date{font-size:10px;color:var(--sub);white-space:nowrap}
.task-del{color:var(--sub);cursor:pointer;font-size:14px;line-height:1;padding:2px 6px;border-radius:4px;opacity:.4;transition:all .12s}
.task-del:hover{background:#fef2f2;color:#dc2626;opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="input-area">
    <input type="text" id="taskInput" placeholder="添加新任务...">
    <select id="prioritySelect"><option value="1">高</option><option value="2" selected>中</option><option value="3">低</option></select>
    <select id="groupSelect"><option value="">默认分组</option></select>
    <input type="date" id="dateInput">
    <button id="addBtn">添加</button>
  </div>
  <div id="tab-bar">
    <button class="active" data-tab="all">全部</button>
    <button data-tab="active">进行中</button>
    <button data-tab="done">已完成</button>
  </div>
  <div id="task-list"></div>
</div>
<script>
const api = window.pluginAPI;
const STORAGE_KEY = 'todos';
const taskInput = document.getElementById('taskInput');
const prioritySelect = document.getElementById('prioritySelect');
const groupSelect = document.getElementById('groupSelect');
const dateInput = document.getElementById('dateInput');
const addBtn = document.getElementById('addBtn');
const taskList = document.getElementById('task-list');
let tasks = [];
let currentTab = 'all';

const PRIORITY = { '1': '高', '2': '中', '3': '低' };
const PRIORITY_CLASS = { '1': 'priority-high', '2': 'priority-mid', '3': 'priority-low' };

function getGroups() {
  const gs = new Set(tasks.map(t => t.group).filter(Boolean));
  groupSelect.innerHTML = '<option value="">默认分组</option>' + [...gs].map(g => `<option>${g}</option>`).join('');
}

function render() {
  let filtered = tasks;
  if (currentTab === 'active') filtered = tasks.filter(t => !t.done);
  else if (currentTab === 'done') filtered = tasks.filter(t => t.done);
  const groups = {};
  filtered.forEach(t => {
    const key = t.group || '默认分组';
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });
  let html = '';
  for (const [gname, items] of Object.entries(groups)) {
    html += `<div class="group-label">${gname} (${items.length})</div>`;
    items.forEach(t => {
      const date = t.date ? new Date(t.date).toLocaleDateString('zh-CN',{month:'short',day:'numeric'}) : '';
      html += `<div class="task-row${t.done?' done':''}" data-id="${t.id}">
        <input type="checkbox" ${t.done?'checked':''}>
        <div class="task-text">${t.text||''}</div>
        <div class="task-meta">
          <span class="${PRIORITY_CLASS[t.priority]||'priority-mid'}">${PRIORITY[t.priority]||'中'}</span>
          ${date?`<span class="task-date">${date}</span>`:''}
        </div>
        <div class="task-del" data-action="del">&times;</div>
      </div>`;
    });
  }
  if (!html) html = '<div style="text-align:center;padding:40px;color:var(--sub);font-size:13px">暂无任务</div>';
  taskList.innerHTML = html;
  taskList.querySelectorAll('.task-row input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.closest('.task-row').dataset.id;
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = cb.checked; t.updatedAt = Date.now(); render(); persist(); }
    });
  });
  taskList.querySelectorAll('.task-del').forEach(del => {
    del.addEventListener('click', () => {
      const id = del.closest('.task-row').dataset.id;
      tasks = tasks.filter(t => t.id !== id);
      render(); persist(); getGroups();
    });
  });
  getGroups();
}

async function persist() { await api.storage.set(STORAGE_KEY, tasks); }

function addTask() {
  const text = taskInput.value.trim();
  if (!text) return;
  tasks.unshift({ id: String(Date.now()), text, priority: prioritySelect.value, group: groupSelect.value, date: dateInput.value, done: false, createdAt: Date.now(), updatedAt: Date.now() });
  taskInput.value = ''; dateInput.value = '';
  render(); persist();
}

addBtn.addEventListener('click', addTask);
taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTask(); } });
document.querySelectorAll('#tab-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tab-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});
(async () => {
  const data = await api.storage.get(STORAGE_KEY);
  tasks = Array.isArray(data) ? data : [];
  render();
})();
</script>
</body>
</html>
