<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--sidebar:#fafbfc;--border:#d0d7de;--text:#24292f;--muted:#656d76;--accent:#0969da;--key:#cf222e;--str:#0a3069;--num:#0550ae;--bool:#8250df;--nil:#656d76}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);padding-top:32px}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.toolbar span{font-size:14px;font-weight:600;margin-right:auto}
.btn{font:12px var(--sans);padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#0860ca}
.query{display:flex;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.query input{flex:1;padding:4px 10px;border:1px solid var(--border);border-radius:5px;font:12px 'JetBrains Mono',Consolas,monospace;outline:none}
.query input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(9,105,218,.15)}
.query input::placeholder{color:var(--muted)}
.main{flex:1;display:flex;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.pane:first-child{border-right:1px solid var(--border)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--sidebar);border-bottom:1px solid var(--border);flex-shrink:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#editor{flex:1;border:none;background:var(--bg);color:var(--text);font:13px/1.6 'JetBrains Mono',Consolas,monospace;padding:12px 14px;resize:none;outline:none;white-space:pre;overflow:auto;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--sidebar)}
.tab{padding:6px 14px;border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;border-bottom:2px solid transparent;transition:all .1s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tree{flex:1;overflow:auto;font:12px/1.6 'JetBrains Mono',Consolas,monospace;padding:8px 6px;min-height:0}
.tree .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:8px;font-family:var(--sans)}
.tree .empty b{font-size:36px;font-weight:300;opacity:.3}
.trow{display:flex;align-items:center;gap:2px;padding:1px 4px;border-radius:3px;white-space:nowrap;cursor:default}
.trow:hover{background:#f3f4f6}
.toggle{width:14px;height:14px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:9px;transition:transform .12s;flex-shrink:0}
.toggle.off{transform:rotate(-90deg)}.toggle.none{visibility:hidden}
.tk{color:var(--key)}.tc{color:var(--muted);margin:0 1px}.ts{color:var(--str)}.tn{color:var(--num)}.tb{color:var(--bool)}.tl{color:var(--nil);font-style:italic}
.tbracket{color:var(--muted)}.tcount{color:var(--muted);font-size:10px;margin-left:3px;padding:0 4px;border-radius:8px;background:#f3f4f6}
.tkids{margin-left:16px;overflow:hidden;transition:max-height .15s}.tkids.off{max-height:0!important;opacity:0}
.cp{opacity:0;margin-left:6px;padding:1px 5px;font-size:10px;border-radius:3px;background:#f3f4f6;color:var(--muted);cursor:pointer;border:1px solid var(--border)}
.trow:hover .cp{opacity:1}.cp:hover{color:var(--accent);border-color:var(--accent)}
.fmtv{flex:1;overflow:auto;padding:10px 12px;font:13px/1.6 'JetBrains Mono',Consolas,monospace;white-space:pre-wrap;min-height:0}
.fmtv .jk{color:var(--key)}.fmtv .js{color:var(--str)}.fmtv .jn{color:var(--num)}.fmtv .jb{color:var(--bool)}.fmtv .jl{color:var(--nil);font-style:italic}
.pathv{flex:1;overflow:auto;padding:10px 12px;font:13px/1.6 'JetBrains Mono',Consolas,monospace;min-height:0}
.pathv .err{color:#cf222e}.pathv .hint{color:var(--muted);text-align:center;padding-top:30px;font-family:var(--sans)}
.flash{position:fixed;top:40px;left:50%;transform:translateX(-50%);padding:6px 16px;background:#1a7f37;color:#fff;border-radius:6px;font-size:12px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.flash.on{opacity:1}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:700px){.main{flex-direction:column}.pane:first-child{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <span>JSON 工作台</span>
    <button class="btn primary" id="fmt">格式化</button>
    <button class="btn" id="min">压缩</button>
    <button class="btn" id="cpy">复制</button>
  </div>
  <div class="query">
    <input id="path" placeholder="路径查询，如 users.0.name" spellcheck="false">
    <button class="btn" id="qry">查询</button>
    <button class="btn" id="expa">⊕</button>
    <button class="btn" id="coll">⊖</button>
  </div>
  <div class="main">
    <div class="pane">
      <div class="ph"><span>源码</span><span id="info" style="font-family:monospace">0</span></div>
      <textarea id="editor" spellcheck="false" placeholder='粘贴 JSON 或拖入 .json 文件'></textarea>
    </div>
    <div class="pane">
      <div class="tabs">
        <button class="tab on" data-t="tree">树形</button>
        <button class="tab" data-t="fmt">格式化</button>
        <button class="tab" data-t="path">路径结果</button>
      </div>
      <div class="tree" id="treev"><div class="empty"><b>{ }</b><div>输入 JSON 后显示树形结构</div></div></div>
      <div class="fmtv" id="fmtv" style="display:none"></div>
      <div class="pathv" id="pathv" style="display:none"><div class="hint">输入路径后点击查询</div></div>
    </div>
  </div>
</div>
<div class="flash" id="fl">已复制</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const editor=$('editor'),treev=$('treev'),fmtv=$('fmtv'),pathv=$('pathv'),path=$('path');
let parsed=null,tab='tree',toggles=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fl(){const f=$('fl');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),1000)}
function parse(){const t=editor.value.trim();if(!t){parsed=null;return null}try{parsed=JSON.parse(t);return parsed}catch(e){parsed=null;return null}}
function vc(v){return v===null?'tl':typeof v==='string'?'ts':typeof v==='number'?'tn':typeof v==='boolean'?'tb':''}
function fv(v){if(v===null)return'null';if(typeof v==='string')return'"'+esc(v)+'"';return esc(String(v))}
function bt(data){toggles=[];treev.innerHTML='';if(!data){treev.innerHTML='<div class="empty"><b>{ }</b><div>输入 JSON 后显示树形结构</div></div>';return}treev.appendChild(mn(data,null,'$',0))}
function mn(val,key,path,depth){const node=document.createElement('div');const row=document.createElement('div');row.className='trow';const isObj=val!==null&&typeof val==='object';const tg=document.createElement('button');tg.className='toggle'+(isObj?'':' none');tg.textContent='▼';row.appendChild(tg);if(key!==null){const k=document.createElement('span');k.className='tk';k.textContent=key;row.appendChild(k);const c=document.createElement('span');c.className='tc';c.textContent=':';row.appendChild(c)}if(isObj){const isArr=Array.isArray(val);const entries=isArr?val.map((v,i)=>[i,v]):Object.entries(val);const br=document.createElement('span');br.className='tbracket';br.textContent=isArr?'[':'{';row.appendChild(br);const ct=document.createElement('span');ct.className='tcount';ct.textContent=entries.length;row.appendChild(ct);const cb=document.createElement('span');cb.className='tbracket';cb.textContent=isArr?']':'}';row.appendChild(cb);if(entries.length===0){tg.className='toggle none'}else{toggles.push(tg)}if(depth>=2)tg.classList.add('off');const ch=document.createElement('div');ch.className='tkids'+(tg.classList.contains('off')?' off':'');for(const[k2,v2]of entries){const cp=path+(isArr?`[${k2}]`:'.'+k2);ch.appendChild(mn(v2,k2,cp,depth+1))}if(entries.length>0){tg.addEventListener('click',e=>{e.stopPropagation();tg.classList.toggle('off');ch.classList.toggle('off')})}node.appendChild(row);node.appendChild(ch)}else{const v=document.createElement('span');v.className=vc(val);v.textContent=fv(val);row.appendChild(v);const cp=document.createElement('span');cp.className='cp';cp.textContent='复制';cp.addEventListener('click',e=>{e.stopPropagation();window.services.clipboard.writeText(val===null?'null':typeof val==='string'?val:JSON.stringify(val));fl()});row.appendChild(cp);node.appendChild(row)}return node}
function hl(json){return esc(json).replace(/("(?:\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g,m=>{let c='jn';if(/^"/.test(m))c=/:\s*$/.test(m)?'jk':'js';else if(/^(true|false)$/.test(m))c='jb';else if(m==='null')c='jl';return'<span class="'+c+'">'+m+'</span>'})}
function rf(){if(!parsed){fmtv.innerHTML='<span style="color:var(--muted)">输入有效 JSON 后显示</span>';return}fmtv.innerHTML=hl(JSON.stringify(parsed,null,2))}
function qp(obj,q){if(!q.trim())return obj;const parts=q.replace(/\[(\d+)\]/g,'.$1').split('.').filter(Boolean);let cur=obj;for(const p of parts){if(cur==null)return undefined;if(Array.isArray(cur)){const i=parseInt(p,10);if(isNaN(i))throw new Error('数组索引无效: '+p);cur=cur[i]}else if(typeof cur==='object')cur=cur[p];else throw new Error('无法查询: '+p)}return cur}
function rq(){if(!parsed){pathv.innerHTML='<span class="err">请先输入有效 JSON</span>';return}const q=path.value.trim();if(!q){pathv.innerHTML='<div class="hint">输入路径后点击查询</div>';return}try{const r=qp(parsed,q);if(r===undefined){pathv.innerHTML='<span class="err">未匹配: '+esc(q)+'</span>'}else if(typeof r==='object'&&r!==null){pathv.innerHTML='<span style="color:var(--muted)">'+esc(q)+'</span>\n\n'+hl(JSON.stringify(r,null,2))}else{pathv.innerHTML='<span style="color:var(--muted)">'+esc(q)+'</span>\n\n<span class="'+vc(r)+'">'+fv(r)+'</span>'}st('path')}catch(e){pathv.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
function st(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.getElementById('treev').style.display=t==='tree'?'':'none';document.getElementById('fmtv').style.display=t==='fmt'?'':'none';document.getElementById('pathv').style.display=t==='path'?'':'none'}
function ra(){parse();if(parsed){bt(parsed);rf()}else{bt(null);fmtv.innerHTML='<span style="color:var(--muted)">输入有效 JSON 后显示</span>'}}
function doFmt(){const d=parse();if(!d&&editor.value.trim())return;if(!d)return;editor.value=JSON.stringify(d,null,2);$('info').textContent=editor.value.length;ra()}
function doMin(){const d=parse();if(!d&&editor.value.trim())return;if(!d)return;editor.value=JSON.stringify(d);$('info').textContent=editor.value.length;ra()}
let dt;editor.addEventListener('input',()=>{$('info').textContent=editor.value.length;clearTimeout(dt);dt=setTimeout(ra,300)});
editor.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();doFmt()}if(e.key==='Tab'){e.preventDefault();const s=editor.selectionStart,en=editor.selectionEnd;editor.value=editor.value.substring(0,s)+'  '+editor.value.substring(en);editor.selectionStart=editor.selectionEnd=s+2}});
path.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();rq()}});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>st(b.dataset.t)));
$('fmt').addEventListener('click',doFmt);$('min').addEventListener('click',doMin);$('cpy').addEventListener('click',()=>{if(editor.value.trim()){window.services.clipboard.writeText(editor.value);fl()}});
$('qry').addEventListener('click',rq);$('expa').addEventListener('click',()=>{toggles.forEach(t=>t.classList.remove('off'));document.querySelectorAll('.tkids').forEach(c=>c.classList.remove('off'))});
$('coll').addEventListener('click',()=>{toggles.forEach(t=>{if(!t.classList.contains('none'))t.classList.add('off')});document.querySelectorAll('.tkids').forEach(c=>c.classList.add('off'))});
window.addEventListener('plugin-enter',e=>{if(e.detail&&typeof e.detail==='string'){editor.value=e.detail;$('info').textContent=editor.value.length;ra()}});
ra();
})();
</script>
</body>
</html>
