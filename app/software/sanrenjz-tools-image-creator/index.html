<!DOCTYPE html>
<html lang="zh-CN" data-layout="canvas-islands">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片创作台</title>
<style>
:root{
  --accent:#e8590c;--accent-2:#fd7e14;--accent-soft:rgba(232,89,12,.1);--accent-line:rgba(232,89,12,.3);
  --bg:#fdf7f3;--surface:#fff;--surface-2:#fcefdf;--border:#f0ddca;
  --ink:#2d1a08;--muted:#7a6354;--faint:#a8907a;
  --ok:#16a34a;--err:#dc2626;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.tabs{display:flex;gap:6px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:7px}
.tab svg{width:15px;height:15px}
.tab:hover{background:var(--surface-2)}.tab.active{background:var(--accent);color:#fff}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px;gap:0;overflow:hidden}
.canvas-area{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:16px}
.canvas-stage{flex:1;min-height:0;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-conic-gradient(#f5f0ea 0% 25%,#faf6f1 0% 50%) 50%/16px 16px;position:relative}
.canvas-stage canvas{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.empty-c{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--faint);cursor:pointer}
.empty-c svg{width:48px;height:48px;opacity:.35}
.side{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:auto}
.side-h{padding:16px 20px;border-bottom:1px solid var(--border);flex:none}
.side-h h2{margin:0 0 4px;font-size:15px;font-weight:700}
.side-h p{margin:0;font-size:12px;color:var(--muted)}
.opts{padding:18px 20px;flex:none}
.opt{margin-bottom:16px}
.opt label{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:14px var(--sans);color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent-line)}
.sel{width:100%;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;outline:none}
.color-inp{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface-2)}
.slider-row{display:flex;align-items:center;gap:10px}
.slider{flex:1;accent-color:var(--accent)}
.slider-val{font:600 13px var(--mono);color:var(--accent);min-width:48px;text-align:right}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pos-btn{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:8px;cursor:pointer;color:var(--muted);transition:.12s}
.pos-btn:hover{border-color:var(--accent-line);color:var(--accent)}
.pos-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.actions{padding:0 20px 20px;margin-top:auto;display:flex;flex-direction:column;gap:10px;flex:none}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent-line)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5}
.panel{display:none;flex-direction:column;gap:0;flex:1;min-height:0}
.panel.active{display:flex}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d1a08;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e0cdb8;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5zM2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg></div>
    <div><h1>图片创作台</h1><p>水印、拼接和截图美化共用一块可视画布</p></div>
    <div class="spacer"></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tool="image-watermark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>文字水印</button>
    <button class="tab" data-tool="image-collage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>图片拼接</button>
    <button class="tab" data-tool="screenshot-beautifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 3v18"/></svg>截图美化</button>
  </div>
  <div class="body">
    <div class="canvas-area">
      <div class="canvas-stage" id="stage">
        <div class="empty-c" id="emptyC" onclick="pickImage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>点击选择图片</span>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="side-h"><h2 id="optTitle">文字水印</h2><p id="optDesc">在图片上叠加文字水印</p></div>
      <div class="opts">
        <div class="panel active" data-panel="image-watermark">
          <div class="opt"><label>水印文字</label><input class="inp" id="wmText" value="三人聚智" placeholder="水印文字"></div>
          <div class="opt"><label>字体大小</label><div class="slider-row"><input type="range" class="slider" id="wmSize" min="12" max="120" value="36"><span class="slider-val" id="wmSizeVal">36</span></div></div>
          <div class="opt"><label>不透明度</label><div class="slider-row"><input type="range" class="slider" id="wmOpacity" min="10" max="100" value="50"><span class="slider-val" id="wmOpacityVal">50%</span></div></div>
          <div class="opt"><label>文字颜色</label><input type="color" class="color-inp" id="wmColor" value="#ffffff"></div>
          <div class="opt"><label>位置</label><div class="pos-grid" id="wmPos">
            <button class="pos-btn" data-pos="tl">↖</button><button class="pos-btn" data-pos="tc">↑</button><button class="pos-btn" data-pos="tr">↗</button>
            <button class="pos-btn" data-pos="ml">←</button><button class="pos-btn active" data-pos="mc">●</button><button class="pos-btn" data-pos="mr">→</button>
            <button class="pos-btn" data-pos="bl">↙</button><button class="pos-btn" data-pos="bc">↓</button><button class="pos-btn" data-pos="br">↘</button>
          </div></div>
        </div>
        <div class="panel" data-panel="image-collage">
          <div class="opt"><label>布局</label><select class="sel" id="cgLayout"><option value="2">2 列</option><option value="3">3 列</option><option value="4">4 列</option></select></div>
          <div class="opt"><label>间距 (px)</label><div class="slider-row"><input type="range" class="slider" id="cgGap" min="0" max="40" value="8"><span class="slider-val" id="cgGapVal">8</span></div></div>
          <div class="opt"><label>背景色</label><input type="color" class="color-inp" id="cgBg" value="#f5f0ea"></div>
          <div class="opt"><label>已选图片</label><div id="cgCount" style="font:13px var(--mono);color:var(--muted)">0 张</div></div>
        </div>
        <div class="panel" data-panel="screenshot-beautifier">
          <div class="opt"><label>圆角 (px)</label><div class="slider-row"><input type="range" class="slider" id="sbRadius" min="0" max="60" value="12"><span class="slider-val" id="sbRadiusVal">12</span></div></div>
          <div class="opt"><label>边距 (px)</label><div class="slider-row"><input type="range" class="slider" id="sbPadding" min="0" max="120" value="40"><span class="slider-val" id="sbPaddingVal">40</span></div></div>
          <div class="opt"><label>背景色</label><input type="color" class="color-inp" id="sbBg" value="#e8590c"></div>
          <div class="opt"><label>阴影强度</label><div class="slider-row"><input type="range" class="slider" id="sbShadow" min="0" max="60" value="30"><span class="slider-val" id="sbShadowVal">30</span></div></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="pickBtn">选择图片</button>
        <button class="btn primary" id="exportBtn" disabled>导出图片</button>
      </div>
    </aside>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let current='image-watermark';let mainImg=null;let collageImgs=[];
const titles={watermark:{t:'文字水印',d:'在图片上叠加文字水印'},collage:{t:'图片拼接',d:'将多张图片拼成网格'},screenshot:{t:'截图美化',d:'为截图添加圆角阴影背景'}};
$$('.tab').forEach(t=>t.onclick=()=>{current=t.dataset.tool;const k=current.split('-')[1]||'screenshot';const key=k==='screenshot'?'screenshot':k==='collage'?'collage':'watermark';$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('[data-panel]').forEach(p=>p.classList.toggle('active',p.dataset.panel===current));$('#optTitle').textContent=titles[key].t;$('#optDesc').textContent=titles[key].d;resetCanvas();});
['wmSize','wmOpacity','cgGap','sbRadius','sbPadding','sbShadow'].forEach(id=>{$('#'+id).oninput=e=>{const v=$('#'+id+'Val');if(v)v.textContent=(id==='wmOpacity'?e.target.value+'%':e.target.value);render();};});
['wmText','wmColor','cgBg','sbBg'].forEach(id=>{$('#'+id).oninput=render;});
$('#cgLayout').onchange=render;
$$('#wmPos .pos-btn').forEach(b=>b.onclick=()=>{$$('#wmPos .pos-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();});
$('#pickBtn').onclick=pickImage;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function pickImage(){
  if(current==='image-collage'){const sel=api.selectFiles({multiple:true,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});if(sel&&sel.length){collageImgs=sel;$('#cgCount').textContent=collageImgs.length+' 张';renderCollage();$('#exportBtn').disabled=false;}return;}
  const sel=api.selectFiles({multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});const f=Array.isArray(sel)?sel[0]:sel;if(f)loadMain(f);
}
function loadMain(f){const img=new Image();img.onload=()=>{mainImg=img;const empty=$('#emptyC');if(empty)empty.style.display='none';render();$('#exportBtn').disabled=false;};img.src=api.readFileDataUrl(f);}
function resetCanvas(){$('#stage').innerHTML=mainImg?'':'<div class="empty-c" id="emptyC" onclick="pickImage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg><span>点击选择图片</span></div>';if(mainImg&&current!=='image-collage')render();else if(current==='image-collage'&&collageImgs.length)renderCollage();}
function render(){
  if(!mainImg||current==='image-collage')return;
  const stage=$('#stage');let canvas=stage.querySelector('canvas');if(!canvas){canvas=document.createElement('canvas');stage.innerHTML='';stage.appendChild(canvas);}
  if(current==='image-watermark')renderWatermark(canvas);else if(current==='screenshot-beautifier')renderScreenshot(canvas);
}
function renderWatermark(canvas){
  const img=mainImg;canvas.width=img.width;canvas.height=img.height;const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0);const text=$('#wmText').value||'';if(!text)return;
  const size=+$('#wmSize').value;const opacity=+$('#wmOpacity').value/100;const color=$('#wmColor').value;
  ctx.font=`bold ${size}px -apple-system, "Microsoft YaHei", sans-serif`;ctx.fillStyle=color;ctx.globalAlpha=opacity;
  ctx.textBaseline='middle';const pos=$$('#wmPos .pos-btn.active')[0]?.dataset.pos||'mc';
  const m=20;const metrics=ctx.measureText(text);
  const positions={tl:[m,m+m/2],tc:[(img.width-metrics.width)/2,m+m/2],tr:[img.width-metrics.width-m,m+m/2],ml:[m,img.height/2],mc:[(img.width-metrics.width)/2,img.height/2],mr:[img.width-metrics.width-m,img.height/2],bl:[m,img.height-m],bc:[(img.width-metrics.width)/2,img.height-m],br:[img.width-metrics.width-m,img.height-m]};
  const [x,y]=positions[pos];ctx.fillText(text,x,y);ctx.globalAlpha=1;
}
function renderCollage(){
  if(!collageImgs.length)return;const stage=$('#stage');let canvas=stage.querySelector('canvas');if(!canvas){canvas=document.createElement('canvas');stage.innerHTML='';stage.appendChild(canvas);}
  const cols=+$('#cgLayout').value;const gap=+$('#cgGap').value;const bg=$('#cgBg').value;
  const loaded=[];let loadedCount=0;
  collageImgs.forEach((f,i)=>{const img=new Image();img.onload=()=>{loaded[i]=img;loadedCount++;if(loadedCount===collageImgs.length)drawCollage(canvas,loaded,cols,gap,bg);};img.src=api.readFileDataUrl(f);});
}
function drawCollage(canvas,imgs,cols,gap,bg){
  const rows=Math.ceil(imgs.length/cols);const cellW=Math.max(...imgs.map(i=>i.width))/2;const cellH=Math.max(...imgs.map(i=>i.height))/2;
  canvas.width=cols*cellW+(cols+1)*gap;canvas.height=rows*cellH+(rows+1)*gap;
  const ctx=canvas.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  imgs.forEach((img,i)=>{const r=Math.floor(i/cols),c=i%cols;const x=gap+c*(cellW+gap),y=gap+r*(cellH+gap);
    const scale=Math.min(cellW/img.width,cellH/img.height);const w=img.width*scale,h=img.height*scale;
    ctx.drawImage(img,x+(cellW-w)/2,y+(cellH-h)/2,w,h);});
}
function renderScreenshot(canvas){
  const img=mainImg;const radius=+$('#sbRadius').value;const padding=+$('#sbPadding').value;const bg=$('#sbBg').value;const shadow=+$('#sbShadow').value;
  canvas.width=img.width+padding*2;canvas.height=img.height+padding*2;const ctx=canvas.getContext('2d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  const x=padding,y=padding;
  if(shadow>0){ctx.shadowColor='rgba(0,0,0,'+(shadow/100*0.5)+')';ctx.shadowBlur=shadow;ctx.shadowOffsetY=shadow/3;}
  ctx.save();const r=radius;ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,img.width,img.height,r);}else{ctx.rect(x,y,img.width,img.height);}
  ctx.clip();ctx.drawImage(img,x,y);ctx.restore();ctx.shadowColor='transparent';
}
$('#exportBtn').onclick=()=>{
  const canvas=$('#stage canvas');if(!canvas){toast('请先加载图片');return;}
  const dataUrl=canvas.toDataURL('image/png');
  const saved=api.saveResult({title:'保存图片',defaultPath:'创作结果.png',filters:[{name:'PNG',extensions:['png']}],dataUrl:dataUrl});if(!saved.cancelled)toast('已保存');
};
window.addEventListener('plugin-enter',e=>{const f=e.detail?.action?.payload||e.detail?.action?.clipboardText||e.detail?.payload||e.detail?.clipboardText||'';if(f&&/\.(png|jpe?g|webp|bmp)$/i.test(f))loadMain(f);});
</script>
</body></html>
