<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>局域网快传</title>
<style>
:root{font:15px/1.5 system-ui,'Microsoft YaHei',sans-serif;color:#17363b;background:#eef8fa}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:680px;margin:auto}h1{font-size:23px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}p{margin:0;color:#587b80}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.pill{border-radius:99px;background:#d5f3eb;color:#087b60;padding:5px 11px;font-size:12px}.card{background:#fff;border:1px solid #c4e5e9;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 4px 20px #16535d0a}textarea{width:100%;min-height:110px;resize:vertical}textarea,input[type=file]{border:1px solid #b9dadd;border-radius:9px;padding:11px;background:#f7fcfd;font:inherit}input[type=file]{width:100%;margin-bottom:10px}button,.download{display:inline-block;border:0;border-radius:9px;padding:10px 15px;background:#008b97;color:#fff;font:600 14px system-ui;cursor:pointer;text-decoration:none}button.secondary{background:#e2f2f4;color:#17636c}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.item{border:1px solid #d4e9ec;border-radius:9px;padding:11px;margin-top:8px;overflow-wrap:anywhere}.item strong{display:block}.item p{white-space:pre-wrap;max-height:100px;overflow:auto;margin:5px 0}.meta{font-size:12px;color:#75949a}.progress{height:6px;background:#e1f0f2;border-radius:9px;margin:10px 0;overflow:hidden}.progress>div{height:100%;width:0;background:#009ba6}.message{min-height:21px;color:#a13b31;font-size:13px}
</style>
</head>
<body><main>
<div class="top"><div><h1>局域网快传</h1><p>向电脑发送，或从电脑取回</p></div><span class="pill">同一局域网</span></div>
<section class="card"><h2>发送文字到电脑</h2><textarea id="text" placeholder="输入或粘贴文字"></textarea><div class="row"><button id="sendText">发送文字</button><span class="message" id="textMessage"></span></div></section>
<section class="card"><h2>发送文件到电脑</h2><input id="files" type="file" multiple><p class="meta">支持多选，单个文件上限 200 MB</p><div class="progress"><div id="progress"></div></div><div class="row"><button id="sendFiles">发送文件</button><span class="message" id="fileMessage"></span></div></section>
<section class="card"><div class="top" style="margin:0"><h2>电脑分享给我</h2><button class="secondary" id="refresh">刷新</button></div><div id="shares"><p>加载中…</p></div></section>
</main><script>
const token=new URLSearchParams(location.search).get('token');
const endpoint=path=>`${path}?token=${encodeURIComponent(token||'')}`;
const $=id=>document.getElementById(id);
async function json(response){const data=await response.json();if(!response.ok)throw new Error(data.error||`请求失败 (${response.status})`);return data;}
$('sendText').onclick=async()=>{const button=$('sendText');button.disabled=true;$('textMessage').textContent='发送中…';try{await json(await fetch(endpoint('/api/text'),{method:'POST',body:$('text').value}));$('text').value='';$('textMessage').textContent='已送达电脑';}catch(error){$('textMessage').textContent=error.message;}finally{button.disabled=false;}};
function upload(file){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',endpoint('/api/file'));xhr.setRequestHeader('X-Filename',encodeURIComponent(file.name));xhr.upload.onprogress=event=>{if(event.lengthComputable)$('progress').style.width=`${Math.round(event.loaded/event.total*100)}%`;};xhr.onload=()=>{let data;try{data=JSON.parse(xhr.responseText);}catch{data={};}xhr.status===200?resolve():reject(new Error(data.error||`上传失败 (${xhr.status})`));};xhr.onerror=()=>reject(new Error('网络连接中断'));xhr.send(file);});}
$('sendFiles').onclick=async()=>{const files=[...$('files').files];if(!files.length)return $('fileMessage').textContent='请先选择文件';const button=$('sendFiles');button.disabled=true;let done=0;try{for(const file of files){$('fileMessage').textContent=`正在发送 ${done+1}/${files.length}：${file.name}`;await upload(file);done++;$('progress').style.width='0';}$('files').value='';$('fileMessage').textContent=`已送达 ${done} 个文件`;}catch(error){$('fileMessage').textContent=`已送达 ${done} 个；${error.message}`;}finally{button.disabled=false;}};
async function copyText(text,button){try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();if(!document.execCommand('copy'))throw new Error('复制失败');field.remove();}button.textContent='已复制';}catch{button.textContent='请长按上方文字复制';}}
async function refresh(){const box=$('shares');try{const data=await json(await fetch(endpoint('/api/state')));box.replaceChildren();if(!data.shares.length){const p=document.createElement('p');p.textContent='电脑还没有分享内容';box.append(p);return;}for(const item of data.shares){const row=document.createElement('div');row.className='item';const title=document.createElement('strong');title.textContent=item.name;row.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=item.kind==='file'?`${(item.bytes/1024).toFixed(1)} KB 文件`:'文字';row.append(meta);if(item.kind==='text'){const p=document.createElement('p');p.textContent=item.text;row.append(p);const button=document.createElement('button');button.className='secondary';button.textContent='复制文字';button.onclick=()=>copyText(item.text,button);row.append(button);}else{const link=document.createElement('a');link.className='download';link.textContent='下载文件';link.href=endpoint(`/api/download/${encodeURIComponent(item.id)}`);row.append(link);}box.append(row);}}catch(error){box.textContent=error.message;}}
$('refresh').onclick=refresh;refresh();
</script></body></html>
