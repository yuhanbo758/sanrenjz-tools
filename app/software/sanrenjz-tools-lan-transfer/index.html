<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>局域网快传</title>
<style>
:root{--bg:#f0fdfa;--panel:#fff;--text:#134e4a;--muted:#5b8c88;--border:#ccfbf1;--accent:#0d9488;--accent2:#14b8a6;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.top-panel{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.server-toggle{width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .3s;flex-shrink:0}
.server-toggle.running{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 15%,transparent)}
.server-info{flex:1;min-width:0}
.server-info h1{font-size:18px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.server-info .port-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.server-info .port-row input{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:monospace;text-align:center;outline:none}
.server-info .port-row input:focus{border-color:var(--accent)}
.url-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.url-tag{font-family:monospace;font-size:11px;padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);cursor:pointer;transition:all .15s;white-space:nowrap}
.url-tag:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.main-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;min-height:0;overflow:hidden}
.panel{display:flex;flex-direction:column;padding:12px;gap:8px;overflow:hidden}
.panel-title{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.send-area{display:flex;flex-direction:column;gap:8px;flex:1}
.send-area textarea{flex:1;min-height:0;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);color:var(--text);font-size:12px;resize:none;outline:none;font-family:inherit}
.send-area textarea:focus{border-color:var(--accent)}
.send-bar{display:flex;gap:6px;flex-shrink:0}
.send-bar button{padding:7px 14px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.send-bar button:hover{filter:brightness(1.1)}
.send-bar button:active{transform:scale(.97)}
.receive-log{flex:1;overflow-y:auto;min-height:0;font-size:11px}
.receive-log::-webkit-scrollbar{width:4px}
.receive-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.log-entry{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;font-family:monospace;font-size:10px;transition:background .15s}
.log-entry:hover{background:var(--bg)}
.log-entry .time{color:var(--muted);flex-shrink:0}
.log-entry .info{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.log-entry .bytes{color:var(--accent);flex-shrink:0}
</style>
</head>
<body>
<div class="top-panel">
  <button class="server-toggle" id="toggleBtn" title="启动/停止服务">&#x25B6;</button>
  <div class="server-info">
    <h1>局域网快传</h1>
    <div class="port-row">
      <span>端口</span>
      <input type="text" id="portInput" value="8888" placeholder="端口">
    </div>
    <div class="url-list" id="urlList"></div>
  </div>
</div>
<div class="main-grid">
  <div class="panel">
    <div class="panel-title">发送内容</div>
    <div class="send-area">
      <textarea id="sendText" placeholder="输入文字发送到服务器..."></textarea>
      <div class="send-bar">
        <button id="sendBtn">发送文字</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title">接收记录</div>
    <div class="receive-log" id="receiveLog">服务未启动</div>
  </div>
</div>
<script>
const api = window.pluginAPI;
const toggleBtn = document.getElementById('toggleBtn');
const portInput = document.getElementById('portInput');
const urlList = document.getElementById('urlList');
const sendText = document.getElementById('sendText');
const sendBtn = document.getElementById('sendBtn');
const receiveLog = document.getElementById('receiveLog');

let running = false;
let pollTimer = null;

function updateUI(state) {
  running = state.running;
  if (running) {
    toggleBtn.classList.add('running');
    toggleBtn.innerHTML = '&#x25A0;';
    const urls = state.urls || state.address ? [state.address ? `http://${state.address.address}:${state.address.port}` : ''] : [];
    urlList.innerHTML = urls.map(u => `<span class="url-tag" onclick="api.copyText('${u}')" title="点击复制">${u}</span>`).join('');
    if (state.received) renderLog(state.received);
  } else {
    toggleBtn.classList.remove('running');
    toggleBtn.innerHTML = '&#x25B6;';
    urlList.innerHTML = '<span style="color:var(--muted);font-size:12px">服务未启动</span>';
    receiveLog.innerHTML = '服务未启动';
  }
}

function renderLog(items) {
  if (!items.length) { receiveLog.innerHTML = '<span style="color:var(--muted);font-size:11px">暂无接收记录</span>'; return; }
  receiveLog.innerHTML = items.map(item => {
    const t = new Date(item.time).toLocaleTimeString('zh-CN');
    const info = item.file ? item.file.split(/[/\\]/).pop() : (item.text || '').slice(0, 40);
    const bytes = item.bytes ? (item.bytes < 1024 ? item.bytes + 'B' : (item.bytes / 1024).toFixed(1) + 'KB') : '';
    return `<div class="log-entry"><span class="time">${t}</span><span class="info">${info}</span><span class="bytes">${bytes}</span></div>`;
  }).join('');
}

async function checkStatus() {
  try {
    const res = await api.runTask({ input: '', options: {}, execute: false });
    if (res.ok) updateUI(res.result);
  } catch (_) {}
}

toggleBtn.addEventListener('click', async () => {
  if (running) {
    try {
      const res = await api.runTask({ input: '', options: { action: 'stop' }, execute: true });
      if (res.ok) updateUI(res.result);
    } catch (_) {}
  } else {
    try {
      const res = await api.runTask({ input: '', options: { port: parseInt(portInput.value) || 0 }, execute: true });
      if (res.ok) updateUI(res.result);
    } catch (e) { receiveLog.innerHTML = '启动失败: ' + e.message; }
  }
});

sendBtn.addEventListener('click', async () => {
  const text = sendText.value.trim();
  if (!text || !running) return;
  try {
    const urls = urlList.querySelectorAll('.url-tag');
    if (urls.length) {
      await fetch(urls[0].textContent, { method: 'POST', body: text });
      sendText.value = '';
    }
  } catch (e) { receiveLog.innerHTML = '发送失败: ' + e.message; }
});

pollTimer = setInterval(checkStatus, 3000);
checkStatus();

window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });
</script>
</body>
</html>
