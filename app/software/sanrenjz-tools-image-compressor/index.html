<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片压缩器</title>
<style>:root{--bg:#1a1018;--panel:#231523;--surface:#160c14;--text:#eee0eb;--muted:#a8889e;--border:#382534;--accent:#ec4899;--accent2:#f472b6;--r:10px}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body::before{content:'';position:fixed;top:0;left:0;right:0;height:32px;z-index:99;background:var(--panel);-webkit-app-region:drag}.custom-title-bar{background:var(--panel)!important;color:var(--muted)!important;font-size:11px!important;border-bottom:1px solid var(--border)!important}button,input,select{-webkit-app-region:no-drag;font:inherit;color:inherit}button{cursor:pointer;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;transition:all .18s}button:active{transform:scale(.96)}.app{display:flex;flex-direction:column;height:calc(100vh - 32px);padding:16px;gap:12px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;flex-shrink:0}.top h1{font-size:20px;margin:0;letter-spacing:-.3px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.top .file-btn{background:var(--accent);color:#fff;padding:8px 20px}.top .file-btn:hover{background:var(--accent2);box-shadow:0 4px 16px rgba(236,72,153,.35)}.top .file-name{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}.controls{display:flex;align-items:center;gap:14px;flex-shrink:0;padding:10px 14px;background:var(--panel);border-radius:var(--r);border:1px solid var(--border)}.controls label{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}.controls input[type=range]{-webkit-appearance:none;width:120px;height:6px;border-radius:3px;background:var(--surface);outline:none}.controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(236,72,153,.4)}.controls .val{display:inline-block;width:36px;text-align:right;color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}.controls .save-btn{background:var(--accent);color:#fff;margin-left:auto}.controls .save-btn:hover{background:var(--accent2)}.preview-area{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:hidden}.preview-card{background:var(--panel);border-radius:var(--r);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}.preview-card h3{font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px 0;margin:0;display:flex;justify-content:space-between;align-items:center}.preview-card h3 .size{font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums}.preview-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}.preview-img img,.preview-img canvas{max-width:100%;max-height:100%;border-radius:6px;object-fit:contain}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);opacity:.5;font-size:12px}.empty svg{width:48px;height:48px;margin-bottom:4px;opacity:.3}.saved-label{color:#22c55e;font-size:11px;animation:fadeIn .3s}@keyframes fadeIn{from{opacity:0}to{opacity:1}}</style></head>
<body>
<div class="app">
  <div class="top"><h1>图片压缩器</h1><button class="file-btn" id="pickBtn">选择图片</button><span class="file-name" id="fileName"></span></div>
  <div class="controls">
    <label>质量 <input type="range" id="quality" min="1" max="100" value="70"><span class="val" id="qVal">70</span></label>
    <label>格式 <select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>
    <button class="save-btn" id="saveBtn">保存结果</button><span class="saved-label" id="savedLabel" hidden>已保存</span>
  </div>
  <div class="preview-area">
    <div class="preview-card"><h3>原始图片 <span class="size" id="origSize"></span></h3><div class="preview-img" id="origPreview"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>选择图片开始</div></div></div>
    <div class="preview-card"><h3>压缩结果 <span class="size" id="compSize"></span></h3><div class="preview-img" id="compPreview"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M2 12h20"/></svg>调整参数后自动预览</div></div></div>
  </div>
</div>
<script>
const api=window.pluginAPI,$=id=>document.getElementById(id);
let origFile=null,origDataUrl='',origBytes=0;
function fmtBytes(b){if(!b)return'—';return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function updatePreview(){if(!origDataUrl)return;const q=Number($('quality').value),fmt=$('format').value;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);c.toBlob(blob=>{if(!blob){$('compSize').textContent='—';return}const url=URL.createObjectURL(blob);$('compPreview').innerHTML='';const el=fmt==='image/png'?new Image():document.createElement('img');el.src=url;el.style.maxWidth='100%';el.style.maxHeight='100%';$('compPreview').appendChild(el);$('compSize').textContent=fmtBytes(blob.size);$('compPreview')._blob=blob},fmt,q/100)};img.src=origDataUrl}
$('quality').addEventListener('input',()=>{$('qVal').textContent=$('quality').value;updatePreview()});
$('format').addEventListener('change',updatePreview);
$('pickBtn').addEventListener('click',()=>{const files=api.selectFiles({title:'选择图片',multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});if(files.length)loadFile(files[0])});
function loadFile(fp){origFile=fp;const base=fp.split(/[/\\]/).pop();$('fileName').textContent=base;origDataUrl=api.readFileDataUrl(fp);origBytes=require('fs').lstatSync(fp).size;$('origSize').textContent=fmtBytes(origBytes);const img=new Image();img.onload=()=>{$('origPreview').innerHTML='';img.style.maxWidth='100%';img.style.maxHeight='100%';$('origPreview').appendChild(img);updatePreview()};img.src=origDataUrl}
$('saveBtn').addEventListener('click',()=>{const blob=$('compPreview')._blob;if(!blob)return;const reader=new FileReader();reader.onload=()=>{const ext={['image/jpeg']:'.jpg',['image/png']:'.png',['image/webp']:'.webp'}[$('format').value];const r=api.saveResult({dataUrl:reader.result,defaultPath:'compressed'+ext,title:'保存压缩图片',filters:[{name:'图片',extensions:[ext.replace('.','')]}]});if(!r.cancelled){$('savedLabel').hidden=0;setTimeout(()=>$('savedLabel').hidden=1,2000)}};reader.readAsDataURL(blob)});
</script></body></html>
