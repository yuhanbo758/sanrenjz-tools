<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
:root{--bg:#fef2f2;--fg:#e11d48;--fg2:#be123c;--card:#fff;--border:#fecdd3;--input:#ffe4e6;--text:#4c0519;--sub:#9f1239;--radius:50%;--shadow:0 4px 20px rgba(225,29,72,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:32px}
input,button{font-family:inherit;font-size:13px;outline:none}
button{cursor:pointer;border:none;border-radius:8px;transition:all .15s}
button:active{transform:scale(.97)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:hidden}
#timer-ring{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
#timer-ring svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
#timer-ring circle{fill:none;stroke-width:6}
#timer-bg{stroke:var(--input)}
#timer-progress{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
#timer-text{font-size:56px;font-weight:200;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:2px;z-index:1}
#timer-label{font-size:14px;color:var(--sub);font-weight:600;margin-top:-8px}
#controls{display:flex;gap:10px;align-items:center}
#controls button{padding:10px 22px;font-weight:600;font-size:13px;color:#fff;background:var(--fg)}
#controls button:hover{background:var(--fg2)}
#controls button.secondary{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
#controls button.secondary:hover{background:var(--input)}
#settings{display:flex;gap:16px;align-items:center;margin-top:4px}
#settings label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
#settings input{width:50px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);text-align:center}
#settings input:focus{border-color:var(--fg)}
#session-info{display:flex;gap:20px;font-size:12px;color:var(--sub)}
#session-info span{font-weight:700;color:var(--fg)}
#status-text{font-size:13px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <div id="status-text">准备专注</div>
  <div id="timer-ring">
    <svg viewBox="0 0 200 200"><circle id="timer-bg" cx="100" cy="100" r="92"/><circle id="timer-progress" cx="100" cy="100" r="92"/></svg>
    <div id="timer-text">25:00</div>
  </div>
  <div id="timer-label">专注</div>
  <div id="controls">
    <button id="startBtn">开始</button>
    <button class="secondary" id="pauseBtn" style="display:none">暂停</button>
    <button class="secondary" id="resetBtn">重置</button>
  </div>
  <div id="settings">
    <label>专注 <input type="number" id="focusMin" value="25" min="1" max="60"> 分</label>
    <label>休息 <input type="number" id="breakMin" value="5" min="1" max="30"> 分</label>
  </div>
  <div id="session-info">已完成 <span id="sessionCount">0</span> 个番茄</div>
</div>
<script>
const api = window.pluginAPI;
const STORAGE_KEY = 'pomodoro';
const CIRCUMFERENCE = 2 * Math.PI * 92;
const progress = document.getElementById('timer-progress');
const timerText = document.getElementById('timer-text');
const timerLabel = document.getElementById('timer-label');
const statusText = document.getElementById('status-text');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const focusMin = document.getElementById('focusMin');
const breakMin = document.getElementById('breakMin');
const sessionCount = document.getElementById('sessionCount');
progress.style.strokeDasharray = CIRCUMFERENCE;
progress.style.strokeDashoffset = '0';

let totalSeconds = 25 * 60;
let remaining = totalSeconds;
let isFocus = true;
let isRunning = false;
let interval = null;
let sessions = 0;

function updateDisplay() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  timerText.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const offset = CIRCUMFERENCE * (1 - remaining / totalSeconds);
  progress.style.strokeDashoffset = offset;
}

function tick() {
  if (remaining <= 0) {
    clearInterval(interval);
    isRunning = false;
    if (isFocus) {
      sessions++;
      sessionCount.textContent = sessions;
      statusText.textContent = '休息时间';
      timerLabel.textContent = '休息';
      totalSeconds = parseInt(breakMin.value) * 60;
      remaining = totalSeconds;
      isFocus = false;
      updateDisplay();
      startTimer();
      persist();
    } else {
      statusText.textContent = '准备专注';
      timerLabel.textContent = '专注';
      totalSeconds = parseInt(focusMin.value) * 60;
      remaining = totalSeconds;
      isFocus = true;
      updateDisplay();
      startBtn.style.display = 'inline-block';
      pauseBtn.style.display = 'none';
    }
    return;
  }
  remaining--;
  updateDisplay();
}

function startTimer() {
  if (isRunning) return;
  isRunning = true;
  startBtn.style.display = 'none';
  pauseBtn.style.display = 'inline-block';
  interval = setInterval(tick, 1000);
  if (isFocus) statusText.textContent = '专注中';
  else statusText.textContent = '休息中';
}

function pauseTimer() {
  clearInterval(interval);
  isRunning = false;
  startBtn.style.display = 'inline-block';
  pauseBtn.style.display = 'none';
}

function resetTimer() {
  clearInterval(interval);
  isRunning = false;
  isFocus = true;
  totalSeconds = parseInt(focusMin.value) * 60;
  remaining = totalSeconds;
  startBtn.style.display = 'inline-block';
  pauseBtn.style.display = 'none';
  timerLabel.textContent = '专注';
  statusText.textContent = '准备专注';
  updateDisplay();
}

async function persist() { await api.storage.set(STORAGE_KEY, { sessions }); }

startBtn.addEventListener('click', startTimer);
pauseBtn.addEventListener('click', pauseTimer);
resetBtn.addEventListener('click', resetTimer);
focusMin.addEventListener('change', () => { if (!isRunning) { totalSeconds = parseInt(focusMin.value)*60; remaining = totalSeconds; updateDisplay(); } });
breakMin.addEventListener('change', () => { if (!isRunning && !isFocus) { totalSeconds = parseInt(breakMin.value)*60; remaining = totalSeconds; updateDisplay(); } });

(async () => {
  const data = await api.storage.get(STORAGE_KEY);
  if (data && data.sessions) { sessions = data.sessions; sessionCount.textContent = sessions; }
  updateDisplay();
})();
</script>
</body>
</html>
