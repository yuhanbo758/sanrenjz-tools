<!DOCTYPE html>
<html lang="zh-CN" data-layout="scan-frame">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二维码与条码工具</title>
<style>
:root{
  --accent:#087f5b;--accent-2:#0ca678;--accent-soft:rgba(8,127,91,.1);--accent-line:rgba(8,127,91,.3);
  --bg:#f2f9f6;--surface:#fff;--surface-2:#e6f4ee;--border:#cde9df;
  --ink:#0d2e22;--muted:#5a756a;--faint:#9ab0a6;
  --ok:#16a34a;--err:#dc2626;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 320px;gap:0;overflow:hidden}
.main{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:20px 24px;gap:16px}
.mode-tabs{display:flex;gap:6px;flex:none}
.mtab{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:7px}
.mtab svg{width:15px;height:15px}
.mtab:hover{border-color:var(--accent-line)}
.mtab.active{background:var(--accent);color:#fff;border-color:transparent}
.gen-area{flex:1;min-height:0;display:none;flex-direction:column;gap:14px}
.gen-area.active{display:flex}
.qr-stage{flex:1;min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px;position:relative}
.qr-stage canvas{max-width:100%;max-height:100%;border-radius:8px}
.qr-empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--faint)}
.qr-empty svg{width:56px;height:56px;opacity:.3}
.scan-area{flex:1;min-height:0;display:none;flex-direction:column;gap:14px}
.scan-area.active{display:flex}
.scan-drop{flex:1;min-height:0;border:2px dashed var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:.15s;color:var(--faint);overflow:hidden}
.scan-drop:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.scan-drop img{max-width:100%;max-height:100%;border-radius:8px}
.scan-result{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;font:14px var(--mono);min-height:60px;word-break:break-all}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:none}
.inp{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font:14px var(--sans);color:var(--ink);outline:none;min-width:200px}
.inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
.sel{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;cursor:pointer;outline:none}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-line)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.side{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-h{padding:16px 20px;border-bottom:1px solid var(--border);flex:none;display:flex;align-items:center;justify-content:space-between}
.side-h h2{margin:0;font-size:15px;font-weight:700}
.side-h .clr{font-size:11px;color:var(--accent);cursor:pointer}
.hist-list{flex:1;overflow:auto;padding:8px 12px}
.hist-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:6px;border:1px solid transparent}
.hist-item:hover{background:var(--surface-2);border-color:var(--border)}
.hist-item .ht{font:13px var(--mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-item .hm{font:11px var(--mono);color:var(--faint);margin-top:3px}
.hist-empty{color:var(--faint);text-align:center;padding:30px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0d2e22;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#bcd8cc;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h2M21 15v2M15 21h2v-2M21 21h-2"/></svg></div>
    <div><h1>二维码与条码工具</h1><p>生成、识别、导出并保存最近使用记录</p></div>
    <div class="spacer"></div>
  </div>
  <div class="body">
    <div class="main">
      <div class="mode-tabs">
        <button class="mtab active" data-mode="gen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>生成二维码</button>
        <button class="mtab" data-mode="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>识别二维码</button>
      </div>
      <div class="gen-area active" id="genArea">
        <div class="ctrl">
          <input class="inp" id="qrText" placeholder="输入文本或网址生成二维码" value="https://sanrenjz.com">
          <select class="sel" id="qrSize"><option value="240">240px</option><option value="360" selected>360px</option><option value="480">480px</option><option value="720">720px</option></select>
          <button class="btn primary" id="genBtn">生成</button>
        </div>
        <div class="qr-stage" id="qrStage">
          <div class="qr-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3z"/></svg><span>输入内容后点击生成</span></div>
        </div>
        <div class="ctrl"><button class="btn" id="saveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>保存为图片</button></div>
      </div>
      <div class="scan-area" id="scanArea">
        <div class="scan-drop" id="scanDrop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
          <div style="font-weight:600;color:var(--ink)">点击选择含二维码的图片</div>
          <div style="font-size:12px">支持从剪贴板粘贴或选择文件</div>
        </div>
        <div class="ctrl"><button class="btn" id="pasteScanBtn">从剪贴板取图</button><button class="btn primary" id="scanBtn">识别</button></div>
        <div class="scan-result" id="scanResult">识别结果将显示在这里</div>
      </div>
    </div>
    <aside class="side">
      <div class="side-h"><h2>历史记录</h2><span class="clr" id="clearHist">清空</span></div>
      <div class="hist-list" id="histList"><div class="hist-empty">暂无记录</div></div>
    </aside>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let mode='gen';let lastDataUrl='';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
$$('.mtab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;$$('.mtab').forEach(x=>x.classList.toggle('active',x===t));$('#genArea').classList.toggle('active',mode==='gen');$('#scanArea').classList.toggle('active',mode==='scan');});
function drawQr(dataUrl){const img=new Image();img.onload=()=>{const stage=$('#qrStage');let canvas=stage.querySelector('canvas');if(!canvas){canvas=document.createElement('canvas');stage.innerHTML='';stage.appendChild(canvas);}const s=stage.clientWidth-40;canvas.width=s;canvas.height=s;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,s,s);const scale=Math.min(s/img.width,s/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(s-w)/2,(s-h)/2,w,h);};img.src=dataUrl;}
$('#saveBtn').onclick=()=>{
  if(!lastDataUrl){toast('请先生成二维码');return;}
  const saved=api.saveResult({title:'保存二维码',defaultPath:'qrcode.png',filters:[{name:'PNG',extensions:['png']}],dataUrl:lastDataUrl});if(!saved.cancelled)toast('已保存');
};
$('#scanDrop').onclick=()=>{const sel=api.selectFiles({multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});const f=Array.isArray(sel)?sel[0]:sel;if(f)loadScanImage(api.readFileDataUrl(f));};
$('#pasteScanBtn').onclick=()=>{const d=api.readClipboardImage();if(d)loadScanImage(d);else toast('剪贴板无图片');};
function loadScanImage(dataUrl){const img=new Image();img.onload=()=>{$('#scanDrop').innerHTML=`<img src="${dataUrl}">`;$('#scanDrop').dataset.url=dataUrl;};img.src=dataUrl;}
// history
async function addHist(text){let h=await api.storage.get('qr-history')||[];h=[{text,time:new Date().toLocaleTimeString('zh-CN')},...h].slice(0,30);await api.storage.set('qr-history',h);renderHist(h);}
async function loadHistory(){renderHist(await api.storage.get('qr-history')||[]);}
function renderHist(h){const list=$('#histList');if(!h.length){list.innerHTML='<div class="hist-empty">暂无记录</div>';return;}
  list.innerHTML=h.map(i=>`<div class="hist-item"><div class="ht">${esc(i.text)}</div><div class="hm">${i.time}</div></div>`).join('');
  $$('#histList .hist-item').forEach((el,i)=>el.onclick=()=>{$('#qrText').value=h[i].text.replace(/^识别: /,'');$$('.mtab')[0].click();});
}
$('#clearHist').onclick=async()=>{await api.storage.set('qr-history',[]);renderHist([]);toast('已清空');};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
window.addEventListener('plugin-enter',e=>{const text=e.detail?.action?.payload||e.detail?.action?.clipboardText||e.detail?.payload||e.detail?.clipboardText||'';if(text){$('#qrText').value=text;}});
$('#genBtn').onclick=async()=>{const text=$('#qrText').value.trim();if(!text){toast('请输入内容');return;}const size=+$('#qrSize').value;const res=await api.generateQr(text,size);if(res.ok){lastDataUrl=res.dataUrl;drawQr(res.dataUrl);await addHist(text);toast('已生成');}else toast(res.error);};
$('#scanBtn').onclick=async()=>{const dataUrl=$('#scanDrop').dataset.url;if(!dataUrl){toast('请先选择图片');return;}const res=await api.decodeQr(dataUrl);if(res.ok&&res.text){$('#scanResult').textContent=res.text;await addHist('识别: '+res.text.slice(0,40));toast('识别成功');}else{$('#scanResult').textContent='未识别到二维码';toast('未识别到二维码');}};
loadHistory();
</script>
</body></html>
