<!DOCTYPE html>
<html lang="zh-CN" data-layout="batch-rail">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件批处理中心</title>
<style>
:root{
  --accent:#c2410c;--accent-2:#ea580c;--accent-soft:rgba(194,65,12,.1);--accent-line:rgba(194,65,12,.3);
  --bg:#fdf8f5;--surface:#fff;--surface-2:#faf0e9;--border:#f0ddd2;
  --ink:#2d1a0f;--muted:#7a6356;--faint:#a8958a;
  --ok:#16a34a;--err:#dc2626;--warn:#d97706;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.tabs{display:flex;gap:6px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:7px}
.tab svg{width:15px;height:15px}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--accent);color:#fff}
.content{flex:1;min-height:0;overflow:hidden;padding:16px 24px;display:flex;flex-direction:column}
.panel{flex:1;min-height:0;display:none;flex-direction:column;gap:14px}
.panel.active{display:flex}
.sel-dir{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;flex:none}
.sel-dir .path{flex:1;font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;flex:none}
.rule{display:flex;flex-direction:column;gap:5px}
.rule label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.inp{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font:13px var(--mono);color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent-line)}
.sel{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;cursor:pointer;outline:none}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent)}
.btn-row{display:flex;gap:10px;flex:none}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-line)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.5}
.table-wrap{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font:12px var(--mono)}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left}
th{background:var(--surface-2);font-weight:700;color:var(--muted);position:sticky;top:0;z-index:2;font-family:var(--sans);font-size:12px}
td.from{color:var(--err)}td.to{color:var(--ok)}
td .arrow{color:var(--faint);margin:0 6px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);gap:10px}
.empty svg{width:48px;height:48px;opacity:.4}
.bar{flex:none;padding:6px 0;font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.bar .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.bar.ok .d{background:var(--ok)}.bar.err .d{background:var(--err)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d1a0f;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e0c9b8;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5"/></svg></div>
    <div><h1>文件批处理中心</h1><p>先预览命名和校验清单，再执行文件修改</p></div>
    <div class="spacer"></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tool="batch-renamer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5h16v2M9 5v14M7 19h4M15 13l4 4-4 4M19 17H9"/></svg>批量重命名</button>
    <button class="tab" data-tool="file-checksum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4M9 16h6"/></svg>文件校验</button>
  </div>
  <div class="content">
    <!-- Renamer -->
    <div class="panel active" data-panel="batch-renamer">
      <div class="sel-dir">
        <button class="btn" id="rnPickDir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5"/></svg>选择目录</button>
        <span class="path" id="rnDir">未选择目录</span>
      </div>
      <div class="rules">
        <div class="rule"><label>查找</label><input class="inp" id="rnFind" placeholder="原文件名片段"></div>
        <div class="rule"><label>替换为</label><input class="inp" id="rnReplace" placeholder="新文本"></div>
        <div class="rule"><label>前缀</label><input class="inp" id="rnPrefix" placeholder="前缀_"></div>
        <div class="rule"><label>后缀</label><input class="inp" id="rnSuffix" placeholder="_后缀"></div>
        <div class="rule"><label>编号起始</label><input class="inp" id="rnStart" type="number" value="1" style="width:80px"></div>
        <div class="rule"><label>编号位数</label><input class="inp" id="rnPad" type="number" value="2" style="width:80px"></div>
        <div class="rule" style="justify-content:flex-end;flex-direction:row;align-items:center;gap:14px;padding-top:18px">
          <label class="chk"><input type="checkbox" id="rnNumber">编号</label>
          <label class="chk"><input type="checkbox" id="rnRegex">正则</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="rnPreview">预览重命名</button>
        <button class="btn danger" id="rnExec" disabled>执行重命名</button>
      </div>
      <div class="table-wrap" id="rnTable"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5"/></svg><span>选择目录并预览后将显示重命名清单</span></div></div>
      <div class="bar" id="rnBar"><span class="d"></span><span>等待操作</span></div>
    </div>
    <!-- Checksum -->
    <div class="panel" data-panel="file-checksum">
      <div class="sel-dir">
        <button class="btn" id="csPick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>选择文件</button>
        <span class="path" id="csCount">未选择文件</span>
      </div>
      <div class="btn-row"><button class="btn primary" id="csCalc">计算 SHA-256</button></div>
      <div class="table-wrap" id="csTable"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>选择文件后计算校验和</span></div></div>
      <div class="bar" id="csBar"><span class="d"></span><span>等待选择文件</span></div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let current='batch-renamer';let csFiles=[];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function setBar(sel,msg,st){const b=$(sel);b.className='bar'+(st==='ok'?' ok':st==='err'?' err':'');b.querySelector('span:last-child').textContent=msg;}
$$('.tab').forEach(t=>t.onclick=()=>{current=t.dataset.tool;$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===current));});
let rnDir='';
$('#rnPickDir').onclick=()=>{rnDir=api.selectDirectory('选择需要批量重命名的目录');if(rnDir)$('#rnDir').textContent=rnDir;};
$('#rnPreview').onclick=async()=>{
  if(!rnDir){toast('请先选择目录');return;}
  const opts={directory:rnDir,find:$('#rnFind').value,replace:$('#rnReplace').value,prefix:$('#rnPrefix').value,suffix:$('#rnSuffix').value,number:$('#rnNumber').checked,regex:$('#rnRegex').checked,start:+$('#rnStart').value,padding:+$('#rnPad').value};
  setBar('#rnBar','预览中…','idle');
  const res=await api.runTask({toolId:'batch-renamer',input:'',options:opts,execute:false});
  if(res.ok){const plan=res.result;if(!plan.length){$('#rnTable').innerHTML='<div class="empty"><span>没有需要重命名的文件</span></div>';setBar('#rnBar','无需重命名','ok');return;}
    let html='<table><thead><tr><th>原文件名</th><th>新文件名</th></tr></thead><tbody>';
    plan.forEach(p=>{html+=`<tr><td class="from">${esc(p.before)}</td><td class="to">${esc(p.after)}</td></tr>`;});
    html+='</tbody></table>';$('#rnTable').innerHTML=html;$('#rnExec').disabled=false;setBar('#rnBar',`预览完成，${plan.length} 个文件待重命名`,'ok');}
  else setBar('#rnBar',res.error,'err');
};
$('#rnExec').onclick=async()=>{
  const opts={directory:rnDir,find:$('#rnFind').value,replace:$('#rnReplace').value,prefix:$('#rnPrefix').value,suffix:$('#rnSuffix').value,number:$('#rnNumber').checked,regex:$('#rnRegex').checked,start:+$('#rnStart').value,padding:+$('#rnPad').value};
  setBar('#rnBar','正在重命名…','idle');
  const res=await api.runTask({toolId:'batch-renamer',input:'',options:opts,execute:true});
  if(res.ok){toast('重命名完成');setBar('#rnBar',`已重命名 ${res.result.length} 个文件`,'ok');$('#rnExec').disabled=true;}
  else setBar('#rnBar',res.error,'err');
};
$('#csPick').onclick=()=>{const sel=api.selectFiles({multiple:true});if(sel&&sel.length){csFiles=sel;$('#csCount').textContent=`已选 ${csFiles.length} 个文件`;}};
$('#csCalc').onclick=async()=>{
  if(!csFiles.length){toast('请先选择文件');return;}
  setBar('#csBar','计算中…','idle');
  const res=await api.runTask({toolId:'file-checksum',input:'',options:{files:csFiles},execute:false});
  if(res.ok){const items=res.result;let html='<table><thead><tr><th>文件名</th><th>SHA-256</th><th></th></tr></thead><tbody>';
    items.forEach(i=>{const nm=esc(i.file.split(/[\\\/]/).pop());const h=esc(i.sha256);html+=`<tr><td>${nm}</td><td style="word-break:break-all">${h}</td><td><button class="btn" style="padding:3px 8px;font-size:11px" data-hash="${esc(i.sha256)}">复制</button></td></tr>`;});
    html+='</tbody></table>';$('#csTable').innerHTML=html;setBar('#csBar',`已计算 ${items.length} 个文件`,'ok');
    $$('#csTable [data-hash]').forEach(b=>b.onclick=()=>{api.copyText(b.dataset.hash);toast('已复制哈希值');});}
  else setBar('#csBar',res.error,'err');
};
window.addEventListener('plugin-enter',e=>{const id=e.detail?.toolId;if(id){$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tool===id));$$('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===id));current=id;}});
</script>
</body></html>
