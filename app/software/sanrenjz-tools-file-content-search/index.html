<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件内容搜索</title>
<style>
:root{--bg:#eff6ff;--panel:#fff;--surface:#dbeafe;--text:#1e3a5f;--muted:#6b7f9a;--border:#bfdbfe;--accent:#2563eb;--accent2:#60a5fa;--match:#fef3c7;--radius:8px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.bar .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.bar h1{font-size:14px;font-weight:700;margin:0 8px 0 0;white-space:nowrap}
.bar .search{flex:1;display:flex;align-items:center;gap:0;min-width:0;position:relative}
.bar .search input{flex:1;min-width:0;padding:7px 12px;border:1.5px solid var(--border);border-radius:var(--radius) 0 0 var(--radius);background:var(--bg);font-size:13px;outline:none;color:var(--text)}
.bar .search input:focus{border-color:var(--accent)}
.bar .search .suffix{padding:7px 10px;border:1.5px solid var(--border);border-left:0;border-radius:0 var(--radius) var(--radius) 0;background:var(--surface);font-size:11px;color:var(--muted);white-space:nowrap}
.bar .btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap}
.bar .btn:hover{background:var(--surface)}
.bar .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar .btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.sub{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px}
.sub .fld{display:flex;align-items:center;gap:4px}
.sub .fld label{color:var(--muted);white-space:nowrap}
.sub .fld input{padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);font-size:11px;outline:none;width:120px}
.sub .fld input:focus{border-color:var(--accent)}
.sub .sep{color:var(--border);margin:0 2px}
.results{flex:1;overflow-y:auto;padding:4px 0}
.results .item{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:baseline;padding:8px 14px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);transition:background .1s;cursor:default}
.results .item:hover{background:var(--surface)}
.results .item .path{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"SF Mono","Cascadia Code","Consolas",monospace}
.results .item .line{grid-column:1/-1;font-size:12px;padding:3px 0;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--match);padding:2px 8px;border-radius:4px;margin-top:2px}
.results .item .ln{font-size:10px;color:var(--accent);font-weight:600;text-align:right;font-family:"SF Mono","Cascadia Code","Consolas",monospace}
.results .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
.results .empty strong{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.stat{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
.stat .cnt{font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="logo">&#128269;</div>
    <h1>文件内容搜索</h1>
    <div class="search">
      <input type="text" id="query" placeholder="搜索文件内容..." autofocus>
      <span class="suffix">递归</span>
    </div>
    <button class="btn" id="pickDir">选择目录</button>
    <button class="btn primary" id="search">搜索</button>
  </div>
  <div class="sub">
    <span id="dirLabel" style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px">未选择目录</span>
    <span class="sep">|</span>
    <div class="fld"><label>扩展名</label><input type="text" id="ext" placeholder=".js,.ts,.json"></div>
    <div class="fld"><label>最大文件(MB)</label><input type="number" id="maxSize" value="5" min="1" style="width:60px"></div>
  </div>
  <div class="results" id="results">
    <div class="empty"><strong>搜索文件内容</strong>输入关键词，选择目录后开始搜索</div>
  </div>
  <div class="stat"><span id="statText"></span><span class="cnt" id="statCount"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const API=window.pluginAPI;
let dir='';

async function pickDir(){dir=await API.selectDirectory('选择搜索目录');$('#dirLabel').textContent=dir||'未选择目录'}
async function doSearch(){const q=$('#query').value.trim();if(!q||!dir){$('#statText').textContent=!dir?'请先选择目录':'请输入搜索内容';return}$('#statText').textContent='搜索中...';const r=await API.runTask({options:{directory:dir,query:q,extensions:$('#ext').value,maxSizeMb:$('#maxSize').value||5}});if(r.ok){renderResults(r.result)}else{$('#statText').textContent=r.error;$('#statCount').textContent=''}}
function renderResults(data){const el=$('#results');if(!data.length){el.innerHTML='<div class="empty"><strong>未找到匹配</strong>当前目录中无文件包含该关键词</div>';$('#statCount').textContent='0 项';$('#statText').textContent='';return}el.innerHTML=data.map(d=>`<div class="item"><span class="path" title="${d.path}">${d.path}</span><span class="ln">L${d.line}</span><span class="line">${escHtml(d.text)}</span></div>`).join('');$('#statCount').textContent=data.length+' 处匹配';$('#statText').textContent=''}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

$('#pickDir').onclick=pickDir;
$('#search').onclick=doSearch;
$('#query').onkeydown=e=>{if(e.key==='Enter')doSearch()};
</script>
</body>
</html>
