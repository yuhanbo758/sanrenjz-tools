<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片尺寸调整</title>
<style>:root{--bg:#faf5ff;--panel:#fff;--surface:#f3e8ff;--text:#4a044e;--muted:#7e22ce;--border:#e9d5ff;--accent:#c026d3;--accent2:#d946ef;--r:12px}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{display:flex;height:calc(100vh - 32px);padding:20px;gap:16px;overflow:hidden}.sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}.sidebar h1{font-size:20px;margin:0;color:var(--accent);font-weight:800;letter-spacing:-.3px}.pick-btn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:var(--r);background:var(--surface);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}.pick-btn:hover{border-color:var(--accent);background:var(--panel)}.info{font-size:12px;color:var(--muted);text-align:center;word-break:break-all}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px}.card h3{font-size:13px;font-weight:700;margin:0 0 12px;color:var(--text)}.form-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}.form-row label{font-size:12px;color:var(--muted);width:50px;flex-shrink:0}.form-row input{flex:1;width:60px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;transition:border .15s}.form-row input:focus{border-color:var(--accent)}.form-row .sep{color:var(--muted);font-size:16px}.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--muted);cursor:pointer}.checkbox-row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.presets button{flex:0 0 auto;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}.presets button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}.actions{display:flex;gap:8px;margin-top:auto}.actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}.actions .apply{background:var(--accent);color:#fff}.actions .apply:hover{background:var(--accent2);box-shadow:0 4px 14px rgba(192,38,211,.3)}.actions .save{background:var(--surface);color:var(--accent);border:1px solid var(--border)}.actions .save:hover{background:var(--accent);color:#fff}.preview-area{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview-area img,.preview-area canvas{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}.preview-area .dims{position:absolute;bottom:12px;right:16px;background:rgba(0,0,0,.65);color:#fff;padding:5px 12px;border-radius:16px;font-size:12px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);opacity:.35}.empty svg{width:56px;height:56px}.saved{color:#16a34a;font-size:12px;font-weight:600;margin-left:6px}</style></head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>尺寸调整</h1>
    <button class="pick-btn" id="pickBtn">选择图片</button>
    <div class="info" id="fileInfo"></div>
    <div class="card">
      <h3>像素尺寸</h3>
      <div class="form-row"><label>宽度</label><input type="number" id="width" value="800" min="1" max="10000"><span class="sep">×</span></div>
      <div class="form-row"><label>高度</label><input type="number" id="height" value="600" min="1" max="10000"><span class="sep">×</span></div>
      <label class="checkbox-row"><input type="checkbox" id="keepRatio" checked>锁定宽高比</label>
      <div class="presets">
        <button data-w="1920" data-h="1080">1920×1080</button>
        <button data-w="1280" data-h="720">1280×720</button>
        <button data-w="800" data-h="600">800×600</button>
        <button data-w="512" data-h="512">512×512</button>
        <button data-w="256" data-h="256">256×256</button>
      </div>
    </div>
    <div class="actions">
      <button class="apply" id="applyBtn">应用</button>
      <button class="save" id="saveBtn">导出</button>
      <span class="saved" id="savedLabel" hidden>已导出</span>
    </div>
  </div>
  <div class="preview-area" id="preview">
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><div>选择图片后调整尺寸</div></div>
    <div class="dims" id="dimLabel" hidden></div>
  </div>
</div>
<script>
const api=window.pluginAPI,$=id=>document.getElementById(id);
let origDataUrl='',origW=0,origH=0,ratio=1,outDataUrl='';
function fmtBytes(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function resize(){if(!origDataUrl)return;const w=Number($('width').value)||800,h=Number($('height').value)||600;const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,w,h);outDataUrl=c.toDataURL();$('preview').innerHTML='';const el=document.createElement('img');el.src=outDataUrl;$('preview').appendChild(el);$('dimLabel').hidden=0;$('dimLabel').textContent=`${w} × ${h}`;$('preview').appendChild($('dimLabel'))};img.src=origDataUrl}
$('pickBtn').addEventListener('click',()=>{const f=api.selectFiles({title:'选择图片',multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});if(f.length){origDataUrl=api.readFileDataUrl(f[0]);const img=new Image();img.onload=()=>{origW=img.width;origH=img.height;ratio=origW/origH;$('width').value=origW;$('height').value=origH;$('fileInfo').textContent=f[0].split(/[/\\]/).pop()+'  ('+origW+'×'+origH+')';resize()};img.src=origDataUrl}});
$('width').addEventListener('input',()=>{if($('keepRatio').checked){$('height').value=Math.round(Number($('width').value)/ratio)}});
$('height').addEventListener('input',()=>{if($('keepRatio').checked){$('width').value=Math.round(Number($('height').value)*ratio)}});
$('applyBtn').addEventListener('click',resize);
document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{$('width').value=b.dataset.w;$('height').value=b.dataset.h;resize()}));
$('saveBtn').addEventListener('click',()=>{if(!outDataUrl)return;const r=api.saveResult({dataUrl:outDataUrl,defaultPath:'resized.png',title:'保存调整后的图片',filters:[{name:'PNG',extensions:['png']},{name:'JPEG',extensions:['jpg']}]});if(!r.cancelled){$('savedLabel').hidden=0;setTimeout(()=>$('savedLabel').hidden=1,2000)}});
</script></body></html>
