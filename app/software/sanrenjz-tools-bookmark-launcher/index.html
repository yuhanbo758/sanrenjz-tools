<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
:root{--bg:#f5f3ff;--fg:#7c3aed;--fg2:#6d28d9;--card:#fff;--border:#ddd6fe;--input:#ede9fe;--text:#2e1065;--sub:#8b5cf6;--radius:10px;--shadow:0 2px 8px rgba(124,58,237,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:32px}
input,button{font-family:inherit;font-size:13px;outline:none}
button{cursor:pointer;border:none;border-radius:var(--radius);transition:all .15s}
button:active{transform:scale(.97)}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#input-area{display:flex;gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
#input-area input{flex:1;min-width:100px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input);color:var(--text)}
#input-area input:focus{border-color:var(--fg);box-shadow:0 0 0 2px rgba(124,58,237,.12)}
#input-area button{padding:8px 16px;background:var(--fg);color:#fff;font-weight:600;font-size:12px}
#input-area button:hover{background:var(--fg2)}
#search{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:13px;margin:0 14px}
#search:focus{border-color:var(--fg);box-shadow:0 0 0 2px rgba(124,58,237,.12)}
#bookmarks-grid{flex:1;overflow-y:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-content:start}
#bookmarks-grid::-webkit-scrollbar{width:5px}
#bookmarks-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.bm-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bm-card:hover{border-color:var(--fg);box-shadow:var(--shadow);transform:translateY(-2px)}
.bm-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.bm-info{display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0;width:100%}
.bm-name{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bm-alias{font-size:10px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bm-card .del{color:var(--sub);font-size:11px;padding:2px 8px;border-radius:4px;opacity:0;transition:all .15s;margin-top:4px}
.bm-card:hover .del{opacity:1}
.bm-card .del:hover{background:#fef2f2;color:#dc2626}
</style>
</head>
<body>
<div id="app">
  <div id="input-area">
    <input type="text" id="nameInput" placeholder="书签名称">
    <input type="text" id="urlInput" placeholder="https://...">
    <input type="text" id="aliasInput" placeholder="别名 (可选)">
    <button id="addBtn">添加</button>
  </div>
  <input type="text" id="search" placeholder="搜索书签...">
  <div id="bookmarks-grid"></div>
</div>
<script>
const api = window.pluginAPI;
const STORAGE_KEY = 'bookmarks';
const nameInput = document.getElementById('nameInput');
const urlInput = document.getElementById('urlInput');
const aliasInput = document.getElementById('aliasInput');
const addBtn = document.getElementById('addBtn');
const search = document.getElementById('search');
const grid = document.getElementById('bookmarks-grid');
let bookmarks = [];

const COLORS = ['#7c3aed','#6366f1','#8b5cf6','#a78bfa','#c084fc','#e879f9','#f472b6','#ec4899','#f43f5e','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6'];

function getColor(s) {
  let hash = 0;
  for (let i=0;i<s.length;i++) hash = s.charCodeAt(i) + ((hash<<5)-hash);
  return COLORS[Math.abs(hash) % COLORS.length];
}

function getInitial(s) {
  return (s||'?').charAt(0).toUpperCase();
}

function render() {
  const q = search.value.toLowerCase();
  const filtered = bookmarks.filter(b => {
    if (!q) return true;
    return (b.name||'').toLowerCase().includes(q) || (b.alias||'').toLowerCase().includes(q) || (b.url||'').toLowerCase().includes(q);
  });
  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--sub);font-size:13px">暂无书签</div>';
    return;
  }
  grid.innerHTML = filtered.map(b => {
    const color = getColor(b.name||b.url);
    return `<div class="bm-card" data-url="${b.url||''}" data-id="${b.id}">
      <div class="bm-icon" style="background:${color}">${getInitial(b.name||b.url)}</div>
      <div class="bm-info">
        <div class="bm-name">${b.name||'未命名'}</div>
        ${b.alias?`<div class="bm-alias">${b.alias}</div>`:''}
      </div>
      <div class="del" data-action="del">删除</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.bm-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.dataset.action === 'del') {
        bookmarks = bookmarks.filter(b => b.id !== card.dataset.id);
        render(); persist();
        return;
      }
      const url = card.dataset.url;
      if (url) api.openExternal(url);
    });
  });
}

async function persist() { await api.storage.set(STORAGE_KEY, bookmarks); }

function addBookmark() {
  const name = nameInput.value.trim();
  const url = urlInput.value.trim();
  if (!name || !url) return;
  const alias = aliasInput.value.trim();
  bookmarks.push({ id: String(Date.now()), name, url, alias, createdAt: Date.now() });
  nameInput.value = ''; urlInput.value = ''; aliasInput.value = '';
  render(); persist();
}

addBtn.addEventListener('click', addBookmark);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addBookmark(); } });
search.addEventListener('input', render);

(async () => {
  const data = await api.storage.get(STORAGE_KEY);
  bookmarks = Array.isArray(data) ? data : [];
  render();
})();
</script>
</body>
</html>
