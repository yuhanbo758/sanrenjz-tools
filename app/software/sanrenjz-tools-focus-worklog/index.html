<!doctype html>
<html lang="zh-CN" data-layout="focus-ring"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专注与工时</title>
<style>
:root{--red:#c92a2a;--bg:#fdf6f6;--line:#efd6d6;--ink:#301515;--muted:#806363;--green:#23864c}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.app{height:calc(100vh - 32px);display:flex;flex-direction:column}.tabs{display:flex;gap:8px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 17px;font-weight:600}.tab.active{background:var(--red);color:white}.content{flex:1;min-height:0;overflow:auto;padding:18px 22px}.panel{display:none;max-width:1080px;margin:auto}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink);padding:8px 14px}.btn:hover{border-color:var(--red)}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.btn.small{font-size:12px;padding:5px 10px}.btn.danger{color:#b52b2b}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.field{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;color:var(--ink);min-width:0}.field:focus{outline:2px solid #eeb9b9}.label{font-size:12px;color:var(--muted)}.timer-layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,390px);gap:20px;align-items:start}.timer-card{text-align:center;padding:20px}.ring{width:min(270px,55vw);height:min(270px,55vw);margin:0 auto;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12}.ring .back{stroke:#f6e4e4}.ring .front{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .3s}.ring.break .front{stroke:var(--green)}.timer-display{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.time{font:700 46px Consolas,monospace}.phase{color:var(--muted)}.timer-controls{justify-content:center;margin:18px 0}.timer-settings{justify-content:center;margin:14px 0}.timer-settings input{width:59px;text-align:center}.dots{display:flex;justify-content:center;gap:6px;margin:12px}.dot{width:10px;height:10px;border-radius:50%;background:#ead1d1}.dot.done{background:var(--red)}.side{display:flex;flex-direction:column;gap:16px}.side h2,.section-head h2{font-size:16px;margin:0 0 10px}.side p{margin:6px 0}.side select{width:100%}.today-task{padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.today-task:last-child{border:0}.today-task .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{text-align:center;border-radius:8px;background:#fff4f4;padding:9px 5px}.stat b{display:block;color:var(--red);font-size:21px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.section-head h2{margin:0}.form-grid{display:grid;grid-template-columns:2fr 1.4fr .7fr .9fr 1fr;gap:10px;margin:12px 0}.form-grid label{display:flex;flex-direction:column;gap:4px}.form-grid .field{width:100%}.list{display:flex;flex-direction:column;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;align-items:center;gap:12px}.item .main{flex:1;min-width:0}.item .title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item.done .title{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{display:inline-block;border-radius:99px;background:#fff0f0;color:#ad2929;padding:2px 8px;font-size:11px}.empty{text-align:center;color:var(--muted);padding:40px}.filter{margin-bottom:12px}.notice{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#301515;color:white;padding:9px 17px;border-radius:8px;display:none;z-index:3}.toast.show{display:block}@media(max-width:800px){.timer-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}.item{flex-wrap:wrap}}
</style></head><body><main class="app">
<nav class="tabs" aria-label="功能菜单"><button class="tab active" data-tab="timer">番茄专注</button><button class="tab" data-tab="tasks">任务管理 <span id="taskBadge"></span></button><button class="tab" data-tab="logs">工时记录</button></nav>
<div class="content">
<section class="panel active" id="timerPanel"><div class="timer-layout"><div class="card timer-card">
<div class="ring" id="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="back" cx="50" cy="50" r="43"/><circle id="ringFront" class="front" cx="50" cy="50" r="43" stroke-dasharray="270.18"/></svg><div class="timer-display"><div class="time" id="time">25:00</div><div class="phase" id="phase">准备专注</div></div></div>
<div class="row timer-controls"><button class="btn primary" id="start">开始专注</button><button class="btn" id="reset">重置</button><button class="btn" id="skip" hidden>结束休息</button></div>
<div class="row timer-settings"><label class="label">专注 <input class="field" id="focusMin" type="number" min="1" max="180"> 分钟</label><label class="label">短休 <input class="field" id="shortBreakMin" type="number" min="1" max="90"> 分钟</label><label class="label">长休 <input class="field" id="longBreakMin" type="number" min="1" max="90"> 分钟</label></div>
<div class="dots" id="dots"></div><p class="notice">专注完成后记录工时；休息不会计入。重置会放弃当前未完成的一轮。</p></div>
<aside class="side"><div class="card"><h2>当前任务</h2><select class="field" id="taskSelect" aria-label="选择专注任务"></select><p class="notice" id="taskHint">可在任务管理中添加任务，完成的专注会归到所选任务。</p><div class="row"><button class="btn small" id="newTaskShortcut">添加任务</button><button class="btn small" id="interrupt">记录中断</button><span class="notice" id="interruptCount"></span></div></div>
<div class="card"><h2>今日概览</h2><div class="stat-grid"><div class="stat"><b id="todayMinutes">0</b><span class="label">专注分钟</span></div><div class="stat"><b id="todayPomos">0</b><span class="label">完成番茄</span></div><div class="stat"><b id="todayDone">0</b><span class="label">完成任务</span></div></div><div id="todayTasks"></div></div></aside></div></section>
<section class="panel" id="tasksPanel"><div class="section-head"><h2>任务管理</h2><span class="muted">先计划，再开始专注</span><span class="grow"></span><button class="btn primary" id="showTaskForm">添加任务</button></div>
<form class="card" id="taskForm" hidden><div class="form-grid"><label class="label">任务名称<input class="field" id="taskTitle" maxlength="100" required placeholder="要完成什么？"></label><label class="label">项目<input class="field" id="taskProject" maxlength="60" value="默认项目"></label><label class="label">预计番茄<input class="field" id="taskEstimate" type="number" min="1" max="99" value="1"></label><label class="label">优先级<select class="field" id="taskPriority"><option value="normal">普通</option><option value="high">优先</option><option value="low">稍后</option></select></label><label class="label">截止日期<input class="field" id="taskDue" type="date"></label></div><div class="row"><button class="btn primary" type="submit">保存任务</button><button class="btn" type="button" id="cancelTask">取消</button><span class="notice">完成任务后仍保留专注记录。</span></div></form>
<div class="row filter"><select class="field" id="taskFilter" aria-label="任务筛选"><option value="open">待完成</option><option value="all">全部</option><option value="done">已完成</option></select><span class="notice" id="taskCount"></span></div><div class="list" id="taskList"></div></section>
<section class="panel" id="logsPanel"><div class="section-head"><h2>工时记录</h2><span class="grow"></span><button class="btn" id="exportCsv">导出 CSV</button><button class="btn primary" id="showLogForm">手动添加</button></div>
<div class="stat-grid"><div class="stat"><b id="logToday">0</b><span class="label">今日分钟</span></div><div class="stat"><b id="logWeek">0</b><span class="label">本周分钟</span></div><div class="stat"><b id="logPomos">0</b><span class="label">本周番茄</span></div></div>
<form class="card" id="logForm" hidden><div class="row"><input class="field" id="logProject" maxlength="60" placeholder="项目" required><input class="field" id="logMinutes" type="number" min="1" max="1440" placeholder="分钟" required><input class="field" id="logDate" type="date" required><input class="field grow" id="logNote" maxlength="200" placeholder="备注"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" id="cancelLog">取消</button></div></form>
<div class="row filter"><select class="field" id="logFilter" aria-label="工时筛选"><option value="all">全部记录</option><option value="today">今天</option><option value="week">本周</option></select><span class="notice" id="logCount"></span></div><div class="list" id="logList"></div></section>
</div></main><div class="toast" id="toast" role="status"></div><script src="focus-core.js"></script><script src="renderer.js"></script></body></html>
