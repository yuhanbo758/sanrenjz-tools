<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV 表格工具</title>
<style>
:root{--bg:#f0fdf4;--panel:#fff;--surface:#dcfce7;--text:#142e1a;--muted:#5c7a63;--border:#bbf7d0;--accent:#15803d;--accent2:#22c55e;--radius:10px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
.top .btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s}
.top .btn:hover{background:var(--surface)}
.top .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.top .btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.config{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px}
.config .fld{display:flex;align-items:center;gap:4px}
.config .fld label{color:var(--muted);white-space:nowrap;font-weight:500}
.config .fld select,.config .fld input{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);font-size:11px;outline:none;color:var(--text)}
.config .fld select:focus,.config .fld input:focus{border-color:var(--accent)}
.config .tab{display:flex;margin-left:auto}
.config .tab button{padding:4px 12px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:11px;font-weight:500;transition:all .15s}
.config .tab button:first-child{border-radius:5px 0 0 5px}
.config .tab button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.config .tab button.active{background:var(--accent);color:#fff;border-color:var(--accent);z-index:1}
.editor{flex:0 0 auto;padding:8px 14px}
.editor textarea{width:100%;height:140px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);font-size:12px;font-family:"SF Mono","Cascadia Code","Consolas",monospace;resize:none;outline:none;color:var(--text)}
.editor textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.output{flex:1;overflow:auto;padding:4px 14px 10px}
.output table{width:100%;border-collapse:collapse;font-size:11px}
.output table th{position:sticky;top:0;background:var(--accent);color:#fff;padding:6px 10px;text-align:left;font-weight:600;white-space:nowrap;font-size:11px;z-index:1}
.output table td{padding:5px 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.output table tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 50%,transparent)}
.output table tr:hover td{background:var(--surface)}
.output pre{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:12px;font-family:"SF Mono","Cascadia Code","Consolas",monospace;white-space:pre-wrap;word-break:break-all;margin:0;color:var(--text)}
.output .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.output .empty strong{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">&#128202;</div>
    <h1>CSV 表格工具</h1>
    <button class="btn primary" id="render">渲染</button>
    <button class="btn" id="paste">粘贴</button>
    <button class="btn" id="clearAll">清空</button>
  </div>
  <div class="config">
    <div class="fld"><label>分隔符</label><select id="delim"><option value=",">, 逗号</option><option value=";">; 分号</option><option value="\t">Tab</option><option value="|">| 竖线</option></select></div>
    <div class="fld"><label>排序列</label><input type="number" id="sortCol" placeholder="留空不排序" style="width:80px" min="0"></div>
    <div class="tab">
      <button class="active" data-mode="table">表格</button>
      <button data-mode="json">JSON</button>
    </div>
  </div>
  <div class="editor">
    <textarea id="csvInput" placeholder="粘贴 CSV 数据，或输入逗号分隔的内容...&#10;name,age,city&#10;张三,28,北京&#10;李四,32,上海"></textarea>
  </div>
  <div class="output" id="output">
    <div class="empty"><strong>粘贴 CSV 数据</strong>支持表格预览和 JSON 格式转换</div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const API=window.pluginAPI;
let mode='table';

async function doRender(){const input=$('#csvInput').value.trim();if(!input){$('#output').innerHTML='<div class="empty"><strong>粘贴 CSV 数据</strong>支持表格预览和 JSON 格式转换</div>';return}
  const delim=$('#delim').value==='\\t'?'\t':$('#delim').value;
  const sc=$('#sortCol').value;const options={delimiter:delim};
  if(mode==='json')options.action='json';
  if(sc!=='')options.sortColumn=Number(sc);
  const r=await API.runTask({input,options});
  if(r.ok){renderOutput(r.result)}else{$('#output').innerHTML='<div class="empty"><strong>解析错误</strong>'+r.error+'</div>'}}
function renderOutput(data){const el=$('#output');
  if(mode==='json'){el.innerHTML='<pre>'+escHtml(typeof data==='string'?data:JSON.stringify(data,null,2))+'</pre>';return}
  if(typeof data==='string'){const rows=data.split('\n').map(l=>{const cols=[];let f='',q=false;for(const c of l){if(c==='"')q=!q;else if(c===($('#delim').value==='\\t'?'\t':$('#delim').value)&&!q){cols.push(f);f=''}else f+=c}cols.push(f);return cols});
    if(!rows.length){el.innerHTML='<div class="empty"><strong>无数据</strong></div>';return}
    el.innerHTML='<table><thead><tr>'+rows[0].map(h=>'<th>'+escHtml(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+escHtml(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';return}
  el.innerHTML='<pre>'+escHtml(data)+'</pre>'}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function doPaste(){try{const t=await API.readClipboardText();if(t){$('#csvInput').value=t;doRender()}}catch(e){$('#csvInput').value='无法读取剪贴板'}}
function clearAll(){$('#csvInput').value='';$('#output').innerHTML='<div class="empty"><strong>粘贴 CSV 数据</strong>支持表格预览和 JSON 格式转换</div>'}

$('#render').onclick=doRender;$('#paste').onclick=doPaste;$('#clearAll').onclick=clearAll;
document.querySelectorAll('.tab button').forEach(b=>b.onclick=function(){document.querySelectorAll('.tab button').forEach(x=>x.classList.remove('active'));this.classList.add('active');mode=this.dataset.mode;doRender()});
</script>
</body>
</html>
