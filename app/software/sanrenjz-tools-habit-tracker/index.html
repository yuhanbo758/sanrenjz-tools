<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
:root{--bg:#f0fdf4;--fg:#16a34a;--fg2:#15803d;--card:#fff;--border:#bbf7d0;--input:#dcfce7;--text:#14532d;--sub:#22c55e;--danger:#ef4444;--radius:10px;--shadow:0 2px 8px rgba(22,163,74,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:32px}
input,button{font-family:inherit;font-size:13px;outline:none}
button{cursor:pointer;border:none;border-radius:var(--radius);transition:all .15s}
button:active{transform:scale(.97)}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#input-area{display:flex;gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border);align-items:center}
#input-area input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input);color:var(--text)}
#input-area input:focus{border-color:var(--fg);box-shadow:0 0 0 2px rgba(22,163,74,.12)}
#input-area button{padding:8px 16px;background:var(--fg);color:#fff;font-weight:600;font-size:12px}
#input-area button:hover{background:var(--fg2)}
#habits-list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
#habits-list::-webkit-scrollbar{width:5px}
#habits-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.habit-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);display:flex;align-items:center;gap:14px;transition:all .12s}
.habit-card:hover{border-color:var(--fg);box-shadow:var(--shadow)}
.habit-card .check-btn{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--fg);cursor:pointer;transition:all .15s;flex-shrink:0}
.habit-card .check-btn:hover{border-color:var(--fg);background:var(--input)}
.habit-card .check-btn.done{background:var(--fg);color:#fff;border-color:var(--fg)}
.habit-card .check-btn.done:hover{background:var(--fg2)}
.habit-info{flex:1;min-width:0}
.habit-name{font-size:14px;font-weight:700;color:var(--text)}
.habit-stats{display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--sub)}
.habit-stats span{font-weight:700;color:var(--fg)}
.habit-heatmap{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.heat-dot{width:12px;height:12px;border-radius:3px;transition:all .12s}
.heat-dot.empty{background:var(--input)}
.heat-dot.filled{background:var(--fg)}
.habit-card .del{color:var(--sub);font-size:14px;padding:4px 8px;border-radius:4px;opacity:.3;cursor:pointer;transition:all .12s;flex-shrink:0}
.habit-card .del:hover{background:#fef2f2;color:var(--danger);opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="input-area">
    <input type="text" id="habitInput" placeholder="新习惯名称...">
    <button id="addBtn">添加</button>
  </div>
  <div id="habits-list"></div>
</div>
<script>
const api = window.pluginAPI;
const STORAGE_KEY = 'habits';
const habitInput = document.getElementById('habitInput');
const addBtn = document.getElementById('addBtn');
const habitsList = document.getElementById('habits-list');
let habits = [];

function getDateKey() { return new Date().toISOString().split('T')[0]; }
function getDateKeyFrom(d) { return d.toISOString().split('T')[0]; }

function getLastNDays(n) {
  return Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return getDateKeyFrom(d);}).reverse();
}

function isCheckedToday(h) {
  return (h.checks||[]).includes(getDateKey());
}

function streakCount(h) {
  const days = getLastNDays(365);
  let streak = 0;
  for (let i = days.length-1; i >= 0; i--) {
    if ((h.checks||[]).includes(days[i])) streak++;
    else break;
  }
  return streak;
}

function render() {
  if (habits.length === 0) {
    habitsList.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub);font-size:13px">添加第一个习惯开始追踪</div>';
    return;
  }
  const last14 = getLastNDays(14);
  habitsList.innerHTML = habits.map(h => {
    const checked = isCheckedToday(h);
    const streak = streakCount(h);
    const dots = last14.map(d => {
      const filled = (h.checks||[]).includes(d);
      return `<div class="heat-dot ${filled?'filled':'empty'}" title="${d}"></div>`;
    }).join('');
    return `<div class="habit-card" data-id="${h.id}">
      <div class="check-btn${checked?' done':''}" data-action="check">${checked?'✓':' '}</div>
      <div class="habit-info">
        <div class="habit-name">${h.name||''}</div>
        <div class="habit-stats">连续 <span>${streak}</span> 天 · 总计 <span>${(h.checks||[]).length}</span> 天</div>
        <div class="habit-heatmap">${dots}</div>
      </div>
      <div class="del" data-action="del">&times;</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.closest('.habit-card').dataset.id;
      const h = habits.find(h => h.id === id);
      if (!h) return;
      const today = getDateKey();
      if (!h.checks) h.checks = [];
      if (h.checks.includes(today)) h.checks = h.checks.filter(d => d !== today);
      else h.checks.push(today);
      render(); persist();
    });
  });
  document.querySelectorAll('.del').forEach(del => {
    del.addEventListener('click', () => {
      const id = del.closest('.habit-card').dataset.id;
      habits = habits.filter(h => h.id !== id);
      render(); persist();
    });
  });
}

async function persist() { await api.storage.set(STORAGE_KEY, habits); }

function addHabit() {
  const name = habitInput.value.trim();
  if (!name) return;
  habits.push({ id: String(Date.now()), name, checks: [], createdAt: Date.now() });
  habitInput.value = '';
  render(); persist();
}

addBtn.addEventListener('click', addHabit);
habitInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addHabit(); } });

(async () => {
  const data = await api.storage.get(STORAGE_KEY);
  habits = Array.isArray(data) ? data : [];
  render();
})();
</script>
</body>
</html>
