<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配置格式转换</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf5ff;--pan:#fff;--sur:#f3e8ff;--brd:#d8b4fe;--txt:#3b0764;--mu:#9333ea;--ac:#8b5cf6}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);padding-top:32px}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--brd);flex-shrink:0;background:var(--pan)}
.bar span{font-size:14px;font-weight:600;color:var(--ac);margin-right:auto}
.btn{font:12px var(--sans);padding:5px 12px;border:1px solid var(--brd);border-radius:6px;background:var(--pan);color:var(--txt);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--sur)}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.main{flex:1;display:flex;min-height:0;position:relative}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.pane:first-child{border-right:1px solid var(--brd)}
.ph{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--sur);border-bottom:1px solid var(--brd);flex-shrink:0}
.ph .tt{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase}
.sel{padding:3px 8px;border:1px solid var(--brd);border-radius:4px;background:var(--pan);color:var(--txt);font:12px var(--sans);cursor:pointer;outline:none}
.ph .info{margin-left:auto;font-size:10px;color:var(--mu);font-family:'JetBrains Mono',monospace}
#src,#tgt{flex:1;border:none;background:var(--pan);color:var(--txt);font:13px/1.6 'JetBrains Mono',Consolas,monospace;padding:10px 12px;resize:none;outline:none;white-space:pre;overflow:auto;min-height:0}
#tgt{background:#fdfaff}
.swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border:2px solid var(--brd);border-radius:50%;background:var(--pan);color:var(--ac);cursor:pointer;font-size:14px;z-index:5;display:grid;place-items:center;transition:all .2s}
.swap:hover{background:var(--ac);color:#fff;transform:translate(-50%,-50%) scale(1.1) rotate(180deg)}
.err{padding:4px 12px;background:#fee2e2;border-top:1px solid #ef4444;color:#dc2626;font-size:11px;display:none}
.err.on{display:block}
.flash{position:fixed;top:40px;left:50%;transform:translateX(-50%);padding:6px 16px;background:var(--ac);color:#fff;border-radius:6px;font-size:12px;z-index:100;opacity:0;transition:opacity .2s}
.flash.on{opacity:1}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
@media(max-width:700px){.main{flex-direction:column}.pane:first-child{border-right:none;border-bottom:1px solid var(--brd)}.swap{transform:translate(-50%,-50%) rotate(90deg)}.swap:hover{transform:translate(-50%,-50%) scale(1.1) rotate(270deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <span>配置格式转换</span>
    <button class="btn ac" id="cv">转换 →</button>
    <button class="btn" id="sw">交换 ⇄</button>
    <button class="btn" id="cpy">复制结果</button>
    <button class="btn" id="auto">自动检测</button>
  </div>
  <div class="main">
    <div class="pane">
      <div class="ph"><span class="tt">源</span><select class="sel" id="sf"><option value="json">JSON</option><option value="yaml">YAML</option><option value="toml">TOML</option><option value="properties">Properties</option></select><span class="info" id="si">0</span></div>
      <textarea id="src" spellcheck="false" placeholder="粘贴配置内容…"></textarea>
      <div class="err" id="err"></div>
    </div>
    <button class="swap" id="sw2">⇄</button>
    <div class="pane">
      <div class="ph"><span class="tt">目标</span><select class="sel" id="tf"><option value="json">JSON</option><option value="yaml" selected>YAML</option><option value="toml">TOML</option><option value="properties">Properties</option></select><span class="info" id="ti">等待</span></div>
      <textarea id="tgt" spellcheck="false" readonly placeholder="转换结果…"></textarea>
    </div>
  </div>
</div>
<div class="flash" id="fl">已复制</div>
<script>
(function(){
const $=id=>document.getElementById(id);const src=$('src'),tgt=$('tgt'),sf=$('sf'),tf=$('tf'),err=$('err');
function fl(){$('fl').classList.add('on');setTimeout(()=>$('fl').classList.remove('on'),1000)}
function ps(v){const s=v.trim();if(/^(true|false)$/i.test(s))return s.toLowerCase()==='true';if(/^-?\d+$/.test(s))return parseInt(s,10);if(/^-?\d+\.\d+$/.test(s))return parseFloat(s);if((s.startsWith('"')&&s.endsWith('"'))||(s.startsWith("'")&&s.endsWith("'")))return s.slice(1,-1);return s}
function pj(t){return JSON.parse(t)}
function py(t){const r={};const st=[{i:-1,o:r}];for(const l of t.split(/\r?\n/)){const ln=l.replace(/#.*$/,'');if(!ln.trim())continue;const ind=ln.match(/^(\s*)/)[1].length;const m=ln.match(/^\s*([^:]+):\s*(.*)$/);if(!m)continue;while(st.length>1&&st[st.length-1].i>=ind)st.pop();const cur=st[st.length-1].o;const k=m[1].trim(),v=m[2].trim();if(v===''){const n={};cur[k]=n;st.push({i:ind,o:n})}else cur[k]=ps(v)}return r}
function pt(t){const r={};let c=r;for(const l of t.split(/\r?\n/)){const ln=l.trim();if(!ln||ln.startsWith('#'))continue;const s=ln.match(/^\[([^\]]+)\]$/);if(s){c=r;for(const p of s[1].split('.')){c[p]=c[p]||{};c=c[p]}}const m=ln.match(/^([^=]+)=\s*(.*)$/);if(m)c[m[1].trim()]=ps(m[2])}return r}
function pp(t){const r={};for(const l of t.split(/\r?\n/)){const ln=l.trim();if(!ln||ln.startsWith('#')||ln.startsWith('!'))continue;const i=ln.search(/[:=]/);r[i<0?ln:ln.slice(0,i).trim()]=i<0?'':ln.slice(i+1).trim()}return r}
function sj(o){return JSON.stringify(o,null,2)}
function sy(o,ind){ind=ind||0;const pad='  '.repeat(ind);let lines=[];for(const[k,v]of Object.entries(o)){if(v!==null&&typeof v==='object'&&!Array.isArray(v)){lines.push(pad+k+':');lines.push(sy(v,ind+1))}else lines.push(pad+k+': '+fs(v))}return lines.join('\n')}
function st(o,pfx){pfx=pfx||'';const lines=[],secs=[];for(const[k,v]of Object.entries(o)){if(v!==null&&typeof v==='object'&&!Array.isArray(v)){const f=pfx?pfx+'.'+k:k;secs.push('['+f+']');secs.push(st(v,f))}else lines.push(k+' = '+fs(v))}return[...lines,...secs].filter(Boolean).join('\n')}
function sp(o,pfx){pfx=pfx||'';let lines=[];for(const[k,v]of Object.entries(o)){const fk=pfx?pfx+'.'+k:k;if(v!==null&&typeof v==='object'&&!Array.isArray(v))lines.push(sp(v,fk));else lines.push(fk+' = '+String(v))}return lines.join('\n')}
function fs(v){if(v===null)return'null';if(typeof v==='boolean')return String(v);if(typeof v==='number')return String(v);if(typeof v==='string')return v.includes(' ')||v.includes(':')?'"'+v+'"':v;return JSON.stringify(v)}
function detect(t){t=t.trim();if(t.startsWith('{')||t.startsWith('['))return'json';if(/^\[[^\]]+\]/m.test(t))return'toml';if(/^[^:#!\[\s]+=.+$/m.test(t))return'properties';return'yaml'}
function cv(){const t=src.value.trim();if(!t)return;err.classList.remove('on');try{let o;switch(sf.value){case'json':o=pj(t);break;case'yaml':o=py(t);break;case'toml':o=pt(t);break;case'properties':o=pp(t);break}let r;switch(tf.value){case'json':r=sj(o);break;case'yaml':r=sy(o);break;case'toml':r=st(o);break;case'properties':r=sp(o);break}tgt.value=r;$('ti').textContent=r.length}catch(e){err.textContent='解析失败: '+e.message;err.classList.add('on')}}
function sw(){const sfv=sf.value;sf.value=tf.value;tf.value=sfv;if(tgt.value.trim()){src.value=tgt.value;tgt.value=''}$('si').textContent=src.value.length;cv()}
src.addEventListener('input',()=>{$('si').textContent=src.value.length;err.classList.remove('on');clearTimeout(window._t);window._t=setTimeout(cv,300)});
src.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();cv()}});
$('cv').addEventListener('click',cv);$('sw').addEventListener('click',sw);$('sw2').addEventListener('click',sw);
$('auto').addEventListener('click',()=>{const d=detect(src.value.trim());if(d){sf.value=d;cv()}});
$('cpy').addEventListener('click',()=>{if(tgt.value.trim()){window.services.clipboard.writeText(tgt.value);fl()}});
window.addEventListener('plugin-enter',e=>{if(e.detail&&typeof e.detail==='string'){src.value=e.detail;const d=detect(e.detail);sf.value=d;cv()}});
})();
</script>
</body>
</html>
