<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID 生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0faff;--pan:#fff;--sur:#e0f2fe;--brd:#bae6fd;--txt:#0c4a6e;--mu:#0284c7;--ac:#0ea5e9}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);padding-top:32px}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--brd);flex-shrink:0;background:var(--pan)}
.bar span{font-size:14px;font-weight:600;color:var(--ac);margin-right:auto}
.btn{font:12px var(--sans);padding:5px 12px;border:1px solid var(--brd);border-radius:6px;background:var(--pan);color:var(--txt);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--sur)}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.cfg{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--brd);flex-shrink:0;flex-wrap:wrap}
.type{display:inline-flex;border:1px solid var(--brd);border-radius:6px;overflow:hidden}
.type button{padding:5px 12px;border:none;background:none;color:var(--mu);font-size:12px;cursor:pointer;transition:all .12s}
.type button.on{background:var(--ac);color:#fff}
.cfg label{font-size:11px;color:var(--mu);font-weight:600}
.cfg input{width:60px;padding:4px 8px;border:1px solid var(--brd);border-radius:5px;background:var(--pan);color:var(--txt);font:12px 'JetBrains Mono',monospace;outline:none;text-align:center}
.cfg input:focus{border-color:var(--ac)}
.cfg .alph{width:240px;text-align:left}
.nano{display:none;align-items:center;gap:10px}.nano.on{display:flex}
.list{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-height:0}
.list .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--mu);gap:8px}
.list .empty b{font-size:36px;font-weight:300;opacity:.3}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--brd);border-radius:8px;background:var(--pan);transition:all .15s;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.row:hover{border-color:var(--ac);transform:translateX(2px)}
.row .idx{font:10px 'JetBrains Mono',monospace;color:var(--mu);min-width:24px;text-align:right}
.row .val{flex:1;font:13px 'JetBrains Mono',Consolas,monospace;color:var(--txt);user-select:all;word-break:break-all}
.row .cp{font-size:10px;padding:3px 8px;border:1px solid var(--brd);border-radius:4px;background:var(--pan);color:var(--mu);cursor:pointer;transition:all .12s;flex-shrink:0}
.row .cp:hover{color:var(--ac);border-color:var(--ac)}
.row .cp.done{background:#10b981;color:#fff;border-color:#10b981}
.flash{position:fixed;top:40px;left:50%;transform:translateX(-50%);padding:6px 16px;background:var(--ac);color:#fff;border-radius:6px;font-size:12px;z-index:100;opacity:0;transition:opacity .2s}
.flash.on{opacity:1}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <span>ID 生成器</span>
    <button class="btn ac" id="gen">生成</button>
    <button class="btn" id="copyall">全部复制</button>
    <button class="btn" id="clr">清空</button>
  </div>
  <div class="cfg">
    <div class="type"><button class="on" data-t="uuid">UUID v4</button><button data-t="nano">NanoID</button></div>
    <label>数量</label><input type="number" id="cnt" value="10" min="1" max="1000">
    <div class="nano" id="nano">
      <label>长度</label><input type="number" id="len" value="21" min="4" max="128">
      <label>字母表</label><input type="text" class="alph" id="alph" value="0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_-">
    </div>
  </div>
  <div class="list" id="list"><div class="empty"><b>✦</b><div>点击"生成"按钮创建 ID</div></div></div>
</div>
<div class="flash" id="fl">已复制</div>
<script>
(function(){
const $=id=>document.getElementById(id);const list=$('list');let type='uuid',ids=[];
function fl(){$('fl').classList.add('on');setTimeout(()=>$('fl').classList.remove('on'),1000)}
function st(t){type=t;document.querySelectorAll('.type button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('nano').classList.toggle('on',t==='nano')}
function gen(){const c=Math.min(1000,Math.max(1,parseInt($('cnt').value,10)||1));ids=[];if(type==='uuid'){for(let i=0;i<c;i++)ids.push(window.services.generateUuid())}else{const l=Math.min(128,Math.max(4,parseInt($('len').value,10)||21));const a=$('alph').value||'0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_-';for(let i=0;i<c;i++)ids.push(window.services.generateNanoId(l,a))}render()}
function render(){if(!ids.length){list.innerHTML='<div class="empty"><b>✦</b><div>点击"生成"按钮创建 ID</div></div>';return}list.innerHTML='';ids.forEach((id,i)=>{const r=document.createElement('div');r.className='row';r.style.animationDelay=(i*12)+'ms';r.innerHTML='<span class="idx">'+(i+1)+'.</span><span class="val">'+id+'</span>';const cp=document.createElement('button');cp.className='cp';cp.textContent='复制';cp.addEventListener('click',()=>{window.services.clipboard.writeText(id);cp.textContent='✓';cp.classList.add('done');setTimeout(()=>{cp.textContent='复制';cp.classList.remove('done')},1200);fl()});r.appendChild(cp);list.appendChild(r)})}
document.querySelectorAll('.type button').forEach(b=>b.addEventListener('click',()=>st(b.dataset.t)));
$('gen').addEventListener('click',gen);$('copyall').addEventListener('click',()=>{if(!ids.length)return;window.services.clipboard.writeText(ids.join('\n'));fl()});
$('clr').addEventListener('click',()=>{ids=[];render()});
gen();
})();
</script>
</body>
</html>
