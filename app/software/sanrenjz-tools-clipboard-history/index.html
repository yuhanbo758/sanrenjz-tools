<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剪贴板历史</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--accent:#475569;--hover:#f1f5f9;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.top-bar img{width:32px;height:32px;border-radius:8px;flex-shrink:0}
.top-bar h1{font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-bar input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:13px;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:var(--accent)}
.toggle-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;font-size:12px;color:var(--muted)}
.toggle-wrap input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.list-scroll{flex:1;overflow-y:auto;min-height:0}
.list-scroll::-webkit-scrollbar{width:5px}
.list-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.item:hover{background:var(--hover)}
.item:active{background:#e2e8f0}
.item-icon{width:20px;height:20px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--bg);font-size:11px;color:var(--muted)}
.item-content{flex:1;min-width:0}
.item-text{font-size:12px;line-height:1.5;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.item-time{font-size:11px;color:var(--muted);margin-top:2px}
.item-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.item:hover .item-actions{opacity:1}
.item-actions button{width:24px;height:24px;border:none;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.item-actions button:hover{background:var(--border);color:var(--text)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--muted);padding:40px}
.empty strong{font-size:15px;color:var(--text)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 16px;background:var(--text);color:#fff;border-radius:6px;font-size:12px;z-index:99;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="top-bar">
  <img src="logo.svg" alt="" onerror="this.style.display='none'">
  <h1>剪贴板历史</h1>
</div>
<div class="search-bar">
  <input type="text" id="filterInput" placeholder="搜索剪贴板内容...">
  <label class="toggle-wrap">
    <input type="checkbox" id="autoRecord" checked>
    <span>自动记录</span>
  </label>
</div>
<div class="list-scroll" id="listContainer">
  <div class="empty" id="emptyState">
    <strong>暂无记录</strong>
    <span>复制内容后将自动出现在这里</span>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const api = window.pluginAPI;
const filterInput = document.getElementById('filterInput');
const autoRecord = document.getElementById('autoRecord');
const listContainer = document.getElementById('listContainer');
const emptyState = document.getElementById('emptyState');
const toast = document.getElementById('toast');
let history = [];
let pollTimer = null;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function render() {
  const q = filterInput.value.toLowerCase();
  const filtered = q ? history.filter(h => h.text.toLowerCase().includes(q)) : history;
  if (!filtered.length) {
    emptyState.style.display = 'flex';
    listContainer.querySelectorAll('.item').forEach(el => el.remove());
    return;
  }
  emptyState.style.display = 'none';
  let html = '';
  filtered.forEach((h, i) => {
    html += `<div class="item" data-idx="${i}" onclick="copyItem(${i})">
      <div class="item-icon">${h.type === 'image' ? '🖼' : 'T'}</div>
      <div class="item-content">
        <div class="item-text">${h.type === 'image' ? '[图片]' : escapeHtml(h.text)}</div>
        <div class="item-time">${formatTime(h.time)}</div>
      </div>
      <div class="item-actions">
        <button onclick="event.stopPropagation();copyItem(${i})" title="复制">&#x1F4CB;</button>
        <button onclick="event.stopPropagation();removeItem(${i})" title="删除">&times;</button>
      </div>
    </div>`;
  });
  listContainer.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function copyItem(idx) {
  const item = history[idx];
  if (!item) return;
  api.copyText(item.text);
  showToast('已复制到剪贴板');
}

function removeItem(idx) {
  history.splice(idx, 1);
  saveHistory();
  render();
}

async function saveHistory() {
  try { await api.storage.set('history', JSON.stringify(history)); } catch (_) {}
}

async function loadHistory() {
  try {
    const raw = await api.storage.get('history');
    history = raw ? JSON.parse(raw) : [];
  } catch (_) { history = []; }
  render();
}

async function pollClipboard() {
  if (!autoRecord.checked) return;
  try {
    const text = api.readClipboardText();
    const img = api.readClipboardImage();
    if (text && text.length > 0 && text.length < 50000) {
      if (!history.length || history[0].text !== text) {
        history.unshift({ text, type: 'text', time: Date.now() });
        if (history.length > 200) history.length = 200;
        await saveHistory();
        render();
      }
    }
    if (img && img.length > 0) {
      const lastImg = history.find(h => h.type === 'image');
      if (!lastImg || lastImg.text !== img) {
        history.unshift({ text: img, type: 'image', time: Date.now() });
        if (history.length > 200) history.length = 200;
        await saveHistory();
        render();
      }
    }
  } catch (_) {}
}

filterInput.addEventListener('input', render);
autoRecord.addEventListener('change', async () => {
  try { await api.storage.set('autoRecord', autoRecord.checked ? '1' : '0'); } catch (_) {}
});

(async () => {
  await loadHistory();
  try {
    const v = await api.storage.get('autoRecord');
    autoRecord.checked = v !== '0';
  } catch (_) {}
  pollTimer = setInterval(pollClipboard, 1000);
})();

window.addEventListener('beforeunload', () => {
  if (pollTimer) clearInterval(pollTimer);
});
</script>
</body>
</html>
