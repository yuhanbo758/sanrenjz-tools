<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG 工作台</title>
<style>:root{--bg:#111827;--panel:#1a2332;--surface:#0c1320;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;--accent:#38bdf8;--accent2:#7dd3fc;--r:10px}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body::before{content:'';position:fixed;top:0;left:0;right:0;height:32px;z-index:99;background:var(--panel);-webkit-app-region:drag}.custom-title-bar{background:var(--panel)!important;color:var(--muted)!important;font-size:11px!important;border-bottom:1px solid var(--border)!important}button,input,textarea{-webkit-app-region:no-drag;font:inherit;color:inherit}button{cursor:pointer;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;transition:all .18s}button:active{transform:scale(.96)}.app{display:flex;height:calc(100vh - 32px);padding:16px;gap:14px;overflow:hidden}.editor-panel{width:360px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}.editor-panel h1{font-size:20px;margin:0;color:var(--accent);font-weight:800;letter-spacing:-.3px}.editor-panel textarea{flex:1;min-height:0;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-family:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;font-size:13px;line-height:1.5;resize:none;outline:none;transition:border .15s;tab-size:2}.editor-panel textarea:focus{border-color:var(--accent)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.controls label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}.controls input[type=number]{width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}.controls input[type=number]:focus{border-color:var(--accent)}.controls .checkbox-row{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}.controls input[type=checkbox]{accent-color:var(--accent)}.actions{display:flex;gap:8px}.actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}.actions .render{background:var(--accent);color:#0c1320}.actions .render:hover{background:var(--accent2);box-shadow:0 4px 14px rgba(56,189,248,.3)}.actions .export{background:var(--surface);color:var(--accent);border:1px solid var(--border)}.actions .export:hover{background:var(--accent);color:#0c1320}.actions .open{background:var(--surface);color:var(--accent);border:1px solid var(--border)}.actions .open:hover{background:var(--accent);color:#0c1320}.preview-panel{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview-panel .checker{position:absolute;inset:0;background-image:linear-gradient(45deg,#1a1a2e 25%,transparent 25%),linear-gradient(-45deg,#1a1a2e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1a2e 75%),linear-gradient(-45deg,transparent 75%,#1a1a2e 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;opacity:.3;z-index:0}.preview-panel img,.preview-panel canvas{position:relative;z-index:1;max-width:90%;max-height:90%;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.4)}.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);opacity:.35;z-index:1}.empty svg{width:56px;height:56px}.info-bar{position:absolute;bottom:12px;right:16px;z-index:2;background:rgba(0,0,0,.7);color:#fff;padding:5px 12px;border-radius:16px;font-size:12px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}.saved{color:#22c55e;font-size:12px;font-weight:600;margin-left:6px}.error{color:#ef4444;font-size:12px;margin-top:4px;display:none}</style></head>
<body>
<div class="app">
  <div class="editor-panel">
    <h1>SVG 工作台</h1>
    <textarea id="svgInput" placeholder="粘贴 SVG 代码或点击打开 SVG 文件..."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect x="10" y="10" width="180" height="180" rx="20" fill="#38bdf8"/>
  <circle cx="100" cy="100" r="50" fill="#fff" opacity="0.8"/>
  <text x="100" y="110" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">SVG</text>
</svg></textarea>
    <div class="error" id="errorMsg"></div>
    <div class="controls">
      <label>导出宽 <input type="number" id="exportW" value="400" min="32" max="4000"></label>
      <label>导出高 <input type="number" id="exportH" value="400" min="32" max="4000"></label>
      <label class="checkbox-row"><input type="checkbox" id="minify" checked>压缩</label>
    </div>
    <div class="actions">
      <button class="render" id="renderBtn">渲染预览</button>
      <button class="open" id="openBtn">打开 SVG</button>
      <button class="export" id="exportBtn">导出 PNG</button>
      <span class="saved" id="savedLabel" hidden>已导出</span>
    </div>
  </div>
  <div class="preview-panel" id="previewPanel">
    <div class="checker"></div>
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h7"/></svg><div>输入 SVG 代码后渲染预览</div></div>
    <div class="info-bar" id="infoBar" hidden></div>
  </div>
</div>
<script>
const api=window.pluginAPI,$=id=>document.getElementById(id);
let outDataUrl='';
function renderSvg(){const svg=$('svgInput').value.trim();if(!svg){$('errorMsg').style.display='none';return}try{const svgData='data:image/svg+xml,'+encodeURIComponent(svg.trim());const img=new Image();img.onload=()=>{const w=Number($('exportW').value)||img.width;const h=Number($('exportH').value)||img.height;const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);outDataUrl=c.toDataURL();$('previewPanel').innerHTML='<div class="checker"></div>';const el=document.createElement('img');el.src=outDataUrl;$('previewPanel').appendChild(el);$('infoBar').hidden=0;$('infoBar').textContent=`${w} × ${h}`;$('previewPanel').appendChild($('infoBar'));$('errorMsg').style.display='none'};img.onerror=()=>{$('errorMsg').textContent='SVG 渲染失败，请检查代码';$('errorMsg').style.display='block'};img.src=svgData}catch(e){$('errorMsg').textContent='SVG 解析失败: '+e.message;$('errorMsg').style.display='block'}}
$('renderBtn').addEventListener('click',renderSvg);
$('svgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();renderSvg()}});
$('openBtn').addEventListener('click',()=>{const f=api.selectFiles({title:'打开 SVG',multiple:false,filters:[{name:'SVG',extensions:['svg']},{name:'文本',extensions:['txt']}]});if(f.length){const fs=require('fs');$('svgInput').value=fs.readFileSync(f[0],'utf8');renderSvg()}});
$('exportBtn').addEventListener('click',()=>{if(!outDataUrl)return;const r=api.saveResult({dataUrl:outDataUrl,defaultPath:'exported.png',title:'导出 PNG',filters:[{name:'PNG',extensions:['png']}]});if(!r.cancelled){$('savedLabel').hidden=0;setTimeout(()=>$('savedLabel').hidden=1,2000)}});
$('exportW').addEventListener('change',renderSvg);$('exportH').addEventListener('change',renderSvg);
$('minify').addEventListener('change',()=>{$('svgInput').value=$('minify').checked?$('svgInput').value.replace(/\n\s*/g,' ').replace(/>\s+</g,'><').trim():$('svgInput').value});
</script></body></html>
