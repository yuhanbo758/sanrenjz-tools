<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文本编码转换</title>
<style>
:root{--bg:#fff7ed;--panel:#fff;--surface:#ffedd5;--text:#4a2511;--muted:#9a6b4f;--border:#fed7aa;--accent:#ea580c;--accent2:#f97316;--ok:#16a34a;--radius:12px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
.top .btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s}
.top .btn:hover{background:var(--surface)}
.top .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.top .btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.top .btn.go{background:var(--ok);color:#fff;border-color:var(--ok)}
.top .btn.go:hover{background:color-mix(in srgb,var(--ok) 85%,#000)}
.config{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px}
.config .fld{display:flex;align-items:center;gap:4px}
.config .fld label{color:var(--muted);white-space:nowrap;font-weight:500}
.config .fld select,.config .fld input{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);font-size:11px;outline:none;color:var(--text)}
.config .fld select:focus,.config .fld input:focus{border-color:var(--accent)}
.config .arr{color:var(--accent);font-weight:700;font-size:13px}
.files{flex:1;overflow-y:auto;padding:6px 0}
.files .row{display:grid;grid-template-columns:auto 1fr 80px 70px;gap:8px;align-items:center;padding:7px 14px;font-size:12px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);font-family:"SF Mono","Cascadia Code","Consolas",monospace;transition:background .1s}
.files .row:hover{background:var(--surface)}
.files .row .icon{font-size:14px;text-align:center}
.files .row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.files .row .chars{font-size:10px;color:var(--muted);text-align:right}
.files .row .status{font-size:10px;text-align:center;font-weight:600}
.files .row .status.ok{color:var(--ok)}
.files .row .status.err{color:var(--accent)}
.files .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
.files .empty strong{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.stat{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
.stat .cnt{font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">&#128196;</div>
    <h1>文本编码转换</h1>
    <button class="btn" id="pickFiles">添加文件</button>
    <button class="btn" id="clearFiles">清空</button>
    <button class="btn primary" id="preview">预览</button>
    <button class="btn go" id="convert">执行转换</button>
  </div>
  <div class="config">
    <div class="fld"><label>源编码</label><select id="srcEnc"><option value="utf8">UTF-8</option><option value="gbk">GBK</option><option value="gb2312">GB2312</option><option value="utf16le">UTF-16 LE</option><option value="utf16be">UTF-16 BE</option><option value="big5">Big5</option><option value="shift_jis">Shift_JIS</option><option value="euc-kr">EUC-KR</option></select></div>
    <span class="arr">&#8594;</span>
    <div class="fld"><label>目标编码</label><select id="tgtEnc"><option value="utf8">UTF-8</option><option value="gbk">GBK</option><option value="gb2312">GB2312</option><option value="utf16le">UTF-16 LE</option><option value="utf16be">UTF-16 BE</option><option value="big5">Big5</option><option value="shift_jis">Shift_JIS</option><option value="euc-kr">EUC-KR</option></select></div>
    <div class="fld"><label>换行符</label><select id="newline"><option value="">保持原样</option><option value="lf">LF (Unix)</option><option value="crlf">CRLF (Windows)</option></select></div>
    <div class="fld"><label>输出后缀</label><input type="text" id="suffix" value=".converted.txt" style="width:110px"></div>
  </div>
  <div class="files" id="files">
    <div class="empty"><strong>添加文件开始转换</strong>支持 UTF-8、GBK、UTF-16 等编码互转</div>
  </div>
  <div class="stat"><span id="statText"></span><span class="cnt" id="statCount"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const API=window.pluginAPI;
let fileList=[];
let results=[];

async function pickFiles(){const f=await API.selectFiles({title:'选择文本文件',filters:[{name:'文本文件',extensions:['txt','csv','json','xml','html','md','js','ts','css','py','java','c','cpp','h','log','yml','yaml','toml','ini','cfg']},{name:'所有文件',extensions:['*']}]});if(f.length){fileList=[...new Set([...fileList,...f])];renderFiles()}}
function clearFiles(){fileList=[];results=[];renderFiles()}
function renderFiles(){const el=$('#files');if(!fileList.length){el.innerHTML='<div class="empty"><strong>添加文件开始转换</strong>支持 UTF-8、GBK、UTF-16 等编码互转</div>';$('#statCount').textContent='';$('#statText').textContent='';return}
  el.innerHTML=fileList.map(f=>{const r=results.find(x=>x.source===f);const name=f.split(/[\\/]/).pop();return`<div class="row"><span class="icon">&#128196;</span><span class="name" title="${f}">${name}</span><span class="chars">${r?r.characters+' 字符':'-'}</span><span class="status ${r?'ok':''}">${r?'已转换':'待处理'}</span></div>`}).join('');
  $('#statCount').textContent=fileList.length+' 个文件';
}
async function doPreview(){if(!fileList.length)return;$('#statText').textContent='预览中...';const r=await API.runTask({options:{files:fileList,sourceEncoding:$('#srcEnc').value,targetEncoding:$('#tgtEnc').value,newline:$('#newline').value,suffix:$('#suffix').value}});if(r.ok){results=r.result;renderFiles();$('#statText').textContent='预览完成'}else{$('#statText').textContent=r.error}}
async function doConvert(){if(!fileList.length)return;$('#statText').textContent='转换中...';const r=await API.runTask({options:{files:fileList,sourceEncoding:$('#srcEnc').value,targetEncoding:$('#tgtEnc').value,newline:$('#newline').value,suffix:$('#suffix').value},execute:true});if(r.ok){results=r.result;renderFiles();$('#statText').textContent='转换完成'}else{$('#statText').textContent=r.error}}

$('#pickFiles').onclick=pickFiles;$('#clearFiles').onclick=clearFiles;
$('#preview').onclick=doPreview;$('#convert').onclick=doConvert;
</script>
</body>
</html>
