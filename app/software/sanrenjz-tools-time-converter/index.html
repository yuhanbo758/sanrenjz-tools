<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时间转换器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0fdfa;--pan:#fff;--sur:#ccfbf1;--brd:#99f6e4;--txt:#134e4a;--mu:#0f766e;--ac:#14b8a6}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);padding-top:32px}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--brd);flex-shrink:0;background:var(--pan)}
.bar span{font-size:14px;font-weight:600;color:var(--ac);margin-right:auto}
.btn{font:12px var(--sans);padding:5px 12px;border:1px solid var(--brd);border-radius:6px;background:var(--pan);color:var(--txt);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--sur)}
.inp{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--brd);flex-shrink:0}
.inp input{flex:1;padding:8px 12px;border:1px solid var(--brd);border-radius:8px;background:var(--pan);color:var(--txt);font:14px 'JetBrains Mono',monospace;outline:none}
.inp input:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(20,184,166,.15)}
.inp select{padding:8px 12px;border:1px solid var(--brd);border-radius:8px;background:var(--pan);color:var(--txt);font:12px var(--sans);cursor:pointer;outline:none}
.quick{display:flex;gap:4px;padding:6px 14px;border-bottom:1px solid var(--brd);flex-shrink:0;flex-wrap:wrap}
.quick button{padding:4px 10px;border:1px solid var(--brd);border-radius:14px;background:var(--pan);color:var(--mu);font-size:11px;cursor:pointer;transition:all .12s}
.quick button:hover{border-color:var(--ac);color:var(--ac)}
.cards{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.cards .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--mu);gap:8px}
.cards .empty b{font-size:36px;font-weight:300;opacity:.3}
.card{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--brd);border-radius:10px;background:var(--pan);transition:all .15s;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:var(--ac)}
.card .lb{font-size:11px;font-weight:600;color:var(--mu);min-width:90px;text-transform:uppercase;letter-spacing:.3px}
.card .val{flex:1;font:13px 'JetBrains Mono',monospace;color:var(--txt);user-select:all}
.card .cp{font-size:10px;padding:3px 8px;border:1px solid var(--brd);border-radius:4px;background:var(--pan);color:var(--mu);cursor:pointer;transition:all .12s;flex-shrink:0}
.card .cp:hover{color:var(--ac);border-color:var(--ac)}
.card .cp.done{background:#10b981;color:#fff;border-color:#10b981}
.now{display:flex;align-items:center;justify-content:flex-end;padding:4px 14px;border-top:1px solid var(--brd);flex-shrink:0;font:12px 'JetBrains Mono',monospace;color:var(--mu)}
.flash{position:fixed;top:40px;left:50%;transform:translateX(-50%);padding:6px 16px;background:var(--ac);color:#fff;border-radius:6px;font-size:12px;z-index:100;opacity:0;transition:opacity .2s}
.flash.on{opacity:1}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><span>时间转换器</span></div>
  <div class="inp">
    <input id="inp" placeholder="时间戳 / ISO / 日期…" spellcheck="false">
    <select id="tz"><option value="">本地时区</option><option value="UTC">UTC</option><option value="Asia/Shanghai">Asia/Shanghai</option><option value="Asia/Tokyo">Asia/Tokyo</option><option value="America/New_York">America/New_York</option><option value="Europe/London">Europe/London</option></select>
  </div>
  <div class="quick">
    <button data-q="now">当前</button><button data-q="today">今天</button><button data-q="tomorrow">明天</button><button data-q="week">周一</button><button data-q="year">元旦</button>
  </div>
  <div class="cards" id="cards"><div class="empty"><b>🕐</b><div>输入时间戳或日期文本</div></div></div>
  <div class="now" id="now">--:--:--</div>
</div>
<div class="flash" id="fl">已复制</div>
<script>
(function(){
const $=id=>document.getElementById(id);const inp=$('inp'),tz=$('tz'),cards=$('cards');
function fl(){$('fl').classList.add('on');setTimeout(()=>$('fl').classList.remove('on'),1000)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function parse(t){t=t.trim();if(!t)return null;if(/^\d{10,13}$/.test(t)){const ts=parseInt(t,10);return new Date(ts*(t.length===10?1000:1))}const d=new Date(t);return isNaN(d.getTime())?null:d}
function rel(d){const diff=Date.now()-d.getTime(),abs=Math.abs(diff),fut=diff<0;const u=[{u:'年',m:31536000000},{u:'月',m:2592000000},{u:'天',m:86400000},{u:'小时',m:3600000},{u:'分钟',m:60000},{u:'秒',m:1000}];for(const{x:u,m}of u){if(abs>=m){const v=Math.floor(abs/m);return fut?v+' '+u+'后':v+' '+u+'前'}}return'刚刚'}
function fmt(d,o){const t=tz.value||undefined;if(t)o={...o,timeZone:t};return new Intl.DateTimeFormat('zh-CN',o).format(d)}
function cv(){const t=inp.value.trim();if(!t){cards.innerHTML='<div class="empty"><b>🕐</b><div>输入时间戳或日期文本</div></div>';return}const d=parse(t);if(!d||isNaN(d.getTime())){cards.innerHTML='<div class="empty" style="color:#ef4444"><b>⚠</b><div>无法解析</div></div>';return}const ts=d.getTime();const items=[{l:'ISO 8601',v:d.toISOString()},{l:'本地时间',v:fmt(d,{dateStyle:'full',timeStyle:'long'})},{l:'Unix 秒',v:String(Math.floor(ts/1000))},{l:'Unix 毫秒',v:String(ts)},{l:'日期',v:fmt(d,{year:'numeric',month:'2-digit',day:'2-digit'})},{l:'时间',v:fmt(d,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})},{l:'星期',v:fmt(d,{weekday:'long'})},{l:'相对',v:rel(d)},{l:'时区',v:tz.value||Intl.DateTimeFormat().resolvedOptions().timeZone}];cards.innerHTML='';items.forEach((x,i)=>{const c=document.createElement('div');c.className='card';c.style.animationDelay=(i*20)+'ms';c.innerHTML='<span class="lb">'+x.l+'</span><span class="val">'+esc(x.v)+'</span>';const cp=document.createElement('button');cp.className='cp';cp.textContent='复制';cp.addEventListener('click',()=>{window.services.clipboard.writeText(x.v);cp.textContent='✓';cp.classList.add('done');setTimeout(()=>{cp.textContent='复制';cp.classList.remove('done')},1200);fl()});c.appendChild(cp);cards.appendChild(c)})}
let dt;inp.addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(cv,200)});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cv()}});tz.addEventListener('change',cv);
document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>{const now=new Date();let t;const q=b.dataset.q;if(q==='now')t=now;else if(q==='today'){t=new Date(now);t.setHours(0,0,0,0)}else if(q==='tomorrow'){t=new Date(now);t.setDate(t.getDate()+1);t.setHours(0,0,0,0)}else if(q==='week'){t=new Date(now);const d=t.getDay()||7;t.setDate(t.getDate()-d+1);t.setHours(0,0,0,0)}else if(q==='year')t=new Date(now.getFullYear(),0,1);inp.value=String(Math.floor(t.getTime()/1000));cv()}));
function clk(){$('now').textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}setInterval(clk,1000);clk();
window.addEventListener('plugin-enter',e=>{if(e.detail&&typeof e.detail==='string'){inp.value=e.detail;cv()}});
inp.value=String(Math.floor(Date.now()/1000));cv();
})();
</script>
</body>
</html>
