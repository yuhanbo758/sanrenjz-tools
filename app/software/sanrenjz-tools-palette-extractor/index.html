<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调色板提取</title>
<style>:root{--bg:#fffbeb;--panel:#fff;--surface:#fef3c7;--text:#451a03;--muted:#92400e;--border:#fde68a;--accent:#d97706;--accent2:#f59e0b;--r:12px}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{display:flex;height:calc(100vh - 32px);padding:20px;gap:16px;overflow:hidden}.left{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}.left h1{font-size:22px;margin:0;color:var(--accent);font-weight:800;letter-spacing:-.3px}.pick-btn{width:100%;padding:14px;border:2px dashed var(--border);border-radius:var(--r);background:var(--surface);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}.pick-btn:hover{border-color:var(--accent);background:var(--panel)}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}.card h3{font-size:13px;font-weight:700;margin:0;color:var(--text)}.card label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.card input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--surface);outline:none}.card input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(217,119,6,.3)}.card .range-row{display:flex;align-items:center;gap:10px}.card .range-row .val{min-width:28px;text-align:right;font-size:13px;color:var(--accent);font-weight:700}.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;flex:1;overflow-y:auto;align-content:start}.swatch{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .15s}.swatch:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}.swatch .color{height:48px;transition:transform .15s}.swatch:hover .color{transform:scale(1.05)}.swatch .info{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.swatch .info .hex{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.3px}.swatch .info .rgb{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.swatch .copy-btn{width:100%;padding:3px 0;border:none;background:var(--surface);font-size:10px;color:var(--accent);font-weight:600;cursor:pointer;transition:all .15s}.swatch .copy-btn:hover{background:var(--accent);color:#fff}.right{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden}.right img,.right canvas{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);opacity:.35}.empty svg{width:56px;height:56px}.copied-toast{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:6px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:10;animation:toastIn .3s,toastOut .3s 1.2s forwards}@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}@keyframes toastOut{from{opacity:1}to{opacity:0}}</style></head>
<body>
<div class="app">
  <div class="left">
    <h1>调色板提取</h1>
    <button class="pick-btn" id="pickBtn">选择图片提取配色</button>
    <div class="card">
      <h3>提取参数</h3>
      <label>颜色数量 <div class="range-row"><input type="range" id="count" min="4" max="32" value="8"><span class="val" id="cntVal">8</span></div></label>
      <button class="pick-btn" id="extractBtn" style="margin-top:4px;padding:10px;font-size:13px">提取颜色</button>
    </div>
    <div class="swatch-grid" id="swatchGrid"><div class="empty" style="width:100%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/><path d="M12 3v18"/><path d="M3 12h18"/></svg><div>选择图片后自动提取</div></div></div>
  </div>
  <div class="right" id="preview">
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><div>选择图片后显示预览</div></div>
  </div>
</div>
<script>
const api=window.pluginAPI,$=id=>document.getElementById(id);
let origDataUrl='';
$('count').addEventListener('input',()=>{$('cntVal').textContent=$('count').value});
function extractPalette(){if(!origDataUrl)return;const img=new Image();img.onload=()=>{const n=Number($('count').value);const c=document.createElement('canvas');const s=Math.min(img.width,img.height,200);c.width=s;c.height=s;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,s,s);const d=ctx.getImageData(0,0,s,s).data;const colors=[];const step=Math.max(1,Math.floor(Math.sqrt(d.length/4/n/4)));for(let i=0;i<d.length;i+=4*step){const r=d[i],g=d[i+1],b=d[i+2];const key=Math.round(r/16)*4096+Math.round(g/16)*64+Math.round(b/16);const existing=colors.find(x=>x.key===key);if(existing){existing.count++;existing.r+=r;existing.g+=g;existing.b+=b}else colors.push({key,count:1,r,g,b})}colors.sort((a,b)=>b.count-a.count);const top=colors.slice(0,n).map(x=>({r:Math.round(x.r/x.count),g:Math.round(x.g/x.count),b:Math.round(x.b/x.count)}));renderSwatches(top);$('preview').innerHTML='';const el=document.createElement('img');el.src=origDataUrl;$('preview').appendChild(el)};img.src=origDataUrl}
function toHex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function renderSwatches(colors){$('swatchGrid').innerHTML=colors.map(c=>{const hex=toHex(c.r,c.g,c.b);const lum=(c.r*299+c.g*587+c.b*114)/1000;return`<div class="swatch"><div class="color" style="background:${hex}"></div><div class="info"><span class="hex">${hex.toUpperCase()}</span><span class="rgb">rgb(${c.r},${c.g},${c.b})</span></div><button class="copy-btn" data-hex="${hex}">复制 HEX</button></div>`}).join('');$('swatchGrid').querySelectorAll('.copy-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const hex=b.dataset.hex;api.copyText(hex);showToast(hex+' 已复制')}));$('swatchGrid').querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>{const hex=s.querySelector('.hex').textContent;api.copyText(hex);showToast(hex+' 已复制')}))}
function showToast(msg){const t=document.createElement('div');t.className='copied-toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
$('pickBtn').addEventListener('click',()=>{const f=api.selectFiles({title:'选择图片',multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});if(f.length){origDataUrl=api.readFileDataUrl(f[0]);extractPalette()}});
$('extractBtn').addEventListener('click',extractPalette);
</script></body></html>
