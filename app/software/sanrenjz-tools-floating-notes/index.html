<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
:root{--bg:#fef9c3;--fg:#ca8a04;--fg2:#a16207;--card:#fffbeb;--border:#fde047;--input:#fef08a;--text:#422006;--sub:#854d0e;--radius:10px;--shadow:0 2px 8px rgba(202,138,4,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:32px}
input,textarea,select,button{font-family:inherit;font-size:13px;outline:none}
button{cursor:pointer;border:none;border-radius:var(--radius);transition:all .15s}
button:active{transform:scale(.97)}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#input-area{display:flex;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
#input-area input{flex:1;min-width:140px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text)}
#input-area input:focus{border-color:var(--fg);box-shadow:0 0 0 2px rgba(202,138,4,.12)}
#color-pick{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;padding:2px;background:var(--border)}
#input-area button{padding:8px 16px;background:var(--fg);color:#fff;font-weight:600;font-size:12px}
#input-area button:hover{background:var(--fg2)}
#notes-grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-content:start}
#notes-grid::-webkit-scrollbar{width:5px}
#notes-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sticky{position:relative;border-radius:var(--radius);padding:14px;min-height:120px;display:flex;flex-direction:column;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;overflow:hidden;word-break:break-word}
.sticky:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)}
.sticky .title{font-weight:700;font-size:13px;margin-bottom:6px;color:inherit;opacity:.9}
.sticky .body{font-size:12px;line-height:1.55;flex:1;color:inherit;opacity:.75;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sticky .time{font-size:10px;margin-top:8px;opacity:.5;color:inherit}
.sticky .del{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:11px;color:inherit;opacity:0;transition:opacity .15s}
.sticky:hover .del{opacity:1}
.sticky .del:hover{background:rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="app">
  <div id="input-area">
    <input type="text" id="titleInput" placeholder="便签标题">
    <input type="color" id="colorPick" value="#fef9c3">
    <button id="addBtn">添加便签</button>
  </div>
  <div id="notes-grid"></div>
  <textarea id="contentInput" style="padding:12px 16px;border:none;border-top:1px solid var(--border);resize:none;height:120px;background:var(--card);color:var(--text);font-size:13px;line-height:1.6;display:none" placeholder="输入便签内容..."></textarea>
</div>
<script>
const api = window.pluginAPI;
const STORAGE_KEY = 'sticky';
const grid = document.getElementById('notes-grid');
const titleInput = document.getElementById('titleInput');
const contentInput = document.getElementById('contentInput');
const colorPick = document.getElementById('colorPick');
const addBtn = document.getElementById('addBtn');
let notes = [];
let editingId = null;

function getPalette(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const bg = `rgb(${r},${g},${b})`;
  const textColor = (r*0.299+g*0.587+b*0.114)>150 ? '#1c1917' : '#fff';
  return { bg, textColor };
}

function render() {
  if (notes.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--sub);font-size:13px">点击下方输入框创建便签</div>';
    return;
  }
  grid.innerHTML = notes.map(n => {
    const p = getPalette(n.color);
    const time = new Date(n.updatedAt).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="sticky" style="background:${p.bg};color:${p.textColor}" data-id="${n.id}">
      <div class="title">${n.title||'无标题'}</div>
      <div class="body">${n.content||''}</div>
      <div class="time">${time}</div>
      <div class="del" data-action="del">&times;</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.sticky').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.dataset.action === 'del') {
        notes = notes.filter(n => n.id !== el.dataset.id);
        render(); persist();
        return;
      }
      editingId = el.dataset.id;
      const n = notes.find(n => n.id === editingId);
      if (n) { titleInput.value = n.title; contentInput.value = n.content; colorPick.value = n.color; }
      contentInput.style.display = 'block';
      addBtn.textContent = '更新';
      contentInput.focus();
    });
  });
}
async function persist() { await api.storage.set(STORAGE_KEY, notes); }
function addOrUpdate() {
  const color = colorPick.value;
  if (editingId) {
    const n = notes.find(n => n.id === editingId);
    if (n) { n.title = titleInput.value; n.content = contentInput.value; n.color = color; n.updatedAt = Date.now(); }
  } else {
    notes.push({ id: String(Date.now()), title: titleInput.value, content: contentInput.value, color, createdAt: Date.now(), updatedAt: Date.now() });
  }
  editingId = null;
  titleInput.value = ''; contentInput.value = '';
  contentInput.style.display = 'none';
  addBtn.textContent = '添加便签';
  render(); persist();
}
addBtn.addEventListener('click', addOrUpdate);
contentInput.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); addOrUpdate(); }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'n') { e.preventDefault();
    contentInput.style.display = 'block'; contentInput.focus(); editingId = null;
    titleInput.value = ''; contentInput.value = ''; addBtn.textContent = '添加便签';
  }
});
(async () => {
  const data = await api.storage.get(STORAGE_KEY);
  notes = Array.isArray(data) ? data : [];
  render();
})();
</script>
</body>
</html>
