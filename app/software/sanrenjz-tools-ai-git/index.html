<!DOCTYPE html>
<html lang="zh-CN" data-layout="commit-graph">
<head data-business>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Git 助手</title>
<style>
:root{--a:#ea580c;--a2:#f97316;--as:rgba(234,88,12,.1);--al:rgba(234,88,12,.3);--bg:#fdf7f3;--sf:#fff;--s2:#fce8df;--bd:#f0d8c8;--ink:#2d1808;--mt:#7a6354;--ft:#a89080;--ok:#16a34a;--err:#dc2626;--info:#2563eb;--mono:'JetBrains Mono','Fira Code',Consolas,monospace;--sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--sf);border-bottom:1px solid var(--bd);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;flex:none}.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}.head p{margin:0;color:var(--mt);font-size:12px}
.spacer{flex:1}.gear{border:1px solid var(--bd);background:var(--sf);color:var(--a);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}.gear svg{width:14px;height:14px}
.modes{display:flex;gap:6px;padding:10px 24px;background:var(--sf);border-bottom:1px solid var(--bd);flex:none}
.repo-row{display:flex;gap:8px;align-items:center;padding:8px 24px;background:var(--sf);border-bottom:1px solid var(--bd);flex:none}.repo-path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px var(--mono);color:var(--mt)}
.mode{border:1px solid var(--bd);background:var(--sf);color:var(--mt);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.12s;display:flex;align-items:center;gap:6px}.mode svg{width:14px;height:14px}
.mode:hover{border-color:var(--al);color:var(--a)}.mode.active{background:var(--a);color:#fff;border-color:transparent}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 24px;overflow:hidden}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card-h{padding:10px 16px;border-bottom:1px solid var(--bd);font:600 12px var(--sans);color:var(--mt);flex:none;display:flex;justify-content:space-between;align-items:center}
.card-h .cnt{font:11px var(--mono);color:var(--ft)}
.input-area{flex:1;border:0;outline:0;resize:none;padding:14px;font:13px/1.6 var(--mono);background:#2d1808;color:#fde8d0;min-height:0}.input-area::placeholder{color:#8a7050}
.result-area{flex:1;overflow:auto;padding:14px;font:14px/1.7 var(--sans);white-space:pre-wrap;word-break:break-word}
.result-area.empty{display:flex;align-items:center;justify-content:center;color:var(--ft);font-style:italic}
.act-bar{padding:12px 24px;border-top:1px solid var(--bd);background:var(--sf);display:flex;gap:10px;align-items:center;flex:none}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:6px}.btn:hover{border-color:var(--al)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent}.btn.primary:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5}
.drawer{position:fixed;top:32px;right:0;bottom:0;width:min(420px,92vw);background:var(--sf);box-shadow:-12px 0 40px rgba(0,0,0,.1);z-index:50;transform:translateX(100%);transition:.25s;overflow:auto;padding:24px}.drawer.open{transform:translateX(0)}.drawer h2{margin:0 0 16px;font-size:16px}.drawer .close{position:absolute;top:16px;right:16px;border:0;background:transparent;font-size:20px;color:var(--ft);cursor:pointer}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:var(--mt);font-weight:600;margin-bottom:6px}.field input{width:100%;border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font:14px var(--sans);outline:none;background:var(--s2);color:var(--ink)}.field input:focus{border-color:var(--al)}
.overlay{position:fixed;inset:32px 0 0 0;background:rgba(0,0,0,.3);z-index:40;display:none}.overlay.show{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d1808;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#e0cdb8;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="12" r="3"/><path d="M8 6h4a2 2 0 0 1 2 2v2M8 18h4a2 2 0 0 0 2-2v-2"/></svg></div>
    <div><h1>AI Git 助手</h1><p>读取本地 Diff/Log，生成提交说明、变更日志和 Release Notes</p></div>
    <div class="spacer"></div>
    <button class="gear" onclick="toggleDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 1-.1 1.2l2 1.5-2 3.4-2.3-1a7 7 0 0 1-2 1.2l-.4 2.5H9l-.4-2.5a7 7 0 0 1-2-1.2l-2.3 1-2-3.4 2-1.5A7 7 0 0 1 4 12a7 7 0 0 1 .1-1.2l-2-1.5 2-3.4 2.3 1a7 7 0 0 1 2-1.2L9 1h4l.4 2.5a7 7 0 0 1 2 1.2l2.3-1 2 3.4-2 1.5A7 7 0 0 1 19 12z"/></svg>供应商设置</button>
  </div>
  <div class="modes">
    <button class="mode active" data-mode="提交说明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h12"/></svg>提交说明</button>
    <button class="mode" data-mode="变更日志"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M8 12h8M8 16h5"/></svg>变更日志</button>
    <button class="mode" data-mode="Release Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>Release Notes</button>
  </div>
  <div class="repo-row"><button class="btn" id="repoPick">选择仓库</button><span class="repo-path" id="repoPath">未选择本地 Git 仓库</span><button class="btn" id="repoRead">读取 Diff / Log</button></div>
  <div class="body">
    <div class="card"><div class="card-h">Git Diff / Log 输入 <span class="cnt" id="inCnt">0 行</span></div><textarea class="input-area" id="input" spellcheck="false" placeholder="粘贴 git diff 或 git log 的输出…&#10;&#10;例如：&#10;diff --git a/file.js b/file.js&#10;+ const x = 1;&#10;- var x = 1;"></textarea></div>
    <div class="card"><div class="card-h">生成结果 <span class="cnt" id="resStat">等待</span></div><div class="result-area empty" id="result">结果将显示在这里</div></div>
  </div>
  <div class="act-bar">
    <button class="btn primary" id="genBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span id="genLabel">生成提交说明</span></button>
    <button class="btn" id="stopBtn" disabled>取消</button>
    <div class="spacer"></div>
    <button class="btn" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制</button>
  </div>
</main>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<aside class="drawer" id="drawer"><button class="close" onclick="toggleDrawer()">×</button><h2>统一供应商配置</h2>
  <div class="field"><label>服务名称</label><input id="pName" value="OpenAI 兼容服务"></div>
  <div class="field"><label>Base URL</label><input id="pUrl" value="https://api.openai.com/v1"></div>
  <div class="field"><label>模型 ID</label><input id="pModel" value="gpt-4o-mini"></div>
  <div class="field"><label>API Key</label><input id="pKey" type="password" placeholder="仅保存到系统安全存储"></div>
  <button class="btn primary" style="width:100%;justify-content:center" onclick="saveProvider()">保存并共享</button>
</aside>
<div class="toast" id="toast"></div>
<script src="../../plugin_runtime/ai-provider-manager.js"></script>
<script>
const api=window.aiAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let mode='提交说明';let requestId='';let repoDir='';
const providerManager=AIProviderManager.create(api,{capability:'text',notify:toast});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function toggleDrawer(){$('#drawer').classList.toggle('open');$('#overlay').classList.toggle('show');}
$$('#modes .mode').forEach(b=>b.onclick=()=>{$$('#modes .mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('#genLabel').textContent='生成'+mode;});
$('#input').addEventListener('input',()=>$('#inCnt').textContent=$('#input').value.split('\n').length+' 行');
$('#repoPick').onclick=()=>{repoDir=api.pickDirectory();if(repoDir)$('#repoPath').textContent=repoDir;};
$('#repoRead').onclick=async()=>{if(!repoDir){toast('请先选择仓库');return;}try{let chunks=[];const status=await api.readGit(repoDir,['status','--short']);if(status.trim())chunks.push('## Status\n'+status);if(mode==='提交说明'){try{const diff=await api.readGit(repoDir,['diff','HEAD']);if(diff.trim())chunks.push('## Diff\n'+diff);}catch(_){const staged=await api.readGit(repoDir,['diff','--cached']);if(staged.trim())chunks.push('## Staged Diff\n'+staged);}}else{const log=await api.readGit(repoDir,['log','--oneline','-30']);if(log.trim())chunks.push('## Log\n'+log);}const text=chunks.join('\n\n');$('#input').value=text;$('#inCnt').textContent=(text?text.split('\n').length:0)+' 行';if(!text.trim())toast('未读取到变更');}catch(error){toast('读取失败：'+error.message);}};
api.onChunk(chunk=>{if(chunk.requestId===requestId){$('#result').classList.remove('empty');$('#result').textContent=chunk.text;}});
$('#genBtn').onclick=async()=>{
  const input=$('#input').value.trim();if(!input){toast('请输入 Diff/Log');return;}
  requestId=crypto.randomUUID();$('#genBtn').disabled=true;$('#stopBtn').disabled=false;$('#resStat').textContent='生成中…';
  $('#result').classList.remove('empty');$('#result').textContent='';
  const prompts={'提交说明':'请根据以下 Git Diff 生成规范的提交说明（Conventional Commits 格式），包含标题和正文：\n\n','变更日志':'请根据以下 Git Log 生成变更日志（CHANGELOG），按功能分类：\n\n','Release Notes':'请根据以下 Git Log/Diff 生成 Release Notes，包含新功能、改进、修复和破坏性变更：\n\n'};
  try{const r=await api.complete({requestId,capability:'text',selection:await providerManager.getSelection(),stream:true,messages:[{role:'user',content:prompts[mode]+input}]});$('#result').textContent=r.text;$('#resStat').textContent='已完成';}
  catch(e){$('#result').textContent=e.message;$('#resStat').textContent=e.message==='请求已取消'?'已取消':'失败';}
  finally{$('#genBtn').disabled=false;$('#stopBtn').disabled=true;}
};
$('#stopBtn').onclick=()=>{if(requestId){api.cancel(requestId);$('#genBtn').disabled=false;$('#stopBtn').disabled=true;$('#resStat').textContent='已取消';}};
$('#copyBtn').onclick=()=>{const t=$('#result').textContent;if(t&&t!=='结果将显示在这里'){navigator.clipboard.writeText(t);toast('已复制');}else toast('暂无结果');};
window.addEventListener('plugin-enter',e=>{const text=e.detail?.payload||e.detail?.clipboardText||'';if(text){$('#input').value=text;$('#inCnt').textContent=text.split('\n').length+' 行';}});
// 总指挥模式：收到 featureArgs.autoRun 时自动开始生成
window.addEventListener('plugin-enter',e=>{const text=e.detail?.payload||e.detail?.clipboardText||'';if(e.detail?.featureArgs?.autoRun&&text)setTimeout(()=>{const b=$('#genBtn');if(b&&!b.disabled)b.click()},150);});
</script>
</body></html>
