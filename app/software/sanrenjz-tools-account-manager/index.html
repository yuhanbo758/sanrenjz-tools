<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SQLite 数据表管理器</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#18212f;--muted:#718096;--line:#dce4ee;--nav:#102a43;--nav2:#163a5f;--accent:#0f9d8a;--accent2:#0b7e70;--danger:#d64545;--shadow:0 10px 30px rgba(15,42,67,.1)}
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:260px minmax(0,1fr)}
    .sidebar{background:linear-gradient(165deg,var(--nav),var(--nav2));color:#e8f1f8;padding:22px 16px 16px;display:flex;flex-direction:column;min-height:0}
    .brand{padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand h1{font-size:20px;margin:0 0 5px}.brand p{margin:0;color:#a9c1d7;font-size:12px}
    .db-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 0}.side-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:9px 8px}.side-btn:hover{background:rgba(255,255,255,.15)}
    .db-path{padding:10px 11px;background:rgba(4,21,36,.28);border-radius:9px;color:#bcd0e1;font-size:12px;word-break:break-all;max-height:68px;overflow:auto}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 6px 8px;color:#bcd0e1;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .icon-btn{border:0;background:transparent;color:inherit;font-size:18px;padding:0 5px}.table-list{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px}.table-item{border:0;border-left:3px solid transparent;background:transparent;color:#dce9f3;text-align:left;border-radius:7px;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table-item:hover{background:rgba(255,255,255,.08)}.table-item.active{background:rgba(15,157,138,.2);border-left-color:#42d6c0;color:#fff}
    .main{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:22px 24px 16px;gap:14px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.title h2{font-size:24px;margin:0 0 3px}.title p{margin:0;color:var(--muted)}.primary{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600}.primary:hover{background:var(--accent2)}.primary:disabled{opacity:.5;cursor:not-allowed}
    .toolbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(150px,220px) 120px minmax(180px,1fr) auto auto;gap:9px;box-shadow:var(--shadow)}input,select,textarea{border:1px solid #cfd9e5;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,157,138,.12)}.secondary{border:1px solid #cfd9e5;background:#fff;border-radius:8px;padding:8px 13px;color:#334e68}.secondary:hover{border-color:#9fb3c8;background:#f8fafc}
    .grid-card{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-rows:minmax(0,1fr)}.table-scroll{overflow:auto;position:relative}table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content}th,td{padding:10px 13px;border-right:1px solid #e8edf3;border-bottom:1px solid #e8edf3;text-align:left;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;background:#edf4f8;color:#334e68;font-size:12px;font-weight:700}tbody tr:hover td{background:#f2fbf9}td.sensitive{letter-spacing:.12em;color:#52667a}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.empty strong{display:block;color:#334e68;font-size:17px;margin-bottom:5px}
    .footer{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.pager{display:flex;align-items:center;gap:8px}.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px}.pager button:disabled{opacity:.45}.status.error{color:var(--danger)}
    .drawer-backdrop,.modal-backdrop{position:fixed;inset:32px 0 0;background:rgba(8,24,38,.34);z-index:20;opacity:0;pointer-events:none;transition:.2s}.drawer-backdrop.open,.modal-backdrop.open{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(430px,92vw);background:#fff;box-shadow:-18px 0 40px rgba(16,42,67,.18);transform:translateX(100%);transition:.24s;display:flex;flex-direction:column}.open .drawer{transform:none}.drawer-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.drawer-head h3{margin:0;font-size:19px}.drawer-body{padding:18px 22px;overflow:auto;flex:1}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:600}.field small{color:var(--muted)}.field textarea{min-height:78px;resize:vertical}.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
    .modal-backdrop{display:grid;place-items:center}.modal{width:min(680px,92vw);max-height:82vh;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(8,24,38,.25);display:flex;flex-direction:column}.modal-head,.modal-foot{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:18px 20px;overflow:auto}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:9px}.column-editor{display:grid;grid-template-columns:minmax(130px,1fr) 110px auto auto 34px;gap:8px;align-items:center;margin:8px 0}.danger-link{border:0;background:transparent;color:var(--danger);font-size:18px}
    @media(max-width:980px){.app{grid-template-columns:220px minmax(0,1fr)}.main{padding:16px}.toolbar{grid-template-columns:1fr 110px;}.toolbar #searchText{grid-column:1/-1}.toolbar button{min-width:0}}
  </style>
</head>
<body data-layout="sqlite-schema-navigator">
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><h1>数据表管理器</h1><p>SQLite · 动态结构 · 本机读写</p></div>
      <div class="db-actions"><button class="side-btn" id="openDb">打开数据库</button><button class="side-btn" id="newDb">新建数据库</button></div>
      <div class="db-path" id="dbPath">尚未选择数据库</div>
      <div class="section-title"><span>数据表</span><button class="icon-btn" id="refreshTables" title="刷新数据表">↻</button></div>
      <div class="table-list" id="tableList"></div>
      <button class="side-btn" id="createTable" disabled>＋ 新建数据表</button>
    </aside>
    <main class="main">
      <header class="topbar"><div class="title"><h2 id="tableTitle">选择一个数据库</h2><p id="tableMeta">打开已有 SQLite 文件，或创建一个新数据库</p></div><button class="primary" id="addRow" disabled>＋ 新增记录</button></header>
      <section class="toolbar">
        <select id="searchColumn" disabled><option value="__all__">整表（全部列）</option></select>
        <select id="searchMode" disabled><option value="contains">包含</option><option value="equals">精确匹配</option></select>
        <input id="searchText" placeholder="在全部列中模糊查找" disabled>
        <button class="secondary" id="searchButton" disabled>查询</button>
        <button class="secondary" id="clearSearch" disabled>清除</button>
      </section>
      <section class="grid-card"><div class="table-scroll"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table><div class="empty" id="empty"><div><strong>等待打开数据库</strong><span>列名将根据所选数据表自动变化</span></div></div></div></section>
      <footer class="footer"><span class="status" id="status">就绪</span><div class="pager"><button id="prevPage" disabled>上一页</button><span id="pageInfo">第 0 / 0 页</span><button id="nextPage" disabled>下一页</button></div></footer>
    </main>
  </div>

  <div class="drawer-backdrop" id="rowDrawer"><section class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><div><h3>新增记录</h3><small id="drawerTable"></small></div><button class="icon-btn" data-close-drawer>×</button></div><form id="rowForm" class="drawer-body"></form><div class="drawer-foot"><button class="secondary" data-close-drawer>取消</button><button class="primary" id="saveRow">写入数据</button></div></section></div>

  <div class="modal-backdrop" id="tableModal"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>新建数据表</h3><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body"><div class="field"><label for="newTableName">数据表名称</label><input id="newTableName" placeholder="例如 customer_accounts"></div><div class="section-title" style="color:#52667a;margin:18px 0 5px"><span>字段定义</span><button class="secondary" id="addColumn">＋ 添加字段</button></div><div id="columnEditor"></div></div><div class="modal-foot"><button class="secondary" data-close-modal>取消</button><button class="primary" id="saveTable">创建数据表</button></div></section></div>
  <script src="app.js"></script>
</body>
</html>
