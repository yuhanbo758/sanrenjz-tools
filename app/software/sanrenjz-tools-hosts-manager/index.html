<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hosts 配置管家</title>
<style>
:root{--bg:#0f1929;--panel:#152238;--text:#dbeafe;--muted:#5b7a9e;--border:#1e3a5f;--accent:#3b82f6;--warn:#f59e0b;--danger:#ef4444;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.custom-title-bar{background:var(--bg)!important;border-bottom:1px solid var(--border)!important}
.info-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0;font-size:11px}
.info-bar .path{flex:1;min-width:0;font-family:monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.info-bar .badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.info-bar .badge.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.info-bar .badge.ok{background:color-mix(in srgb,#22c55e 15%,transparent);color:#22c55e}
.editor-area{flex:1;display:flex;flex-direction:column;min-height:0;padding:0}
.editor-area textarea{flex:1;width:100%;min-height:0;padding:14px 16px;border:none;background:var(--bg);color:var(--text);font-family:"Cascadia Code","Fira Code","Consolas",monospace;font-size:12px;line-height:1.7;resize:none;outline:none;tab-size:4}
.editor-area textarea::-webkit-scrollbar{width:5px}
.editor-area textarea::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.editor-area textarea::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.actions{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0}
.actions button{padding:8px 18px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.actions button.save{background:var(--accent);color:#fff}
.actions button.save:hover{filter:brightness(1.15)}
.actions button.reload{background:transparent;border:1px solid var(--border);color:var(--text)}
.actions button.reload:hover{border-color:var(--accent)}
.actions .hint{flex:1;font-size:10px;color:var(--muted);text-align:right}
.actions .backup-indicator{font-size:10px;color:var(--accent);font-family:monospace}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 16px;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;z-index:99;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast.error{background:var(--danger)}
</style>
</head>
<body>
<div class="info-bar">
  <span class="badge ok" id="editBadge">编辑模式</span>
  <span class="path" id="hostsPath">--</span>
  <span class="badge warn" id="permBadge" style="display:none">需要管理员权限</span>
</div>
<div class="editor-area">
  <textarea id="editor" spellcheck="false" placeholder="加载中..."></textarea>
</div>
<div class="actions">
  <button class="save" id="saveBtn">保存</button>
  <button class="reload" id="reloadBtn">重新加载</button>
  <span class="backup-indicator" id="backupInfo"></span>
  <span class="hint">修改前自动备份，Ctrl+S 保存</span>
</div>
<div class="toast" id="toast"></div>
<script>
const api = window.pluginAPI;
const editor = document.getElementById('editor');
const saveBtn = document.getElementById('saveBtn');
const reloadBtn = document.getElementById('reloadBtn');
const hostsPath = document.getElementById('hostsPath');
const backupInfo = document.getElementById('backupInfo');
const permBadge = document.getElementById('permBadge');

let originalContent = '';

function showToast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (isError ? 'error' : '') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2000);
}

async function loadHosts() {
  try {
    const res = await api.runTask({ input: '', options: {}, execute: false });
    if (!res.ok) { editor.value = '加载失败: ' + res.error; return; }
    hostsPath.textContent = res.result.hostsPath || '';
    originalContent = res.result.content || '';
    editor.value = originalContent;
    backupInfo.textContent = '';
  } catch (e) {
    editor.value = '加载失败: ' + e.message;
  }
}

saveBtn.addEventListener('click', async () => {
  const content = editor.value;
  if (content === originalContent) { showToast('内容未变更'); return; }
  try {
    const res = await api.runTask({ input: content, options: {}, execute: true });
    if (!res.ok) {
      showToast(res.error, true);
      permBadge.style.display = 'inline';
      return;
    }
    originalContent = content;
    backupInfo.textContent = '备份: ' + (res.result.backup || '').split(/[/\\]/).pop();
    showToast('已保存');
    permBadge.style.display = 'none';
  } catch (e) {
    showToast('保存失败: ' + e.message, true);
    permBadge.style.display = 'inline';
  }
});

reloadBtn.addEventListener('click', loadHosts);

editor.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    saveBtn.click();
  }
});

loadHosts();
</script>
</body>
</html>
