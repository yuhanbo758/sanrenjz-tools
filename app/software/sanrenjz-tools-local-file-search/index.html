<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地文件快搜</title>
<style>
:root{--bg:#0c1929;--panel:#112240;--text:#e2e8f0;--muted:#64748b;--border:#1e3a5f;--accent:#38bdf8;--accent-glow:#38bdf833;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.custom-title-bar{background:var(--bg)!important;border-bottom:1px solid var(--border)!important}
.hero{display:flex;flex-direction:column;align-items:center;padding:28px 20px 20px;gap:12px;flex-shrink:0;border-bottom:1px solid var(--border)}
.hero img{width:48px;height:48px;border-radius:12px;margin-bottom:4px}
.hero h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.search-wrap{width:100%;max-width:560px;display:flex;gap:8px}
.search-wrap input{flex:1;min-width:0;padding:10px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap button{padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#0c1929;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
.search-wrap button:hover{filter:brightness(1.1)}
.search-wrap button:active{transform:scale(.97)}
.everything-badge{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.everything-badge.off{background:color-mix(in srgb,#ef4444 15%,transparent);color:#ef4444}
.everything-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.results-header{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;font-size:11px;color:var(--muted);flex-shrink:0}
.results-scroll{flex:1;overflow-y:auto;min-height:0;padding:0 12px 8px}
.results-scroll::-webkit-scrollbar{width:5px}
.results-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s;font-size:12px}
.file-row:hover{background:var(--panel)}
.file-row .icon{width:28px;height:28px;flex-shrink:0;border-radius:5px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent)}
.file-row .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Cascadia Code","Fira Code","Consolas",monospace;font-size:11px;color:var(--text)}
.file-row .source-tag{font-size:10px;padding:2px 6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);white-space:nowrap;flex-shrink:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px;color:var(--muted)}
.empty strong{font-size:15px;color:var(--text)}
</style>
</head>
<body>
<div class="hero">
  <img src="logo.svg" alt="" onerror="this.style.display='none'">
  <h1>本地文件快搜</h1>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="输入文件名关键字..." autofocus>
    <button id="searchBtn">搜索</button>
  </div>
  <div class="everything-badge" id="everythingBadge">
    <span class="dot"></span>
    <span id="everythingLabel">检测 Everything 中...</span>
  </div>
</div>
<div class="results-header">
  <span id="resultCount"></span>
  <span id="searchEngine"></span>
</div>
<div class="results-scroll" id="results">
  <div class="empty">
    <strong>输入关键字开始搜索</strong>
    <span>Windows 优先接入 Everything 引擎</span>
  </div>
</div>
<script>
const api = window.pluginAPI;
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const results = document.getElementById('results');
const resultCount = document.getElementById('resultCount');
const searchEngine = document.getElementById('searchEngine');
const everythingBadge = document.getElementById('everythingBadge');
const everythingLabel = document.getElementById('everythingLabel');

let everythingAvailable = false;

async function checkEverything() {
  try {
    const res = await api.runTask({ input: '', options: { query: 'everything_check_test_xyz' }, execute: false });
    if (res.ok && res.result && res.result.length >= 0) {
      everythingAvailable = true;
    }
  } catch (_) {}
  if (everythingAvailable) {
    everythingBadge.classList.remove('off');
    everythingLabel.textContent = 'Everything 引擎已就绪';
  } else {
    everythingBadge.classList.add('off');
    everythingLabel.textContent = 'Everything 未安装，使用目录扫描';
  }
}

async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  resultCount.textContent = '搜索中...';
  searchEngine.textContent = '';
  try {
    const res = await api.runTask({ input: '', options: { query: q }, execute: false });
    if (!res.ok) {
      results.innerHTML = `<div class="empty"><strong>搜索出错</strong><span>${res.error}</span></div>`;
      resultCount.textContent = '';
      return;
    }
    const files = Array.isArray(res.result) ? res.result : [];
    resultCount.textContent = `找到 ${files.length} 个文件`;
    const source = files.length > 0 && files[0].source ? files[0].source : '目录扫描';
    searchEngine.textContent = source;
    if (!files.length) {
      results.innerHTML = `<div class="empty"><strong>未找到匹配文件</strong><span>尝试其他关键字</span></div>`;
      return;
    }
    let html = '';
    files.forEach(f => {
      const p = f.path || f.relativePath || '';
      const name = p.split(/[/\\]/).pop() || p;
      html += `<div class="file-row" onclick="api.showPath('${p.replace(/'/g, "\\'")}')" title="${p}">
        <div class="icon">&#x1F4C4;</div>
        <div class="path">${p}</div>
        <div class="source-tag">${f.source || '本地'}</div>
      </div>`;
    });
    results.innerHTML = html;
  } catch (e) {
    results.innerHTML = `<div class="empty"><strong>搜索失败</strong><span>${e.message}</span></div>`;
    resultCount.textContent = '';
  }
}

searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

checkEverything();
</script>
</body>
</html>
