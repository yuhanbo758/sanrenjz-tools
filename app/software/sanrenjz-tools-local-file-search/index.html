<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三人聚智插件</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <span id="category" class="eyebrow">本地效率工具</span>
        <h1 id="title">插件加载中</h1>
        <p id="description">所有处理默认在本机完成。</p>
      </div>
      <div class="hero-actions">
        <button id="pinButton" class="secondary">置顶</button>
        <button id="copyButton" class="secondary">复制结果</button>
      </div>
    </header>

    <section id="status" class="status" aria-live="polite">准备就绪</section>

    <section class="workspace">
      <aside id="controls" class="panel controls"></aside>
      <div class="panel editor-panel">
        <label for="inputText">输入 / 数据</label>
        <textarea id="inputText" spellcheck="false" placeholder="输入内容，或通过左侧按钮选择本地文件……"></textarea>
        <div class="action-row">
          <button id="runButton" class="primary">开始处理</button>
          <button id="previewButton" class="secondary">预览</button>
          <button id="clearButton" class="ghost">清空</button>
        </div>
      </div>
      <div class="panel result-panel">
        <label for="outputText">结果 / 预览</label>
        <pre id="outputText" tabindex="0">尚未生成结果</pre>
        <canvas id="previewCanvas" hidden></canvas>
        <div id="cards" class="cards" hidden></div>
        <div class="action-row">
          <button id="saveButton" class="secondary">保存结果</button>
          <button id="exportButton" class="ghost">导出数据</button>
        </div>
      </div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
