<!DOCTYPE html>
<html lang="zh-CN" data-layout="sheet-grid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV 数据表</title>
<style>
:root{--accent:#0f9d8a;--bg:#f5f8f6;--surface:#fff;--soft:#edf7f4;--border:#dce8e3;--ink:#20342f;--muted:#607670;--danger:#b64b48;--mono:Consolas,monospace;--sans:"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{height:72px;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.brand{display:flex;align-items:center;gap:12px;min-width:260px}
.brand-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:white;font-size:21px}
h1{font-size:17px;margin:0}
.sub{font-size:11px;color:var(--muted);margin:0}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--accent);background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.workspace{display:grid;grid-template-columns:minmax(270px,320px) minmax(0,1fr);flex:1;min-height:0}
.sidebar{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--border)}
.section{padding:12px 14px;border-bottom:1px solid var(--border)}
.section-title{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.hint{color:var(--muted);font-size:11px}
.dropzone{border:1.5px dashed #8ac9b8;background:#f7fcfa;border-radius:10px;text-align:center;padding:12px 8px;outline:0}
.dropzone.active,.dropzone:focus{border-color:var(--accent);background:var(--soft)}
.dropzone strong{display:block;font-size:13px}
.file-line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px;margin-top:5px}
.inline{display:flex;gap:7px;align-items:center}
.inline>*{min-width:0}
.inline .btn{flex:1}
.field{display:flex;align-items:center;gap:8px;margin-top:8px}
.field label{width:56px;color:var(--muted);flex:none}
.field select{flex:1;min-width:0}
select,input[type=search]{height:34px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:1px solid var(--accent)}
.source-label{padding:9px 14px 4px;font-weight:600}
textarea{flex:1;min-height:80px;border:0;resize:none;padding:9px 14px;background:#fff;color:var(--ink);font:12px/1.5 var(--mono)}
.sidebar-bottom{padding:10px 14px;border-top:1px solid var(--border)}
.sidebar-bottom .btn{width:100%}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border)}
.toolbar input{width:min(310px,42%)}
.toolbar .mini{width:92px}
.quality{padding:6px 14px;background:#fff;border-bottom:1px solid var(--border);color:var(--muted);font-size:11px;min-height:30px}
.quality.warn{color:var(--danger);background:#fff7f5}
.table-wrap{flex:1;min-height:0;overflow:auto;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th,td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--soft);z-index:2;cursor:pointer;user-select:none}
th:hover{background:#d8f1e9}
td.numeric{text-align:right;font-family:var(--mono)}
tbody tr:nth-child(even){background:#f9fbfa}
.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted);gap:6px}
.empty strong{color:var(--ink);font-size:16px}
.footer{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--border);background:#fff;color:var(--muted);font-size:11px;flex:none}
.footer .btn{min-height:28px;padding:3px 8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);background:#20342f;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.head{padding:8px 12px}.brand{min-width:195px}.sub{display:none}.workspace{grid-template-columns:270px minmax(0,1fr)}.toolbar{gap:5px}.toolbar input{width:190px}.btn{padding:6px 9px}}
</style>
</head>
<body>
<main class="app">
 <header class="head">
  <div class="brand"><span class="brand-icon" aria-hidden="true">▦</span><div><h1>CSV 数据表</h1><p class="sub">导入、检查、筛选与导出表格</p></div></div>
  <div class="spacer"></div>
  <button class="btn" id="pasteBtn">粘贴</button>
  <button class="btn" id="clearBtn">清空</button>
  <button class="btn primary" id="parseBtn">解析表格</button>
 </header>
 <div class="workspace">
  <aside class="sidebar">
   <div class="section">
    <div class="section-title"><span>导入文件</span><span class="hint">CSV / TSV / TXT / JSON</span></div>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入表格文件">
     <strong>拖入文件到这里</strong><span class="hint">也可以点击选择文件，最大 10 MB</span>
     <div class="file-line" id="fileName">尚未选择文件</div>
    </div>
    <input id="fileInput" type="file" accept=".csv,.tsv,.txt,.json,text/csv,text/tab-separated-values,application/json" hidden>
    <div class="field"><label for="encoding">编码</label><select id="encoding"><option value="utf-8">UTF-8</option><option value="gb18030">GB18030 / GBK</option></select></div>
    <div class="field"><label for="delimiter">分隔符</label><select id="delimiter"><option value="auto">自动识别</option><option value=",">逗号 ,</option><option value="tab">制表符 Tab</option><option value=";">分号 ;</option><option value="|">竖线 |</option></select></div>
   </div>
   <div class="source-label">源数据 <span class="hint">可直接编辑后重新解析</span></div>
   <textarea id="csvInput" spellcheck="false" placeholder="姓名,年龄,城市&#10;张三,28,北京&#10;李四,34,上海"></textarea>
   <div class="sidebar-bottom"><button class="btn primary" id="sideParseBtn">解析并预览</button></div>
  </aside>
  <section class="main">
   <div class="toolbar">
    <input type="search" id="searchInput" placeholder="搜索所有列" aria-label="搜索所有列">
    <select id="pageSize" class="mini" aria-label="每页行数"><option value="50">每页 50 行</option><option value="100">每页 100 行</option><option value="200">每页 200 行</option></select>
    <span class="spacer"></span>
    <button class="btn" id="copyBtn">复制结果</button>
    <button class="btn" id="csvBtn">导出 CSV</button>
    <button class="btn" id="jsonBtn">导出 JSON</button>
   </div>
   <div class="quality" id="quality">导入文件或粘贴数据后点击“解析表格”</div>
   <div class="table-wrap" id="tableWrap"><div class="empty"><strong>开始处理表格</strong><span>选择文件、拖入文件，或粘贴 CSV 数据</span></div></div>
   <footer class="footer"><span id="stats">0 行 · 0 列</span><span class="spacer"></span><button class="btn" id="prevBtn">上一页</button><span id="pageInfo">第 0 / 0 页</span><button class="btn" id="nextBtn">下一页</button></footer>
  </section>
 </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="csv-core.js"></script>
<script>
const api=window.pluginAPI, core=window.CsvCore, $=selector=>document.querySelector(selector);
const state={rows:[],sortColumn:null,sortDirection:1,page:1,file:null,fileType:'csv',delimiter:',',ready:false};
const MAX_SIZE=10*1024*1024;
function toast(message){const node=$('#toast');node.textContent=message;node.classList.add('show');clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.remove('show'),2200);}
function selectedDelimiter(){const selected=$('#delimiter').value;return selected==='tab'?'\t':selected==='auto'?core.detectDelimiter($('#csvInput').value):selected;}
function chooseFile(){ $('#fileInput').click(); }
$('#dropzone').onclick=chooseFile;
$('#dropzone').onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseFile();}};
$('#fileInput').onchange=event=>{if(event.target.files[0])importFile(event.target.files[0]);event.target.value='';};
for(const eventName of ['dragenter','dragover'])document.addEventListener(eventName,event=>{event.preventDefault();$('#dropzone').classList.add('active');});
for(const eventName of ['dragleave','drop'])document.addEventListener(eventName,event=>{event.preventDefault();if(eventName==='drop')$('#dropzone').classList.remove('active');});
document.addEventListener('drop',event=>{const file=event.dataTransfer?.files?.[0];if(file)importFile(file);});
async function importFile(file){
 const ext=(file.name.match(/\.([^.]+)$/)?.[1]||'').toLowerCase();
 if(!['csv','tsv','txt','json'].includes(ext)){toast('仅支持 CSV、TSV、TXT 和 JSON 文件');return;}
 if(file.size>MAX_SIZE){toast('文件不能超过 10 MB');return;}
 try{
  const bytes=await file.arrayBuffer();const decoder=new TextDecoder($('#encoding').value,{fatal:true});
  const text=decoder.decode(bytes);state.file=file;state.fileType=ext;
  $('#fileName').textContent=`${file.name} · ${(file.size/1024).toFixed(1)} KB`;
  $('#csvInput').value=text;
  $('#searchInput').value='';
  if(ext==='tsv')$('#delimiter').value='tab';
  else if(ext!=='json')$('#delimiter').value='auto';
  parseTable();
 }catch(error){toast('读取失败：'+error.message);}
}
$('#encoding').onchange=()=>{if(state.file)importFile(state.file);};
$('#pasteBtn').onclick=()=>{const text=api.readClipboardText();if(!text){toast('剪贴板没有文本');return;}state.file=null;state.fileType='csv';$('#fileName').textContent='来自剪贴板';$('#csvInput').value=text;parseTable();};
$('#clearBtn').onclick=()=>{state.rows=[];state.ready=false;state.file=null;state.fileType='csv';state.sortColumn=null;$('#csvInput').value='';$('#searchInput').value='';$('#fileName').textContent='尚未选择文件';$('#quality').textContent='导入文件或粘贴数据后点击“解析表格”';render();};
$('#csvInput').oninput=()=>{state.ready=false;$('#quality').textContent='源数据已更改，请重新解析';$('#quality').classList.remove('warn');render();};
$('#parseBtn').onclick=parseTable;$('#sideParseBtn').onclick=parseTable;$('#delimiter').onchange=()=>{if($('#csvInput').value.trim())parseTable();};
$('#searchInput').oninput=()=>{state.page=1;render();};$('#pageSize').onchange=()=>{state.page=1;render();};
$('#prevBtn').onclick=()=>{state.page--;render();};$('#nextBtn').onclick=()=>{state.page++;render();};
function parseTable(){
 const text=$('#csvInput').value;if(!text.trim()){toast('请先导入或输入数据');return;}
 try{
  const json=state.fileType==='json';
  const delimiter=json?',':selectedDelimiter();
  const rows=json?core.fromJson(text):core.parse(text,delimiter);
  const report=core.inspect(rows);
  state.rows=rows;state.delimiter=delimiter;state.ready=true;state.page=1;state.sortColumn=null;
  const issues=[];
  if(report.irregularRows)issues.push(`${report.irregularRows} 行列数与表头不一致`);
  if(report.blankHeaders)issues.push(`${report.blankHeaders} 个空表头`);
  if(report.duplicateHeaders)issues.push(`${report.duplicateHeaders} 个重复表头`);
  const quality=$('#quality');quality.textContent=issues.length?'数据检查：'+issues.join('；'):'数据检查通过 · '+(json?'JSON 输入':`分隔符：${delimiter==='\t'?'Tab':delimiter}`);
  quality.classList.toggle('warn',issues.length>0);
  render();
 }catch(error){state.ready=false;state.rows=[];$('#quality').textContent='解析失败：'+error.message;$('#quality').classList.add('warn');render();toast(error.message);}
}
function currentRows(){return core.view(state.rows,$('#searchInput').value,state.sortColumn,state.sortDirection);}
function render(){
 const wrap=$('#tableWrap');wrap.replaceChildren();
 if(!state.ready){wrap.innerHTML='<div class="empty"><strong>等待解析</strong><span>选择文件、拖入文件，或粘贴 CSV 数据</span></div>';$('#stats').textContent='0 行 · 0 列';$('#pageInfo').textContent='第 0 / 0 页';$('#prevBtn').disabled=$('#nextBtn').disabled=true;return;}
 const rows=currentRows(),headers=rows[0],total=rows.length-1,size=Number($('#pageSize').value),pages=Math.max(1,Math.ceil(total/size));
 state.page=Math.min(Math.max(1,state.page),pages);
 const table=document.createElement('table');table.className='csv';
 const thead=document.createElement('thead'),headerRow=document.createElement('tr');
 headers.forEach((header,index)=>{const th=document.createElement('th');th.textContent=header||`第 ${index+1} 列`;th.title='点击排序：'+(header||`第 ${index+1} 列`);
  if(state.sortColumn===index)th.textContent+=state.sortDirection===1?' ▲':' ▼';
  th.onclick=()=>{state.sortDirection=state.sortColumn===index?-state.sortDirection:1;state.sortColumn=index;state.page=1;render();};headerRow.append(th);});
 thead.append(headerRow);table.append(thead);
 const tbody=document.createElement('tbody');
 rows.slice(1+(state.page-1)*size,1+state.page*size).forEach(row=>{const tr=document.createElement('tr');headers.forEach((_,index)=>{const td=document.createElement('td'),value=row[index]??'';td.textContent=value;td.title=value;if(/^-?\d+(\.\d+)?$/.test(value.trim()))td.className='numeric';tr.append(td);});tbody.append(tr);});
 table.append(tbody);wrap.append(table);
 if(!total){const empty=document.createElement('div');empty.className='empty';empty.style.height='160px';empty.textContent='没有符合搜索条件的行';wrap.append(empty);}
 $('#stats').textContent=`${total} / ${state.rows.length-1} 行 · ${headers.length} 列`;
 $('#pageInfo').textContent=`第 ${state.page} / ${pages} 页`;
 $('#prevBtn').disabled=state.page<=1;$('#nextBtn').disabled=state.page>=pages;
}
function output(format){
 if(!state.ready){toast('请先解析表格');return null;}
 try{return format==='json'?core.toJson(currentRows()):core.toCsv(currentRows(),state.delimiter);}
 catch(error){toast(error.message);return null;}
}
$('#copyBtn').onclick=()=>{const text=output('csv');if(text===null)return;api.copyText(text);toast('已复制当前筛选和排序结果');};
function save(format){
 const text=output(format);if(text===null)return;
 try{
  const ext=format==='json'?'json':state.delimiter==='\t'?'tsv':'csv';
  const name=(state.file?.name||'csv-result').replace(/\.[^.]+$/,'')+'-processed.'+ext;
  const result=api.saveResult({title:'导出'+ext.toUpperCase(),defaultPath:name,filters:[{name:ext.toUpperCase(),extensions:[ext]}],text:format==='csv'?'\uFEFF'+text:text});
  if(!result.cancelled)toast('已保存：'+result.path);
 }catch(error){toast('保存失败：'+error.message);}
}
$('#csvBtn').onclick=()=>save('csv');$('#jsonBtn').onclick=()=>save('json');
window.addEventListener('plugin-enter',event=>{const action=event.detail?.action||event.detail||{};const text=action.payload||action.clipboardText||'';if(text){state.file=null;state.fileType='csv';$('#csvInput').value=text;$('#fileName').textContent='来自插件入口';parseTable();}});
render();
</script>
</body>
</html>
