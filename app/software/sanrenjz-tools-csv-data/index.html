<!DOCTYPE html>
<html lang="zh-CN" data-layout="sheet-grid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV 数据表</title>
<style>
:root{
  --accent:#0f9d8a;--accent-soft:rgba(15,157,138,.12);--accent-line:rgba(15,157,138,.34);
  --bg:#f6f8f7;--surface:#ffffff;--surface-2:#f0f4f2;--border:#dfe7e3;
  --ink:#1a2e2a;--muted:#5c706a;--faint:#9aa8a3;
  --ok:#0f9d8a;--err:#e5484d;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.head .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#34d399);display:flex;align-items:center;justify-content:center;flex:none}
.head .logo svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.head .spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sel{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;outline:none}
.sel:focus{border-color:var(--accent-line)}
.lab{font-size:12px;color:var(--muted);font-weight:500}
/* body split */
.body{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:0}
.input-col{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.input-col .ph{padding:12px 16px;border-bottom:1px solid var(--border);font:600 11px var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.csv-area{flex:1;min-height:0;border:0;resize:none;outline:0;padding:16px;font:13px/1.6 var(--mono);background:var(--surface);color:var(--ink)}
.csv-area::placeholder{color:var(--faint)}
.input-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;flex:none}
.row{display:flex;align-items:center;gap:8px}
.row .lab{flex:none;width:56px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* table view */
.table-col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.table-bar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex:none;background:var(--surface-2)}
.table-wrap{flex:1;min-height:0;overflow:auto;background:var(--surface)}
table.csv{width:100%;border-collapse:collapse;font-size:13px}
table.csv th,table.csv td{border:1px solid var(--border);padding:6px 10px;text-align:left;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.csv th{background:var(--accent-soft);color:var(--ink);font-weight:700;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
table.csv th:hover{background:rgba(15,157,138,.2)}
table.csv th .arr{font-size:9px;margin-left:4px;color:var(--accent)}
table.csv tr:nth-child(even){background:var(--surface-2)}
table.css tr:hover{background:rgba(15,157,138,.06)}
table.csv td.num{text-align:right;font-family:var(--mono)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);gap:12px;gap:14px}
.empty-state svg{width:54px;height:54px;opacity:.4}
.stats{font:12px var(--mono);color:var(--muted);padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:18px;flex:none;background:var(--surface)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2e2a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c4d1cc;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></div>
    <div><h1>CSV 数据表</h1><p>筛选、排序并在 CSV 与 JSON 之间转换</p></div>
    <div class="spacer"></div>
    <button class="btn" id="pasteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1z"/><path d="M5 5h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>粘贴</button>
    <button class="btn primary" id="runBtn">解析表格</button>
  </div>
  <div class="body">
    <div class="input-col">
      <div class="ph">CSV 输入</div>
      <textarea class="csv-area" id="csvInput" spellcheck="false" placeholder="姓名,年龄,城市&#10;张三,28,北京&#10;李四,34,上海"></textarea>
      <div class="input-foot">
        <div class="row"><span class="lab">分隔符</span>
          <select class="sel" id="delimiter" style="flex:1"><option value=",">逗号 ,</option><option value=";">分号 ;</option><option value="\t">制表符</option><option value="|">竖线 |</option></select>
        </div>
        <div class="row"><span class="lab">操作</span>
          <select class="sel" id="action" style="flex:1"><option value="table">表格预览</option><option value="json">转为 JSON</option></select>
        </div>
        <button class="btn primary" id="sortBtn" style="justify-content:center">应用排序并导出</button>
      </div>
    </div>
    <div class="table-col">
      <div class="table-bar">
        <span class="lab">点击表头排序</span>
        <div class="spacer" style="flex:1"></div>
        <span class="lab" id="sortInfo"></span>
      </div>
      <div class="table-wrap" id="tableWrap">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
          <span>粘贴 CSV 数据后点击「解析表格」</span>
        </div>
      </div>
      <div class="stats"><span id="statRows">0 行</span><span id="statCols">0 列</span><span id="statBytes">0 字符</span></div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);
let sortCol=null,sortDir=1;
$('#pasteBtn').onclick=async()=>{const t=api.readClipboardText();if(t){$('#csvInput').value=t;updateStats();toast('已粘贴剪贴板内容');}};
$('#csvInput').addEventListener('input',updateStats);
$('#runBtn').onclick=()=>parseTable();
$('#sortBtn').onclick=()=>exportSorted();
function updateStats(){const v=$('#csvInput').value;$('#statBytes').textContent=v.length+' 字符';}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function getDelim(){const v=$('#delimiter').value;return v==='\\t'?'\t':v;}
async function parseTable(){
  const input=$('#csvInput').value;if(!input.trim()){toast('请先输入 CSV');return;}
  const delim=getDelim();
  // parse locally for table preview (faster, no IPC for preview)
  const rows=parseCsvLocal(input,delim);
  renderTable(rows);
  $('#statRows').textContent=(rows.length-1)+' 行数据';
  $('#statCols').textContent=(rows[0]?.length||0)+' 列';
}
function parseCsvLocal(text,delim){
  const rows=[];let row=[],field='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}
    else if(c===delim&&!quoted){row.push(field);field='';}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field='';}
    else field+=c;}
  if(field||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.length&&!(r.length===1&&r[0]===''));
}
function renderTable(rows){
  if(!rows.length){$('#tableWrap').innerHTML='<div class="empty-state"><span>无有效数据</span></div>';return;}
  const [headers,...data]=rows;
  let html='<table class="csv"><thead><tr>';
  headers.forEach((h,i)=>{const arr=sortCol===i?(sortDir>0?'▲':'▼'):'';html+=`<th data-col="${i}">${escapeHtml(h)}<span class="arr">${arr}</span></th>`;});
  html+='</tr></thead><tbody>';
  data.forEach(r=>{html+='<tr>';headers.forEach((_,i)=>{const v=r[i]??'';const isNum=/^-?\d+(\.\d+)?$/.test(v.trim());html+=`<td${isNum?' class="num"':''}>${escapeHtml(v)}</td>`;});html+='</tr>';});
  html+='</tbody></table>';
  $('#tableWrap').innerHTML=html;
  $$('#tableWrap th').forEach(th=>th.onclick=()=>{
    const c=+th.dataset.col;if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1;}
    parseTable();$('#sortInfo').textContent=`按第 ${c+1} 列 ${sortDir>0?'升序':'降序'}`;
  });
}
function $$(s,r=document){return r.querySelectorAll(s);}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function exportSorted(){
  const input=$('#csvInput').value;if(!input.trim()){toast('请先输入 CSV');return;}
  const delim=getDelim();const col=sortCol;
  const options={action:'json',delimiter:delim};
  if(col!=null)options.sortColumn=String(col);
  const res=await api.runTask({toolId:'csv-table',input,options,execute:false});
  if(res.ok){const text=typeof res.result==='string'?res.result:JSON.stringify(res.result,null,2);
    const saved=api.saveResult({title:'保存 JSON',defaultPath:'csv-result.json',filters:[{name:'JSON',extensions:['json']}],text});if(!saved.cancelled)toast('已导出 JSON');}
  else toast('导出失败：'+res.error);
}
window.addEventListener('plugin-enter',e=>{
  const text=e.detail?.action?.payload||e.detail?.action?.clipboardText||e.detail?.payload||e.detail?.clipboardText||'';
  if(text){$('#csvInput').value=text;updateStats();parseTable();}
});
updateStats();
</script>
</body></html>
