<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>压缩包工具</title>
<style>
:root{--bg:#faf5ff;--panel:#fff;--surface:#f3e8ff;--text:#3b1f6e;--muted:#7c5ba8;--border:#e9d5ff;--accent:#6d28d9;--accent2:#a78bfa;--radius:10px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
.top .mode{display:flex;margin:0 8px}
.top .mode button{padding:5px 14px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;color:var(--text)}
.top .mode button:first-child{border-radius:5px 0 0 5px}
.top .mode button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.top .mode button.active{background:var(--accent);color:#fff;border-color:var(--accent);z-index:1}
.top .btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s}
.top .btn:hover{background:var(--surface)}
.top .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.top .btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.config{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px}
.config .fld{display:flex;align-items:center;gap:4px}
.config .fld label{color:var(--muted);white-space:nowrap;font-weight:500}
.config .fld select,.config .fld input{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);font-size:11px;outline:none;color:var(--text)}
.config .fld select:focus,.config .fld input:focus{border-color:var(--accent)}
.config .fld input{width:160px}
.content{flex:1;overflow-y:auto;padding:4px 0}
.content .row{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;padding:7px 14px;font-size:12px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);transition:background .1s}
.content .row:hover{background:var(--surface)}
.content .row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"SF Mono","Cascadia Code","Consolas",monospace;font-size:11px}
.content .row .size{font-size:11px;color:var(--muted);text-align:right;font-family:"SF Mono","Cascadia Code","Consolas",monospace}
.content .row .folder{color:var(--accent);font-weight:500}
.content .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
.content .empty strong{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.content .empty .hint{font-size:11px;margin-top:6px}
.stat{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
.stat .cnt{font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">&#128230;</div>
    <h1>压缩包工具</h1>
    <div class="mode">
      <button class="active" data-mode="list">浏览 ZIP</button>
      <button data-mode="create">创建 ZIP</button>
    </div>
    <button class="btn" id="pickFile">选择文件</button>
    <button class="btn primary" id="action">浏览</button>
    <button class="btn" id="clearAll">清空</button>
  </div>
  <div class="config" id="configArea">
    <div class="fld" id="levelFld" style="display:none"><label>压缩级别</label><select id="level"><option value="1">1 - 最快</option><option value="3">3</option><option value="6" selected>6 - 标准</option><option value="9">9 - 最高</option></select></div>
    <div class="fld" id="outFld" style="display:none"><label>输出路径</label><input type="text" id="outPath" placeholder="默认：三人聚智压缩包.zip" readonly></div>
    <button class="btn" id="pickOut" style="display:none;padding:4px 10px;font-size:11px">选择</button>
    <div class="fld" id="extractFld" style="display:none"><label>解压目录</label><input type="text" id="extractDir" placeholder="选择解压目录..." readonly></div>
    <button class="btn" id="pickExtract" style="display:none;padding:4px 10px;font-size:11px">选择</button>
  </div>
  <div class="content" id="content">
    <div class="empty"><strong>浏览或创建 ZIP 压缩包</strong><div class="hint">选择浏览模式打开 ZIP 查看内容，或创建模式打包文件</div></div>
  </div>
  <div class="stat"><span id="statText"></span><span class="cnt" id="statCount"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const API=window.pluginAPI;
let mode='list',fileList=[],outPath='',extractDir='';

function setMode(m){mode=m;document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  $('#levelFld').style.display=m==='create'?'flex':'none';$('#outFld').style.display=m==='create'?'flex':'none';$('#pickOut').style.display=m==='create'?'inline-block':'none';
  $('#extractFld').style.display=m==='list'?'flex':'none';$('#pickExtract').style.display=m==='list'?'inline-block':'none';
  $('#action').textContent=m==='list'?'浏览':'创建';fileList=[];renderContent();$('#statCount').textContent='';$('#statText').textContent=''}
async function pickFile(){if(mode==='list'){const f=await API.selectFiles({title:'选择 ZIP 文件',multiple:false,filters:[{name:'ZIP',extensions:['zip']}]});if(f.length){fileList=[f[0]];renderContent()}}
  else{const f=await API.selectFiles({title:'选择要压缩的文件'});if(f.length){fileList=[...new Set([...fileList,...f])];renderContent()}}}
function clearAll(){fileList=[];outPath='';extractDir='';renderContent();$('#statCount').textContent='';$('#statText').textContent=''}
function renderContent(){const el=$('#content');if(!fileList.length){el.innerHTML=mode==='list'?'<div class="empty"><strong>选择 ZIP 文件浏览内容</strong><div class="hint">支持查看压缩包内文件列表和解压</div></div>':'<div class="empty"><strong>选择文件创建压缩包</strong><div class="hint">可多选文件，设置压缩级别后打包</div></div>';return}
  if(mode==='list'){el.innerHTML='<div class="empty"><strong>请点击浏览</strong><div class="hint">'+fileList[0].split(/[\\/]/).pop()+'</div></div>'}else{el.innerHTML=fileList.map(f=>`<div class="row"><span class="name" title="${f}">${f.split(/[\\/]/).pop()}</span><span class="size">-</span></div>`).join('');$('#statCount').textContent=fileList.length+' 个文件'}}
async function doAction(){if(mode==='list'){if(!fileList.length)return;$('#statText').textContent='读取中...';const r=await API.runTask({options:{files:fileList}});if(r.ok){renderZipContents(r.result)}else{$('#statText').textContent=r.error}}
  else{if(!fileList.length)return;$('#statText').textContent='压缩中...';const r=await API.runTask({options:{files:fileList,action:'create',level:$('#level').value,output:outPath||undefined},execute:true});if(r.ok){$('#statText').textContent='已创建 '+r.result.output+' ('+r.result.files+' 文件, '+fmtSize(r.result.bytes)+')'}else{$('#statText').textContent=r.error}}}
function renderZipContents(data){const el=$('#content');el.innerHTML=data.map(d=>`<div class="row"><span class="name ${d.name.endsWith('/')?'folder':''}">${d.name}</span><span class="size">${fmtSize(d.bytes)}</span></div>`).join('');$('#statCount').textContent=data.length+' 项';$('#statText').textContent=''}
async function doExtract(){if(!fileList.length||!extractDir)return;$('#statText').textContent='解压中...';const r=await API.runTask({options:{files:fileList,outputDirectory:extractDir},execute:true});if(r.ok){$('#statText').textContent='已解压到 '+extractDir}else{$('#statText').textContent=r.error}}
async function pickOutPath(){const p=await API.chooseSavePath({title:'选择输出位置',defaultPath:'三人聚智压缩包.zip',filters:[{name:'ZIP',extensions:['zip']}]});if(p){outPath=p;$('#outPath').value=p}}
async function pickExtractDir(){const d=await API.selectDirectory('选择解压目录');if(d){extractDir=d;$('#extractDir').value=d}}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}

document.querySelectorAll('.mode button').forEach(b=>b.onclick=function(){setMode(this.dataset.mode)});
$('#pickFile').onclick=pickFile;$('#action').onclick=doAction;$('#clearAll').onclick=clearAll;
$('#pickOut').onclick=pickOutPath;$('#outPath').onclick=pickOutPath;
$('#pickExtract').onclick=pickExtractDir;$('#extractDir').onclick=pickExtractDir;
setMode('list');
</script>
</body>
</html>
