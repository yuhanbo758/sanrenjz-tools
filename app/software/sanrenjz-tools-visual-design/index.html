<!DOCTYPE html>
<html lang="zh-CN" data-layout="swatch-wall">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉设计实验室</title>
<style>
:root{--accent:#6242c9;--soft:#eee9fa;--bg:#f7f5fc;--surface:#fff;--border:#ded7ed;--ink:#241b37;--muted:#706585;--faint:#9186a7;--ok:#16834b;--err:#c33b45;--mono:Consolas,monospace;--sans:'Segoe UI','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}.tabs{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}.tab{border:0;background:transparent;color:var(--muted);padding:8px 15px;border-radius:8px;font-weight:600}.tab:hover{background:var(--soft)}.tab.active{background:var(--accent);color:#fff}.content{flex:1;min-height:0;overflow:auto;padding:16px}.panel{display:none;min-height:100%;flex-direction:column;gap:14px}.panel.active{display:flex}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1}.btn{border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.hint{color:var(--muted);font-size:12px}.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea{color:var(--ink);background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 9px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--accent)}.field input[type=color]{padding:3px;width:44px;height:36px;flex:none}.row{display:flex;gap:8px;align-items:center}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}.palette-layout{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;min-height:390px;flex:1}.dropzone{background:#fff;border:2px dashed var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:300px;text-align:center;color:var(--muted);overflow:hidden;position:relative}.dropzone.has-image{border-style:solid}.dropzone img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.dropzone.has-image .drop-label{position:absolute;bottom:0;left:0;right:0;padding:6px;background:#ffffffde;color:var(--ink)}.dropzone.dragging,.dragging .dropzone{border-color:var(--accent);background:var(--soft)}.right-stack{display:flex;flex-direction:column;gap:12px;min-width:0}.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;align-content:start}.swatch{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff;text-align:left;padding:0}.swatch:hover{border-color:var(--accent)}.swatch-bar{height:66px}.swatch-info{padding:8px;display:flex;justify-content:space-between;gap:5px;font:12px var(--mono)}.empty{color:var(--faint);padding:28px;text-align:center;border:1px dashed var(--border);border-radius:10px;grid-column:1/-1}.palette-strip{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}.palette-strip>div{flex:1}.analysis-grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:14px}.input-stack{display:flex;flex-direction:column;gap:14px}.preview{min-height:115px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:650;text-align:center;padding:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{padding:12px;border:1px solid var(--border);border-radius:9px;background:#fff}.metric b{display:block;font:600 18px var(--mono);margin:4px 0}.metric.pass b{color:var(--ok)}.metric.fail b{color:var(--err)}.harmony{display:flex;gap:8px;flex-wrap:wrap}.harmony button{width:90px;padding:0 0 6px;border:1px solid var(--border);border-radius:8px;background:#fff;overflow:hidden;font:11px var(--mono)}.harmony i{display:block;height:38px;margin-bottom:5px}.svg-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;min-height:400px;flex:1}.editor-card{display:flex;flex-direction:column;min-height:400px}.editor-card label{font-weight:650;margin-bottom:7px}.editor-card textarea{flex:1;min-height:260px;width:100%;resize:vertical;font:12px/1.55 var(--mono)}.svg-preview{height:230px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/20px 20px;border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;overflow:hidden}.svg-preview img{max-width:100%;max-height:100%}.result{white-space:pre-wrap;word-break:break-all;font:12px/1.5 var(--mono);overflow:auto;max-height:220px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#241b37;color:#fff;padding:8px 15px;border-radius:8px;display:none;z-index:9}.toast.show{display:block}@media(max-width:800px){.palette-layout,.analysis-grid,.svg-layout{grid-template-columns:1fr}.dropzone{min-height:190px}.editor-card{min-height:300px}}
.field.row{flex-direction:row;align-items:center}
</style>
</head><body><main class="app"><nav class="tabs" aria-label="工具菜单"><button class="tab active" data-tool="palette-extractor">◉ 取色器</button><button class="tab" data-tool="color-workbench">⊕ 调色台</button><button class="tab" data-tool="svg-workbench">⌘ SVG 美化</button></nav><div class="content">
<section class="panel active" data-panel="palette-extractor"><div class="toolbar"><button class="btn primary" id="pePick">选择图片</button><button class="btn" id="pePaste">粘贴图片</button><label class="field row">颜色数 <select id="peCount"><option>4</option><option selected>8</option><option>12</option></select></label><span class="hint" id="peInfo">支持拖入 PNG、JPG、WebP、BMP</span><span class="grow"></span><button class="btn" id="peCss" disabled>复制 CSS</button><button class="btn" id="peExport" disabled>导出色板</button></div><div class="palette-layout"><div class="dropzone" id="peDrop" tabindex="0"><span class="drop-label">拖入图片，或点击选择<br><small>粘贴图片也可直接提取</small></span></div><div class="right-stack"><div class="palette-strip" id="peStrip" hidden></div><div class="swatches" id="peSwatches"><div class="empty">导入图片后显示主色。点击色卡复制，或送到调色台继续检查。</div></div></div></div></section>
<section class="panel" data-panel="color-workbench"><div class="analysis-grid"><div class="card input-stack"><label class="field">背景颜色<div class="row"><input id="cwBg" value="#6750A4" maxlength="7"><input id="cwBgPicker" type="color" value="#6750a4"></div></label><label class="field">文字颜色<div class="row"><input id="cwFg" value="#FFFFFF" maxlength="7"><input id="cwFgPicker" type="color" value="#ffffff"></div></label><div class="toolbar"><button class="btn" id="cwSwap">交换颜色</button><button class="btn primary" id="cwRun">检查对比度</button></div><div class="preview" id="cwPreview">Aa 文字预览<br>Design preview</div></div><div class="right-stack"><div class="metrics" id="cwResults"></div><div class="card"><strong>背景色搭配</strong><p class="hint">点击色块复制 HEX</p><div class="harmony" id="cwHarmony"></div></div></div></div></section>
<section class="panel" data-panel="svg-workbench"><div class="toolbar"><button class="btn" id="svgPick">打开 SVG</button><label class="field row">处理方式 <select id="svgAction"><option value="format">格式化</option><option value="minify">压缩</option></select></label><button class="btn primary" id="svgRun">处理并预览</button><span class="grow"></span><span class="hint" id="svgInfo">可拖入 SVG 文件</span><button class="btn" id="svgCopy" disabled>复制结果</button><button class="btn" id="svgSave" disabled>保存 SVG</button></div><div class="svg-layout"><div class="card editor-card"><label for="svgInput">SVG 源码</label><textarea class="field" id="svgInput" spellcheck="false" placeholder="粘贴 SVG，或拖入 .svg 文件"></textarea></div><div class="right-stack"><div class="card"><strong>预览</strong><div class="svg-preview" id="svgPreview"><span class="hint">处理后显示预览</span></div></div><div class="card"><strong>处理结果</strong><pre class="result" id="svgOutput"></pre></div></div></div></section>
</div></main><div class="toast" id="toast" role="status"></div><script src="renderer.js"></script></body></html>
