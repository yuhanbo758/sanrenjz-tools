<!DOCTYPE html>
<html lang="zh-CN" data-layout="clock-dial">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时间与计算中心</title>
<style>
:root{
  --accent:#1565c0;--accent-2:#42a5f5;--accent-soft:rgba(21,101,192,.1);--accent-line:rgba(21,101,192,.3);
  --bg:#f4f8fc;--surface:#fff;--surface-2:#eef4fa;--border:#d6e3ef;
  --ink:#0f2a44;--muted:#5a7187;--faint:#9aafc0;
  --ok:#16a34a;--err:#dc2626;
  --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.clock{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex:none}
.clock svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.live{font:600 13px var(--mono);color:var(--accent);background:var(--accent-soft);padding:6px 14px;border-radius:999px;border:1px solid var(--accent-line)}
.tabs{display:flex;gap:6px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:7px}
.tab svg{width:15px;height:15px}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--accent);color:#fff}
.content{flex:1;min-height:0;overflow:auto;padding:20px 24px}
.panel{display:none;flex-direction:column;gap:16px;max-width:820px;margin:0 auto}
.panel.active{display:flex}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.card h2{margin:0 0 6px;font-size:16px;font-weight:700}
.card .desc{color:var(--muted);font-size:12px;margin:0 0 16px}
.field{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.field .f{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.inp{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font:14px var(--mono);color:var(--ink);outline:none;min-width:160px}
.inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
.sel{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;outline:none}
.run{border:0;border-radius:8px;padding:10px 24px;font-weight:600;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;transition:.15s}
.run:hover{filter:brightness(1.08)}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.result-item{background:var(--surface-2);border-radius:10px;padding:14px}
.result-item .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.result-item .v{font:600 15px var(--mono);color:var(--ink);word-break:break-all}
.result-item .v.big{font-size:20px;color:var(--accent)}
.calc-area{width:100%;min-height:200px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;font:14px/1.8 var(--mono);color:var(--ink);resize:vertical;outline:none}
.calc-out{background:#0f2a44;color:#cfe8ff;border-radius:10px;padding:16px;font:14px/1.8 var(--mono);white-space:pre-wrap;min-height:80px;overflow:auto}
.unit-pair{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.unit-pair .arrow{color:var(--accent);font-size:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f2a44;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#bcd0e0;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <div><h1>时间与计算中心</h1><p>时间、日期、单位和逐行计算放到同一张工作桌</p></div>
    <div class="spacer"></div>
    <span class="live" id="liveClock">--:--:--</span>
  </div>
  <div class="tabs">
    <button class="tab active" data-tool="time-converter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/><circle cx="12" cy="12" r="7"/><path d="M12 9v3l2 2"/></svg>时间戳转换</button>
    <button class="tab" data-tool="date-world-clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></svg>世界时钟</button>
    <button class="tab" data-tool="unit-converter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L4 7M7 4l3 3M17 8v12M17 20l3-3M17 20l-3-3"/></svg>单位换算</button>
    <button class="tab" data-tool="calculation-paper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>计算草稿</button>
  </div>
  <div class="content">
    <!-- Time converter -->
    <div class="panel active" data-panel="time-converter">
      <div class="card">
        <h2>时间戳转换</h2>
        <p class="desc">输入日期字符串或时间戳（10/13 位），留空使用当前时间</p>
        <div class="field">
          <div class="f"><label>输入</label><input class="inp" id="tcInput" placeholder="2026-01-15 或 1736899200" style="min-width:260px"></div>
          <div class="f"><label>时区</label><select class="sel" id="tcTz"><option value="">系统默认</option><option value="Asia/Shanghai">上海</option><option value="UTC">UTC</option><option value="America/New_York">纽约</option><option value="Europe/London">伦敦</option></select></div>
          <button class="run" data-run>转换</button>
        </div>
        <div class="result-grid" id="tcResult"></div>
      </div>
    </div>
    <!-- World clock -->
    <div class="panel" data-panel="date-world-clock">
      <div class="card">
        <h2>世界时钟与日期推算</h2>
        <p class="desc">输入基准日期，加减天数后查看各地时间</p>
        <div class="field">
          <div class="f"><label>基准日期</label><input class="inp" id="wcInput" placeholder="留空=今天" style="min-width:200px"></div>
          <div class="f"><label>增减天数</label><input class="inp" id="wcDays" type="number" value="0" style="width:100px"></div>
          <button class="run" data-run>计算</button>
        </div>
        <div class="result-grid" id="wcResult"></div>
      </div>
    </div>
    <!-- Unit converter -->
    <div class="panel" data-panel="unit-converter">
      <div class="card">
        <h2>单位换算</h2>
        <p class="desc">长度、重量、面积、速度与温度互转</p>
        <div class="field">
          <div class="f"><label>数值</label><input class="inp" id="ucValue" type="number" value="1" style="width:120px"></div>
          <div class="f"><label>类别</label><select class="sel" id="ucType"><option value="length">长度</option><option value="weight">重量</option><option value="area">面积</option><option value="speed">速度</option><option value="temperature">温度</option></select></div>
        </div>
        <div class="field unit-pair">
          <div class="f"><label>从</label><select class="sel" id="ucFrom"></select></div>
          <span class="arrow">→</span>
          <div class="f"><label>到</label><select class="sel" id="ucTo"></select></div>
          <button class="run" data-run>换算</button>
        </div>
        <div class="result-grid"><div class="result-item"><div class="k">结果</div><div class="v big" id="ucResult">—</div></div></div>
      </div>
    </div>
    <!-- Calculation paper -->
    <div class="panel" data-panel="calculation-paper">
      <div class="card">
        <h2>计算草稿</h2>
        <p class="desc">每行一个表达式，支持变量赋值（如 a = 10）。支持 + - * / % 和括号</p>
        <textarea class="calc-area" id="cpInput" spellcheck="false" placeholder="a = 100&#10;b = a * 1.08&#10;b + 200&#10;3.14 * 2 ^ 2"></textarea>
        <div style="margin-top:12px"><button class="run" data-run>计算</button></div>
        <div style="margin-top:14px"><div class="result-item" style="padding:0"><div class="calc-out" id="cpOutput">结果将显示在这里</div></div></div>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let current='time-converter';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
$$('.tab').forEach(t=>t.onclick=()=>{current=t.dataset.tool;$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===current));});
$$('[data-run]').forEach(b=>b.onclick=run);
// live clock
function tick(){const d=new Date();$('#liveClock').textContent=d.toLocaleTimeString('zh-CN',{hour12:false});}tick();setInterval(tick,1000);
// unit options
const units={length:[['mm','毫米'],['cm','厘米'],['m','米'],['km','千米']],weight:[['g','克'],['kg','千克'],['t','吨']],area:[['m2','平方米'],['km2','平方千米'],['mu','亩']],speed:[['m/s','米/秒'],['km/h','千米/时']],temperature:[['c','摄氏'],['f','华氏'],['k','开尔文']]};
function fillUnits(){$('#ucFrom').innerHTML='';$('#ucTo').innerHTML='';const t=$('#ucType').value;if(t==='temperature'){['c','f','k'].forEach(u=>{const o1=new Option(u.toUpperCase(),u);const o2=new Option(u.toUpperCase(),u);$('#ucFrom').add(o1);$('#ucTo').add(o2);});$('#ucTo').selectedIndex=1;}else{units[t].forEach(([v,l])=>{$('#ucFrom').add(new Option(l,v));$('#ucTo').add(new Option(l,v));});$('#ucTo').selectedIndex=Math.min(1,units[t].length-1);}}
$('#ucType').onchange=fillUnits;fillUnits();
function renderGrid(sel,items){$(sel).innerHTML=items.map(([k,v,big])=>`<div class="result-item"><div class="k">${esc(k)}</div><div class="v${big?' big':''}">${esc(v)}</div></div>`).join('');}
async function run(){
  if(current==='time-converter'){
    const input=$('#tcInput').value.trim();
    const res=await api.runTask({toolId:'time-converter',input,options:{timeZone:$('#tcTz').value},execute:false});
    if(res.ok){const r=typeof res.result==='string'?JSON.parse(res.result):res.result;renderGrid('#tcResult',[['ISO 8601',r.iso,true],['本地时间',r.local],['时间戳(秒)',r.timestampSeconds],['时间戳(毫秒)',r.timestampMilliseconds]]);}
    else toast(res.error);
  }else if(current==='date-world-clock'){
    const input=$('#wcInput').value.trim();const days=$('#wcDays').value||'0';
    const res=await api.runTask({toolId:'date-world-clock',input,options:{days:Number(days)},execute:false});
    if(res.ok){const r=typeof res.result==='string'?JSON.parse(res.result):res.result;renderGrid('#wcResult',[['日期',r.date,true],['本地',r.local],['UTC',r.utc],['星期',r.weekDay]]);}
    else toast(res.error);
  }else if(current==='unit-converter'){
    const value=$('#ucValue').value;const type=$('#ucType').value;
    const res=await api.runTask({toolId:'unit-converter',input:value,options:{unitType:type,fromUnit:$('#ucFrom').value,toUnit:$('#ucTo').value},execute:false});
    if(res.ok){$('#ucResult').textContent=res.result;}
    else toast(res.error);
  }else if(current==='calculation-paper'){
    const input=$('#cpInput').value.trim();if(!input){toast('请输入表达式');return;}
    const res=await api.runTask({toolId:'calculation-paper',input,options:{},execute:false});
    if(res.ok){$('#cpOutput').textContent=res.result;}
    else{$('#cpOutput').textContent='错误：'+res.error;}
  }
}
window.addEventListener('plugin-enter',e=>{
  const id=e.detail?.toolId;if(id){current=id;$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tool===id));$$('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===id));}
  const text=e.detail?.action?.payload||e.detail?.action?.clipboardText||e.detail?.payload||e.detail?.clipboardText||'';
  if(text){const map={'time-converter':'#tcInput','date-world-clock':'#wcInput','unit-converter':'#ucValue','calculation-paper':'#cpInput'};const el=$(map[current]);if(el)el.value=text;}
});
</script>
</body></html>
