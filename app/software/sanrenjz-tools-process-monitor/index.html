<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>进程监控器</title>
<style>
:root{--bg:#111827;--panel:#1a2332;--text:#e5e7eb;--muted:#6b7280;--border:#1f2a3a;--accent:#22c55e;--danger:#ef4444;--warn:#f59e0b;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.custom-title-bar{background:var(--bg)!important;border-bottom:1px solid var(--border)!important}
.controls{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.controls button{padding:7px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.controls button:hover{border-color:var(--accent);color:var(--accent)}
.controls button.primary{background:var(--accent);border-color:var(--accent);color:#111827;font-weight:600}
.controls button.primary:hover{filter:brightness(1.1)}
.controls button.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.controls button.danger:hover{filter:brightness(1.1)}
.controls .spacer{flex:1}
.controls input{width:80px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;font-family:monospace;outline:none;text-align:center}
.controls input:focus{border-color:var(--accent)}
.controls label{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
.table-wrap{flex:1;overflow-y:auto;min-height:0}
.table-wrap::-webkit-scrollbar{width:5px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{position:sticky;top:0;z-index:1}
th{background:var(--panel);padding:8px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:6px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover td{background:var(--panel)}
.proc-name{font-weight:600;color:var(--text)}
.pid{font-family:monospace;color:var(--muted);font-size:11px}
.cpu{font-family:monospace;color:var(--accent)}
.mem{font-family:monospace;color:var(--accent)}
.path-cell{max-width:240px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:10px;font-family:monospace}
.kill-btn{padding:3px 8px;border:none;border-radius:4px;background:var(--danger);color:#fff;font-size:10px;cursor:pointer;transition:all .15s}
.kill-btn:hover{filter:brightness(1.2)}
.kill-btn:active{transform:scale(.95)}
.loading{display:flex;align-items:center;justify-content:center;height:120px;color:var(--muted);font-size:13px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="controls">
  <button id="refreshBtn" class="primary">刷新进程</button>
  <div class="spacer"></div>
  <label>PID 结束：<input type="text" id="pidInput" placeholder="输入 PID"></label>
  <button id="killBtn" class="danger">结束进程</button>
</div>
<div class="table-wrap" id="tableWrap">
  <div class="loading"><div class="spinner"></div><span>加载进程中...</span></div>
</div>
<script>
const api = window.pluginAPI;
const refreshBtn = document.getElementById('refreshBtn');
const killBtn = document.getElementById('killBtn');
const pidInput = document.getElementById('pidInput');
const tableWrap = document.getElementById('tableWrap');

function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return '--';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(2) + ' GB';
}

async function loadProcesses() {
  tableWrap.innerHTML = '<div class="loading"><div class="spinner"></div><span>加载进程中...</span></div>';
  try {
    const res = await api.runTask({ input: '', options: {}, execute: false });
    if (!res.ok) { tableWrap.innerHTML = `<div class="loading">${res.error}</div>`; return; }
    const procs = res.result;
    if (!Array.isArray(procs) || !procs.length) {
      tableWrap.innerHTML = '<div class="loading">无进程数据</div>';
      return;
    }
    let html = `<table><thead><tr><th>进程名</th><th>PID</th><th>CPU (s)</th><th>内存</th><th>路径</th><th></th></tr></thead><tbody>`;
    procs.forEach(p => {
      const name = p.ProcessName || '--';
      const pid = p.Id || '--';
      const cpu = p.CPU != null ? Number(p.CPU).toFixed(1) : '--';
      const mem = formatBytes(p.WorkingSet64);
      const path = p.Path ? p.Path.replace(/\\/g, '/').split('/').pop() : '--';
      html += `<tr>
        <td class="proc-name">${name}</td>
        <td class="pid">${pid}</td>
        <td class="cpu">${cpu}</td>
        <td class="mem">${mem}</td>
        <td class="path-cell" title="${p.Path || ''}">${path}</td>
        <td><button class="kill-btn" onclick="killPid(${pid})">结束</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    tableWrap.innerHTML = html;
  } catch (e) {
    tableWrap.innerHTML = `<div class="loading">加载失败: ${e.message}</div>`;
  }
}

async function killPid(pid) {
  if (!pid) return;
  try {
    const res = await api.runTask({ input: '', options: { pid: pid }, execute: true });
    if (res.ok) { loadProcesses(); }
  } catch (_) {}
}

killBtn.addEventListener('click', () => {
  const pid = parseInt(pidInput.value.trim(), 10);
  if (pid) killPid(pid);
});

refreshBtn.addEventListener('click', loadProcesses);

loadProcesses();
</script>
</body>
</html>
