<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行处理器</title>
<style>
:root{--bg:#1a1014;--panel:#241820;--surface:#2d1f28;--text:#ffe4ec;--muted:#b895a4;--border:#4a2d3a;--accent:#f43f5e;--accent2:#fb7185;--radius:8px}
.custom-title-bar{background:var(--bg)!important;border-bottom-color:var(--border)!important}
.title-bar-title,.title-bar-pin-button,.window-control-button{color:var(--text)!important}
.title-bar-pin-button:hover,.window-control-button:hover{background:var(--panel)!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{height:calc(100vh - 32px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:0;overflow:hidden}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.bar .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
.bar h1{font-size:14px;font-weight:700;margin:0;white-space:nowrap;color:var(--text)}
.bar .btn{padding:5px 12px;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer;font-size:11px;font-weight:500;white-space:nowrap;transition:all .15s;color:var(--text)}
.bar .btn:hover{background:var(--border)}
.bar .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar .btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px}
.tools label{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--muted);padding:3px 8px;border-radius:5px;transition:all .15s}
.tools label:hover{background:var(--panel);color:var(--text)}
.tools label input{accent-color:var(--accent)}
.tools .fld{display:flex;align-items:center;gap:4px;margin-left:4px}
.tools .fld input{padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);font-size:11px;outline:none;color:var(--text);width:90px}
.tools .fld input:focus{border-color:var(--accent)}
.tools .fld label{color:var(--muted);white-space:nowrap}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane .head{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel);text-transform:uppercase;letter-spacing:.05em}
.pane .head .cnt{color:var(--accent);font-size:10px}
.pane textarea{flex:1;width:100%;padding:10px;border:0;background:var(--bg);color:var(--text);font-size:12px;font-family:"SF Mono","Cascadia Code","Consolas",monospace;resize:none;outline:none;line-height:1.5}
.pane textarea:focus{background:var(--panel)}
.statusbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:5px 14px;font-size:10px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="logo">&#9776;</div>
    <h1>行处理器</h1>
    <button class="btn" id="paste">从剪贴板粘贴</button>
    <button class="btn primary" id="process">处理</button>
    <button class="btn" id="copyResult">复制结果</button>
    <button class="btn" id="clearAll">清空</button>
  </div>
  <div class="tools">
    <label><input type="checkbox" id="dedupe">去重</label>
    <label><input type="checkbox" id="sort">排序</label>
    <label><input type="checkbox" id="number">编号</label>
    <div class="fld"><label>过滤</label><input type="text" id="filter" placeholder="包含文字..."></div>
    <div class="fld"><label>前缀</label><input type="text" id="prefix" placeholder="前缀"></div>
    <div class="fld"><label>后缀</label><input type="text" id="suffix" placeholder="后缀"></div>
  </div>
  <div class="pane">
    <div class="head"><span>输入</span><span class="cnt" id="inputCnt">0 行</span></div>
    <textarea id="input" placeholder="输入文本，每行一条..."></textarea>
  </div>
  <div class="pane" style="border-left:1px solid var(--border)">
    <div class="head"><span>结果</span><span class="cnt" id="outputCnt">0 行</span></div>
    <textarea id="output" placeholder="处理结果将显示在此..." readonly></textarea>
  </div>
  <div class="statusbar"><span id="statText"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const API=window.pluginAPI;

async function doProcess(){const input=$('#input').value;const opts={filter:$('#filter').value,unique:$('#dedupe').checked,sort:$('#sort').checked,number:$('#number').checked,prefix:$('#prefix').value,suffix:$('#suffix').value};
  const r=await API.runTask({input,options:opts});
  if(r.ok){$('#output').value=r.result;updateCounts()}else{$('#statText').textContent=r.error}}
function updateCounts(){const il=$('#input').value.split('\n').filter(l=>l.trim()).length;const ol=$('#output').value.split('\n').filter(l=>l.trim()).length;$('#inputCnt').textContent=il+' 行';$('#outputCnt').textContent=ol+' 行';$('#statText').textContent=''}
async function doPaste(){try{const t=await API.readClipboardText();if(t){$('#input').value=t;updateCounts()}}catch(e){$('#statText').textContent='无法读取剪贴板'}}
function doCopy(){API.copyText($('#output').value);$('#statText').textContent='已复制到剪贴板';setTimeout(()=>{$('#statText').textContent=''},2000)}
function clearAll(){$('#input').value='';$('#output').value='';updateCounts()}

$('#process').onclick=doProcess;$('#paste').onclick=doPaste;$('#copyResult').onclick=doCopy;$('#clearAll').onclick=clearAll;
$('#input').oninput=updateCounts;
</script>
</body>
</html>
