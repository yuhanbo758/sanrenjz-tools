<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环境变量管家</title>
<style>
:root{--bg:#f8f4ff;--panel:#fff;--text:#1e1245;--muted:#8b7aa8;--border:#e8dcf8;--accent:#7c3aed;--hover:#f3eefb;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.add-bar{display:flex;align-items:flex-end;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:4px}
.field:first-child{flex:1;min-width:0}
.field label{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:12px;font-family:monospace;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}
.add-bar button{padding:8px 18px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.add-bar button:hover{filter:brightness(1.1)}
.add-bar button:active{transform:scale(.97)}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:11px;color:var(--muted);flex-shrink:0}
.toolbar span{flex:1}
.toolbar button{padding:5px 10px;border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--text);font-size:11px;cursor:pointer;transition:all .15s}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.list-wrap{flex:1;overflow-y:auto;min-height:0}
.list-wrap::-webkit-scrollbar{width:5px}
.list-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.var-row{display:grid;grid-template-columns:1fr 2fr 80px;gap:0;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;font-size:12px}
.var-row:hover{background:var(--hover)}
.var-name{font-family:monospace;font-weight:600;color:var(--accent);overflow:hidden;text-overflow:ellipsis}
.var-value{font-family:monospace;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var-actions{display:flex;gap:4px;justify-content:flex-end}
.var-actions button{width:26px;height:26px;border:none;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.var-actions button:hover{background:var(--border);color:var(--accent)}
.var-actions button.del:hover{color:#ef4444}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px;color:var(--muted)}
.empty strong{font-size:14px;color:var(--text)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 16px;background:var(--text);color:#fff;border-radius:6px;font-size:12px;z-index:99;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="add-bar">
  <div class="field">
    <label>变量名</label>
    <input type="text" id="nameInput" placeholder="MY_VAR">
  </div>
  <div class="field">
    <label>变量值</label>
    <input type="text" id="valueInput" placeholder="变量值">
  </div>
  <button id="setBtn">设置</button>
</div>
<div class="toolbar">
  <span id="countLabel">0 个变量</span>
  <button id="refreshBtn">刷新</button>
  <button id="exportBtn">导出备份</button>
</div>
<div class="list-wrap" id="listWrap">
  <div class="empty">
    <strong>加载中...</strong>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const api = window.pluginAPI;
const nameInput = document.getElementById('nameInput');
const valueInput = document.getElementById('valueInput');
const setBtn = document.getElementById('setBtn');
const refreshBtn = document.getElementById('refreshBtn');
const exportBtn = document.getElementById('exportBtn');
const listWrap = document.getElementById('listWrap');
const countLabel = document.getElementById('countLabel');
let variables = [];

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

async function loadVariables() {
  try {
    const res = await api.runTask({ input: '', options: {}, execute: false });
    if (!res.ok) { listWrap.innerHTML = `<div class="empty"><strong>加载失败</strong><span>${res.error}</span></div>`; return; }
    variables = Array.isArray(res.result) ? res.result : [];
    countLabel.textContent = `${variables.length} 个变量`;
    if (!variables.length) {
      listWrap.innerHTML = '<div class="empty"><strong>无用户环境变量</strong><span>使用上方表单添加变量</span></div>';
      return;
    }
    listWrap.innerHTML = variables.map(v => {
      const key = v.Key || '';
      const val = v.Value || '';
      return `<div class="var-row" onclick="editVar('${key.replace(/'/g, "\\'")}','${val.replace(/'/g, "\\'").replace(/\n/g,'\\n')}')">
        <span class="var-name">${key}</span>
        <span class="var-value" title="${val}">${val}</span>
        <span class="var-actions">
          <button class="del" onclick="event.stopPropagation();deleteVar('${key.replace(/'/g, "\\'")}')" title="删除">&times;</button>
        </span>
      </div>`;
    }).join('');
  } catch (e) {
    listWrap.innerHTML = `<div class="empty"><strong>加载失败</strong><span>${e.message}</span></div>`;
  }
}

function editVar(name, value) {
  nameInput.value = name;
  valueInput.value = value;
}

async function deleteVar(name) {
  try {
    await api.runTask({ input: '', options: { name, value: '' }, execute: true });
    showToast(`已删除 ${name}`);
    loadVariables();
  } catch (e) { showToast('删除失败: ' + e.message); }
}

setBtn.addEventListener('click', async () => {
  const name = nameInput.value.trim();
  const value = valueInput.value;
  if (!name) { showToast('请输入变量名'); return; }
  try {
    await api.runTask({ input: '', options: { name, value }, execute: true });
    showToast(`已设置 ${name}`);
    nameInput.value = '';
    valueInput.value = '';
    loadVariables();
  } catch (e) { showToast('设置失败: ' + e.message); }
});

refreshBtn.addEventListener('click', loadVariables);
exportBtn.addEventListener('click', () => {
  const text = variables.map(v => `${v.Key}=${v.Value}`).join('\n');
  api.copyText(text);
  showToast('已复制变量列表到剪贴板');
});

loadVariables();
</script>
</body>
</html>
