<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磁盘空间分析</title>
<style>
:root{--bg:#0a1628;--panel:#0f2240;--text:#e2e8f0;--muted:#64748b;--border:#1a3050;--accent:#0ea5e9;--accent2:#06b6d4;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-top:32px!important;display:flex;flex-direction:column}
.custom-title-bar{background:var(--bg)!important;border-bottom:1px solid var(--border)!important}
.selector-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.selector-bar input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;font-family:"Cascadia Code","Consolas",monospace;outline:none}
.selector-bar input:focus{border-color:var(--accent)}
.selector-bar button{padding:8px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s}
.selector-bar button:hover{filter:brightness(1.1)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;flex-shrink:0}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-card .value{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-.5px}
.stat-card .label{font-size:11px;color:var(--muted);margin-top:4px}
.content-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:1px;min-height:0;overflow:hidden}
.section{display:flex;flex-direction:column;overflow:hidden;padding:0 12px}
.section-title{font-size:12px;font-weight:700;color:var(--accent2);padding:8px 4px;flex-shrink:0;letter-spacing:.5px;text-transform:uppercase}
.bar-list{flex:1;overflow-y:auto;min-height:0}
.bar-list::-webkit-scrollbar{width:4px}
.bar-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bar-item{display:flex;align-items:center;gap:8px;padding:4px 4px;font-size:11px}
.bar-item .ext{width:48px;text-align:right;flex-shrink:0;color:var(--text);font-family:monospace;overflow:hidden;text-overflow:ellipsis}
.bar-item .bar-track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar-item .bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.bar-item .size{width:56px;text-align:right;flex-shrink:0;color:var(--muted);font-family:monospace;font-size:10px}
.file-list{flex:1;overflow-y:auto;min-height:0}
.file-list::-webkit-scrollbar{width:4px}
.file-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.file-row{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:11px;cursor:pointer;border-radius:4px;transition:background .15s}
.file-row:hover{background:var(--panel)}
.file-row .rank{width:20px;text-align:center;flex-shrink:0;color:var(--muted);font-size:10px}
.file-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.file-row .file-size{flex-shrink:0;color:var(--accent);font-family:monospace;font-size:10px}
</style>
</head>
<body>
<div class="selector-bar">
  <input type="text" id="dirInput" placeholder="选择需要分析的目录..." readonly>
  <button id="browseBtn">浏览</button>
  <button id="analyzeBtn">分析</button>
</div>
<div class="stats-row">
  <div class="stat-card">
    <div class="value" id="totalSize">--</div>
    <div class="label">总大小</div>
  </div>
  <div class="stat-card">
    <div class="value" id="fileCount">--</div>
    <div class="label">文件数量</div>
  </div>
  <div class="stat-card">
    <div class="value" id="avgSize">--</div>
    <div class="label">平均大小</div>
  </div>
</div>
<div class="content-grid">
  <div class="section">
    <div class="section-title">文件类型分布</div>
    <div class="bar-list" id="typeBars"></div>
  </div>
  <div class="section">
    <div class="section-title">最大文件</div>
    <div class="file-list" id="largestFiles"></div>
  </div>
</div>
<script>
const api = window.pluginAPI;
const dirInput = document.getElementById('dirInput');
const browseBtn = document.getElementById('browseBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const totalSize = document.getElementById('totalSize');
const fileCount = document.getElementById('fileCount');
const avgSize = document.getElementById('avgSize');
const typeBars = document.getElementById('typeBars');
const largestFiles = document.getElementById('largestFiles');

function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return '--';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(2) + ' GB';
}

browseBtn.addEventListener('click', () => {
  const dir = api.selectDirectory('选择分析目录');
  if (dir) dirInput.value = dir;
});

analyzeBtn.addEventListener('click', async () => {
  const dir = dirInput.value.trim();
  if (!dir) return;
  totalSize.textContent = '分析中...';
  fileCount.textContent = '...';
  avgSize.textContent = '...';
  try {
    const res = await api.runTask({ input: '', options: { directory: dir }, execute: false });
    if (!res.ok) { totalSize.textContent = '错误'; return; }
    const d = res.result;
    totalSize.textContent = formatBytes(d.totalBytes);
    fileCount.textContent = (d.fileCount || 0).toLocaleString();
    avgSize.textContent = d.fileCount ? formatBytes(d.totalBytes / d.fileCount) : '--';

    const extEntries = Object.entries(d.extensionBytes || {}).sort((a, b) => b[1] - a[1]).slice(0, 20);
    const maxExt = extEntries.length ? extEntries[0][1] : 1;
    typeBars.innerHTML = extEntries.map(([ext, size]) => {
      const pct = (size / maxExt * 100).toFixed(0);
      return `<div class="bar-item"><span class="ext">${ext}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="size">${formatBytes(size)}</span></div>`;
    }).join('') || '<div style="padding:8px;color:var(--muted);font-size:11px">无数据</div>';

    const files = (d.largestFiles || []).slice(0, 50);
    largestFiles.innerHTML = files.map((f, i) => {
      return `<div class="file-row" onclick="api.showPath('${(f.path || '').replace(/'/g, "\\'")}')" title="${f.path || ''}">
        <span class="rank">${i + 1}</span>
        <span class="name">${f.path || f.name || ''}</span>
        <span class="file-size">${formatBytes(f.size)}</span>
      </div>`;
    }).join('') || '<div style="padding:8px;color:var(--muted);font-size:11px">无数据</div>';
  } catch (e) {
    totalSize.textContent = '失败';
  }
});
</script>
</body>
</html>
