<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片拼图</title>
<style>:root{--bg:#18152a;--panel:#201b33;--surface:#130f20;--text:#e8e0f0;--muted:#9888b8;--border:#332a4a;--accent:#8b5cf6;--accent2:#a78bfa;--r:10px}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body::before{content:'';position:fixed;top:0;left:0;right:0;height:32px;z-index:99;background:var(--panel);-webkit-app-region:drag}.custom-title-bar{background:var(--panel)!important;color:var(--muted)!important;font-size:11px!important;border-bottom:1px solid var(--border)!important}button,input,select{-webkit-app-region:no-drag;font:inherit;color:inherit}button{cursor:pointer;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;transition:all .18s}button:active{transform:scale(.96)}.app{display:flex;height:calc(100vh - 32px);padding:16px;gap:14px;overflow:hidden}.sidebar{width:255px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}.sidebar h1{font-size:20px;margin:0;color:var(--accent);font-weight:800;letter-spacing:-.3px}.pick-btn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:var(--r);background:var(--surface);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}.pick-btn:hover{border-color:var(--accent);background:var(--panel)}.thumb-list{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow-y:auto;padding:4px}.thumb-list .thumb{width:56px;height:56px;border-radius:8px;border:2px solid var(--border);overflow:hidden;position:relative;cursor:pointer}.thumb-list .thumb img{width:100%;height:100%;object-fit:cover}.thumb-list .thumb .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1;opacity:0;transition:opacity .15s}.thumb-list .thumb:hover .del{opacity:1}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}.card h3{font-size:12px;font-weight:700;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.card label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.card select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;outline:none}.card input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:var(--surface);outline:none}.card input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer}.card .range-row{display:flex;align-items:center;gap:8px}.card .range-row .val{min-width:28px;text-align:right;font-size:12px;color:var(--accent);font-weight:700}.card .color-row{display:flex;align-items:center;gap:8px}.card .color-row input[type=color]{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}.card .color-row span{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:auto}.actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}.actions .gen{background:var(--accent);color:#fff}.actions .gen:hover{background:var(--accent2);box-shadow:0 4px 14px rgba(139,92,246,.3)}.actions .save{background:var(--surface);color:var(--accent);border:1px solid var(--border)}.actions .save:hover{background:var(--accent);color:#fff}.preview-area{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden}.preview-area canvas,.preview-area img{max-width:100%;max-height:100%;object-fit:contain}.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);opacity:.35}.empty svg{width:56px;height:56px}.saved{color:#22c55e;font-size:12px;font-weight:600;margin-left:6px}</style></head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>图片拼图</h1>
    <button class="pick-btn" id="pickBtn">添加图片</button>
    <div class="thumb-list" id="thumbList"></div>
    <div class="card">
      <h3>拼图参数</h3>
      <label>排列方向<select id="direction"><option value="horizontal">水平</option><option value="vertical">垂直</option><option value="grid">网格</option></select></label>
      <label>间距 <div class="range-row"><input type="range" id="gap" min="0" max="60" value="12"><span class="val" id="gapVal">12</span></div></label>
      <label>背景色 <div class="color-row"><input type="color" id="bgColor" value="#18152a"><span id="bgLabel">#18152a</span></div></label>
    </div>
    <div class="actions">
      <button class="gen" id="genBtn">生成拼图</button>
      <button class="save" id="saveBtn">导出</button>
      <span class="saved" id="savedLabel" hidden>已导出</span>
    </div>
  </div>
  <div class="preview-area" id="preview">
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1"/></svg><div>添加图片生成拼图</div></div>
  </div>
</div>
<script>
const api=window.pluginAPI,$=id=>document.getElementById(id);
let images=[],outDataUrl='';
$('gap').addEventListener('input',()=>$('gapVal').textContent=$('gap').value);
$('bgColor').addEventListener('input',()=>$('bgLabel').textContent=$('bgColor').value.toUpperCase());
function renderThumbs(){$('thumbList').innerHTML=images.map((d,i)=>`<div class="thumb"><img src="${d.dataUrl}"><div class="del" data-i="${i}">×</div></div>`).join('');$('thumbList').querySelectorAll('.del').forEach(d=>d.addEventListener('click',e=>{e.stopPropagation();images.splice(Number(d.dataset.i),1);renderThumbs()}))}
$('pickBtn').addEventListener('click',()=>{const f=api.selectFiles({title:'选择图片',multiple:true,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});f.forEach(fp=>images.push({dataUrl:api.readFileDataUrl(fp)}));renderThumbs()});
function generate(){if(!images.length)return;const dir=$('direction').value,gap=Number($('gap').value),bg=$('bgColor').value;Promise.all(images.map(d=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=d.dataUrl}))).then(imgs=>{let cw,ch,dimgs=imgs;if(dir==='horizontal'){cw=imgs.reduce((s,i)=>s+i.width,0)+gap*(imgs.length-1);ch=Math.max(...imgs.map(i=>i.height))}else if(dir==='vertical'){cw=Math.max(...imgs.map(i=>i.width));ch=imgs.reduce((s,i)=>s+i.height,0)+gap*(imgs.length-1)}else{const cols=Math.ceil(Math.sqrt(imgs.length));const rows=Math.ceil(imgs.length/cols);const maxW=Math.max(...imgs.map(i=>i.width));const maxH=Math.max(...imgs.map(i=>i.height));cw=maxW*cols+gap*(cols-1);ch=maxH*rows+gap*(rows-1);dimgs=imgs.map(i=>{const n=new Image();n.width=maxW;n.height=maxH;return n})}const c=document.createElement('canvas');c.width=cw;c.height=ch;const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);let x=0,y=0;if(dir==='horizontal'){let ox=0;imgs.forEach((i,j)=>{ctx.drawImage(i,ox,(ch-i.height)/2);ox+=i.width+gap})}else if(dir==='vertical'){let oy=0;imgs.forEach((i,j)=>{ctx.drawImage(i,(cw-i.width)/2,oy);oy+=i.height+gap})}else{const cols=Math.ceil(Math.sqrt(imgs.length));const maxW=Math.max(...imgs.map(i=>i.width));const maxH=Math.max(...imgs.map(i=>i.height));imgs.forEach((i,j)=>{const col=j%cols,row=Math.floor(j/cols);ctx.drawImage(i,col*(maxW+gap)+(maxW-i.width)/2,row*(maxH+gap)+(maxH-i.height)/2)})}outDataUrl=c.toDataURL();$('preview').innerHTML='';const el=document.createElement('img');el.src=outDataUrl;$('preview').appendChild(el)})}
$('genBtn').addEventListener('click',generate);
$('saveBtn').addEventListener('click',()=>{if(!outDataUrl)return;const r=api.saveResult({dataUrl:outDataUrl,defaultPath:'collage.png',title:'保存拼图',filters:[{name:'PNG',extensions:['png']},{name:'JPEG',extensions:['jpg']}]});if(!r.cancelled){$('savedLabel').hidden=0;setTimeout(()=>$('savedLabel').hidden=1,2000)}});
</script></body></html>
