<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件校验器</title>
<style>
:root{--bg:#f0f9ff;--panel:#fff;--surface:#e0f2fe;--text:#0f3b5c;--muted:#5b84a3;--border:#bae6fd;--accent:#0284c7;--accent2:#38bdf8;--radius:10px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
.top .btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s}
.top .btn:hover{background:var(--surface)}
.top .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.top .btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.list{flex:1;overflow-y:auto;padding:4px 0}
.list .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);transition:background .1s}
.list .row:hover{background:var(--surface)}
.list .row .file{display:flex;flex-direction:column;gap:1px;min-width:0}
.list .row .file .name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .row .file .full{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"SF Mono","Cascadia Code","Consolas",monospace}
.list .row .hash{font-size:11px;font-family:"SF Mono","Cascadia Code","Consolas",monospace;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .row .copy{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;color:var(--muted)}
.list .row .copy:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.list .row .copy.copied{background:#16a34a;color:#fff;border-color:#16a34a}
.list .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
.list .empty strong{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.stat{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
.stat .cnt{font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">&#128274;</div>
    <h1>文件校验器</h1>
    <button class="btn" id="pickFiles">选择文件</button>
    <button class="btn primary" id="compute">计算 SHA-256</button>
    <button class="btn" id="clearAll">清空</button>
  </div>
  <div class="list" id="list">
    <div class="empty"><strong>选择文件计算哈希值</strong>生成 SHA-256 校验清单，可逐项复制</div>
  </div>
  <div class="stat"><span id="statText"></span><span class="cnt" id="statCount"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const API=window.pluginAPI;
let fileList=[],results=[];

async function pickFiles(){const f=await API.selectFiles({title:'选择要校验的文件'});if(f.length){fileList=[...new Set([...fileList,...f])];renderList()}}
function clearAll(){fileList=[];results=[];renderList()}
function renderList(){const el=$('#list');if(!fileList.length){el.innerHTML='<div class="empty"><strong>选择文件计算哈希值</strong>生成 SHA-256 校验清单，可逐项复制</div>';$('#statCount').textContent='';$('#statText').textContent='';return}
  el.innerHTML=fileList.map((f,i)=>{const r=results.find(x=>x.file===f);const name=f.split(/[\\/]/).pop();return`<div class="row"><div class="file"><span class="name">${name}</span><span class="full" title="${f}">${f}</span></div><span class="hash">${r?r.sha256:'计算中...'}</span><button class="copy" data-idx="${i}" title="复制哈希">&#128203;</button></div>`}).join('');
  $('#statCount').textContent=fileList.length+' 个文件';
  el.querySelectorAll('.copy').forEach(b=>b.onclick=function(){const i=+this.dataset.idx;const r=results.find(x=>x.file===fileList[i]);if(r){API.copyText(r.sha256);this.classList.add('copied');this.textContent='\u2713';setTimeout(()=>{this.classList.remove('copied');this.textContent='\uD83D\uDCCB'},1500)}})
}
async function doCompute(){if(!fileList.length)return;$('#statText').textContent='计算中...';const r=await API.runTask({options:{files:fileList}});if(r.ok){results=r.result;renderList();$('#statText').textContent='计算完成'}else{$('#statText').textContent=r.error}}

$('#pickFiles').onclick=pickFiles;$('#clearAll').onclick=clearAll;$('#compute').onclick=doCompute;
</script>
</body>
</html>
