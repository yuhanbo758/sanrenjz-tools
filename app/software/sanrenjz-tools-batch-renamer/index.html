<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量重命名</title>
<style>
:root{--bg:#fef7ed;--panel:#fffdf7;--surface:#fef0d9;--text:#3b2f1a;--muted:#8b7348;--border:#e8d5a8;--accent:#b45309;--accent2:#f59e0b;--ok:#16a34a;--warn:#d97706;--radius:10px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{height:calc(100vh - 32px);display:grid;grid-template-rows:auto 1fr auto;gap:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px 6px;border-bottom:1px solid var(--border);background:var(--panel)}
.topbar .icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .dir{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.topbar .dir input{flex:1;min-width:0;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;color:var(--text);outline:none}
.topbar .dir input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.topbar .btn{white-space:nowrap;padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.topbar .btn:hover{background:var(--border)}
.topbar .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar .btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.controls .field{display:flex;align-items:center;gap:4px;font-size:11px}
.controls .field label{color:var(--muted);white-space:nowrap;font-weight:500}
.controls .field input,.controls .field select{padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);font-size:11px;outline:none;width:90px}
.controls .field input:focus,.controls .field select:focus{border-color:var(--accent)}
.controls .check{display:flex;align-items:center;gap:3px;font-size:11px;cursor:pointer;user-select:none}
.controls .check input{accent-color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:6px 0}
.list .row{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;padding:6px 14px;font-size:12px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);transition:background .1s}
.list .row:hover{background:var(--surface)}
.list .row input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);margin:0;cursor:pointer}
.list .row .old{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"SF Mono","Cascadia Code","Consolas",monospace}
.list .row .new{color:var(--ok);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"SF Mono","Cascadia Code","Consolas",monospace}
.list .row .new.changed{color:var(--text);font-weight:500}
.list .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.list .empty strong{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
.statusbar .count{font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="icon">&#8634;</div>
    <h1>批量重命名</h1>
    <div class="dir">
      <input type="text" id="dirPath" placeholder="选择目录..." readonly>
      <button class="btn" id="pickDir">浏览</button>
    </div>
    <button class="btn primary" id="preview">预览</button>
    <button class="btn primary" id="execute" style="background:var(--ok);border-color:var(--ok)">执行重命名</button>
  </div>
  <div class="controls">
    <div class="field"><label>查找</label><input type="text" id="find" placeholder="文本或正则"></div>
    <div class="field"><label>替换为</label><input type="text" id="replace" placeholder="替换文本"></div>
    <div class="check"><input type="checkbox" id="regex"><label>正则</label></div>
    <div class="field"><label>前缀</label><input type="text" id="prefix" placeholder="前缀"></div>
    <div class="field"><label>后缀</label><input type="text" id="suffix" placeholder="后缀"></div>
    <div class="check"><input type="checkbox" id="useNum"><label>编号</label></div>
    <div class="field"><label>起始</label><input type="number" id="start" value="1" style="width:52px"></div>
    <div class="field"><label>位数</label><input type="number" id="padding" value="2" style="width:44px" min="1" max="6"></div>
  </div>
  <div class="list" id="fileList">
    <div class="empty"><strong>选择目录后预览</strong>将显示文件原名与新名称对照</div>
  </div>
  <div class="statusbar"><span id="statusText"></span><span class="count" id="statusCount"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const API=window.pluginAPI;
let renamePlan=[];
let selectedDir='';

async function loadDir(){const d=await API.selectDirectory('选择批量重命名目录');if(d){$('#dirPath').value=d;selectedDir=d}}
async function doPreview(){if(!selectedDir)return;const r=await API.runTask({options:{directory:selectedDir,find:$('#find').value,replace:$('#replace').value,regex:$('#regex').checked,prefix:$('#prefix').value,suffix:$('#suffix').value,number:$('#useNum').checked,start:$('#start').value||1,padding:$('#padding').value||2}});if(r.ok){renamePlan=r.result;renderList()}else{$('#statusText').textContent=r.error}}
function renderList(){const el=$('#fileList');if(!renamePlan.length){el.innerHTML='<div class="empty"><strong>无文件需要重命名</strong>当前规则下所有文件名称无变化</div>';$('#statusCount').textContent='0 项';return}el.innerHTML=renamePlan.map((p,i)=>`<div class="row"><input type="checkbox" checked data-idx="${i}"><span class="old" title="${p.before}">${p.before}</span><span class="new changed" title="${p.after}">${p.after}</span></div>`).join('');$('#statusCount').textContent=renamePlan.length+' 项';$('#statusText').textContent=''}
async function doExecute(){const checked=[...$('#fileList').querySelectorAll('input:checked')].map(c=>+c.dataset.idx);if(!checked.length){$('#statusText').textContent='未选中任何文件';return}const files=checked.map(i=>renamePlan[i].from);const r=await API.runTask({options:{directory:selectedDir,find:$('#find').value,replace:$('#replace').value,regex:$('#regex').checked,prefix:$('#prefix').value,suffix:$('#suffix').value,number:$('#useNum').checked,start:$('#start').value||1,padding:$('#padding').value||2},execute:true});if(r.ok){$('#statusText').textContent='重命名完成';renamePlan=[];renderList();doPreview()}else{$('#statusText').textContent=r.error}}

$('#pickDir').onclick=loadDir;
$('#preview').onclick=doPreview;
$('#execute').onclick=doExecute;
$('#dirPath').onclick=loadDir;
</script>
</body>
</html>
