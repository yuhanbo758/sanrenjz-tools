<!DOCTYPE html>
<html lang="zh-CN" data-layout="prompt-layers">
<head data-business>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 提示词工坊</title>
<style>
:root{--a:#4f46e5;--a2:#6366f1;--as:rgba(79,70,229,.1);--al:rgba(79,70,229,.3);--bg:#f5f6fe;--sf:#fff;--s2:#e8eafc;--bd:#d4d8f5;--ink:#1a1a3a;--mt:#5a5b80;--ft:#9a9bc0;--ok:#16a34a;--err:#dc2626;--mono:'JetBrains Mono',Consolas,monospace;--sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--sf);border-bottom:1px solid var(--bd);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;flex:none}.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}.head p{margin:0;color:var(--mt);font-size:12px}
.spacer{flex:1}.gear{border:1px solid var(--bd);background:var(--sf);color:var(--a);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}.gear svg{width:14px;height:14px}
.body{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 1fr;gap:0;overflow:hidden}
.lib{background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.lib-h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex:none}
.lib-h h2{margin:0;font-size:14px}.lib-h button{border:0;background:var(--a);color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.lib-list{flex:1;overflow:auto;padding:6px}
.lib-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:4px;border:1px solid transparent}
.lib-item:hover{background:var(--s2)}.lib-item.active{background:var(--as);border-color:var(--al)}
.lib-item .lt{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .lm{font:11px var(--mono);color:var(--ft);margin-top:3px}
.editor{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bd);background:var(--sf)}
.ed-h{padding:12px 16px;border-bottom:1px solid var(--bd);flex:none}
.ed-h input{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:600 14px var(--sans);outline:none}.ed-h input:focus{border-color:var(--al)}
.ed-body{flex:1;min-height:0;border:0;outline:0;resize:none;padding:16px;font:14px/1.7 var(--mono);background:var(--sf)}.ed-body::placeholder{color:var(--ft)}
.ed-foot{padding:10px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap}
.var-tag{display:inline-flex;align-items:center;gap:4px;background:var(--as);color:var(--a);border-radius:6px;padding:3px 8px;font:12px var(--mono)}
.preview{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--sf)}
.pv-h{padding:12px 16px;border-bottom:1px solid var(--bd);font:600 14px var(--sans);flex:none;display:flex;justify-content:space-between;align-items:center}
.pv-out{flex:1;overflow:auto;padding:16px;font:14px/1.7 var(--sans);white-space:pre-wrap;word-break:break-word}
.pv-out.empty{display:flex;align-items:center;justify-content:center;color:var(--ft);font-style:italic}
.act-bar{padding:12px 24px;border-top:1px solid var(--bd);background:var(--sf);display:flex;gap:10px;align-items:center;flex:none}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:6px}.btn:hover{border-color:var(--al)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent}.btn.primary:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5}
.stat{font:12px var(--mono);color:var(--mt)}
.drawer{position:fixed;top:32px;right:0;bottom:0;width:min(420px,92vw);background:var(--sf);box-shadow:-12px 0 40px rgba(0,0,0,.1);z-index:50;transform:translateX(100%);transition:.25s;overflow:auto;padding:24px}.drawer.open{transform:translateX(0)}.drawer h2{margin:0 0 16px;font-size:16px}.drawer .close{position:absolute;top:16px;right:16px;border:0;background:transparent;font-size:20px;color:var(--ft);cursor:pointer}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:var(--mt);font-weight:600;margin-bottom:6px}.field input{width:100%;border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font:14px var(--sans);outline:none;background:var(--s2);color:var(--ink)}.field input:focus{border-color:var(--al)}
.overlay{position:fixed;inset:32px 0 0 0;background:rgba(0,0,0,.3);z-index:40;display:none}.overlay.show{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a3a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c8ccf0;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/><path d="M18 13V8M18 19v3"/></svg></div>
    <div><h1>AI 提示词工坊</h1><p>管理变量模板、优化提示词、比较版本和模型输出</p></div>
    <div class="spacer"></div>
    <button class="gear" onclick="toggleDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 1-.1 1.2l2 1.5-2 3.4-2.3-1a7 7 0 0 1-2 1.2l-.4 2.5H9l-.4-2.5a7 7 0 0 1-2-1.2l-2.3 1-2-3.4 2-1.5A7 7 0 0 1 4 12a7 7 0 0 1 .1-1.2l-2-1.5 2-3.4 2.3 1a7 7 0 0 1 2-1.2L9 1h4l.4 2.5a7 7 0 0 1 2 1.2l2.3-1 2 3.4-2 1.5A7 7 0 0 1 19 12z"/></svg>供应商设置</button>
  </div>
  <div class="body">
    <aside class="lib">
      <div class="lib-h"><h2>提示词库</h2><button onclick="newPrompt()">+</button></div>
      <div class="lib-list" id="libList"></div>
    </aside>
    <div class="editor">
      <div class="ed-h"><input id="pTitle" placeholder="提示词标题" oninput="scheduleSave()"></div>
      <textarea class="ed-body" id="pBody" spellcheck="false" placeholder="编写提示词模板，用 {{变量}} 标记可替换变量&#10;例如：请将以下{{language}}代码翻译为{{target}}：&#10;{{code}}" oninput="onEdit()"></textarea>
      <div class="ed-foot" id="varList"><span style="color:var(--ft);font-size:12px">变量将自动识别</span></div>
    </div>
    <div class="preview">
      <div class="pv-h">优化预览 <span class="stat" id="pvStat">等待</span></div>
      <div class="pv-out empty" id="pvOut">编辑提示词后点击「优化」</div>
    </div>
  </div>
  <div class="act-bar">
    <button class="btn primary" id="optBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>优化提示词</button>
    <button class="btn" id="stopBtn" disabled>取消</button>
    <button class="btn" id="copyBtn">复制</button>
    <div class="spacer"></div>
    <span class="stat" id="saveStat"></span>
  </div>
</main>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<aside class="drawer" id="drawer"><button class="close" onclick="toggleDrawer()">×</button><h2>统一供应商配置</h2>
  <div class="field"><label>服务名称</label><input id="pName" value="OpenAI 兼容服务"></div>
  <div class="field"><label>Base URL</label><input id="pUrl" value="https://api.openai.com/v1"></div>
  <div class="field"><label>模型 ID</label><input id="pModel" value="gpt-4o-mini"></div>
  <div class="field"><label>API Key</label><input id="pKey" type="password" placeholder="仅保存到系统安全存储"></div>
  <button class="btn primary" style="width:100%;justify-content:center" onclick="saveProvider()">保存并共享</button>
</aside>
<div class="toast" id="toast"></div>
<script src="../../plugin_runtime/ai-provider-manager.js"></script>
<script>
const api=window.aiAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let prompts=[];let activeId=null;let requestId='';let saveTimer=null;
const providerManager=AIProviderManager.create(api,{capability:'text',notify:toast});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function toggleDrawer(){$('#drawer').classList.toggle('open');$('#overlay').classList.toggle('show');}
async function loadPrompts(){prompts=await api.storage.get('prompt-library')||[];if(!prompts.length){prompts=[{id:Date.now(),title:'代码翻译',body:'请将以下{{language}}代码翻译为{{target}}语言，保持功能不变：\n\n```\n{{code}}\n```'}];await api.storage.set('prompt-library',prompts);}renderLib();selectPrompt(prompts[0].id);}
function renderLib(){$('#libList').innerHTML=prompts.map(p=>`<div class="lib-item${p.id===activeId?' active':''}" data-id="${p.id}"><div class="lt">${esc(p.title||'未命名')}</div><div class="lm">${new Date(p.id).toLocaleDateString('zh-CN')}</div></div>`).join('')+'<div class="lib-item" onclick="delPrompt()" style="color:var(--err);font-size:12px">删除当前</div>';$$('#libList [data-id]').forEach(el=>el.onclick=()=>selectPrompt(+el.dataset.id));}
function selectPrompt(id){activeId=id;const p=prompts.find(x=>x.id===id);if(!p)return;$('#pTitle').value=p.title;$('#pBody').value=p.body;renderLib();onEdit();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function onEdit(){detectVars();scheduleSave();}
function detectVars(){const body=$('#pBody').value;const vars=[...body.matchAll(/\{\{(\w+)\}\}/g)].map(m=>m[1]);const unique=[...new Set(vars)];$('#varList').innerHTML=unique.length?unique.map(v=>`<span class="var-tag">{{${v}}}</span>`).join(''):'<span style="color:var(--ft);font-size:12px">无变量</span>';}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const p=prompts.find(x=>x.id===activeId);if(p){p.title=$('#pTitle').value;p.body=$('#pBody').value;await api.storage.set('prompt-library',prompts);$('#saveStat').textContent='已保存';setTimeout(()=>$('#saveStat').textContent='',2000);renderLib();}},400);}
function newPrompt(){const p={id:Date.now(),title:'新提示词',body:''};prompts.unshift(p);api.storage.set('prompt-library',prompts);selectPrompt(p.id);$('#pTitle').focus();}
function delPrompt(){if(!activeId)return;prompts=prompts.filter(p=>p.id!==activeId);api.storage.set('prompt-library',prompts);if(prompts.length)selectPrompt(prompts[0].id);else{$('#pTitle').value='';$('#pBody').value='';}renderLib();}
api.onChunk(chunk=>{if(chunk.requestId===requestId){$('#pvOut').classList.remove('empty');$('#pvOut').textContent=chunk.text;}});
$('#optBtn').onclick=async()=>{
  const body=$('#pBody').value.trim();if(!body){toast('请输入提示词');return;}
  requestId=crypto.randomUUID();$('#optBtn').disabled=true;$('#stopBtn').disabled=false;$('#pvStat').textContent='优化中…';
  $('#pvOut').classList.remove('empty');$('#pvOut').textContent='';
  try{const r=await api.complete({requestId,capability:'text',selection:await providerManager.getSelection(),stream:true,messages:[{role:'user',content:'请优化以下提示词，使其更清晰、更有效。保持变量标记不变。输出优化后的完整提示词和简要说明：\n\n'+body}]});$('#pvStat').textContent='已完成';}
  catch(e){$('#pvOut').textContent=e.message;$('#pvStat').textContent=e.message==='请求已取消'?'已取消':'失败';}
  finally{$('#optBtn').disabled=false;$('#stopBtn').disabled=true;}
};
$('#stopBtn').onclick=()=>{if(requestId){api.cancel(requestId);$('#optBtn').disabled=false;$('#stopBtn').disabled=true;$('#pvStat').textContent='已取消';}};
$('#copyBtn').onclick=()=>{const t=$('#pvOut').textContent;if(t&&t!=='编辑提示词后点击「优化」'){navigator.clipboard.writeText(t);toast('已复制');}else toast('暂无结果');};
loadPrompts();
window.addEventListener('plugin-enter',e=>{const text=e.detail?.payload||e.detail?.clipboardText||'';if(text){$('#pBody').value=text;onEdit();}});
</script>
</body></html>
