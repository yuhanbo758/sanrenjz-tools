<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片格式转换</title>
<style>:root{--bg:#ecfeff;--panel:#fff;--surface:#e0f7fa;--text:#0c4a6e;--muted:#0e7490;--border:#cffafe;--accent:#0891b2;--accent2:#06b6d4;--r:12px}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding-top:32px;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{display:flex;flex-direction:column;height:calc(100vh - 32px);padding:20px;gap:14px;overflow:hidden}.header{display:flex;align-items:center;gap:14px;flex-shrink:0}.header h1{font-size:22px;margin:0;color:var(--accent);font-weight:800;letter-spacing:-.5px}.header h1 span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}.drop-zone{flex-shrink:0;border:2px dashed var(--border);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--panel)}.drop-zone:hover{border-color:var(--accent);background:var(--surface)}.drop-zone.drag{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px rgba(8,145,178,.1)}.drop-zone .icon{font-size:36px;margin-bottom:6px}.drop-zone .label{color:var(--accent);font-weight:600;font-size:14px}.drop-zone .hint{color:var(--muted);font-size:12px;margin-top:2px}.drop-zone .file-name{color:var(--text);font-size:13px;font-weight:600;margin-top:6px;word-break:break-all}.controls{display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}.controls .fmt-group{display:flex;gap:2px;background:var(--surface);border-radius:var(--r);padding:3px;border:1px solid var(--border)}.controls .fmt-btn{border:none;background:none;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}.controls .fmt-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(8,145,178,.25)}.controls .save-btn{border:none;background:var(--accent);color:#fff;padding:9px 22px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;margin-left:auto;transition:all .15s}.controls .save-btn:hover{background:var(--accent2);box-shadow:0 4px 14px rgba(8,145,178,.3)}.preview{flex:1;min-height:0;background:var(--panel);border-radius:var(--r);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview img,.preview canvas{max-width:100%;max-height:100%;border-radius:6px;object-fit:contain}.preview .info-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;font-variant-numeric:tabular-nums;display:flex;gap:16px;backdrop-filter:blur(8px)}.empty-state{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);opacity:.4}.empty-state svg{width:64px;height:64px}.saved{color:#059669;font-size:12px;font-weight:600;animation:pop .3s}@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.1)}100%{transform:scale(1)}}</style></head>
<body>
<div class="app">
  <div class="header"><h1>格式转换<span>图片格式随心换</span></h1></div>
  <div class="drop-zone" id="dropZone">
    <div class="icon">&#128444;</div>
    <div class="label">拖放图片到此处</div>
    <div class="hint">或点击选择 PNG / JPEG / WebP / BMP</div>
    <div class="file-name" id="fileName" hidden></div>
  </div>
  <div class="controls">
    <div class="fmt-group">
      <button class="fmt-btn active" data-fmt="image/png">PNG</button>
      <button class="fmt-btn" data-fmt="image/jpeg">JPEG</button>
      <button class="fmt-btn" data-fmt="image/webp">WebP</button>
    </div>
    <button class="save-btn" id="saveBtn">导出图片</button>
    <span class="saved" id="savedLabel" hidden>已导出</span>
  </div>
  <div class="preview" id="preview">
    <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m2 17 6-6 4 4 4-6 6 8"/></svg><div style="font-size:14px">拖入图片即显示预览</div></div>
    <div class="info-bar" id="infoBar" hidden></div>
  </div>
</div>
<script>
const api=window.pluginAPI,$=id=>document.getElementById(id);
let srcDataUrl='',srcBytes=0,srcFile='',outBlob=null,targetFmt='image/png';
function fmtBytes(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function convert(){if(!srcDataUrl)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(blob=>{outBlob=blob;$('preview').querySelector('img')?.remove();const el=document.createElement('img');el.src=URL.createObjectURL(blob);el.style.maxWidth='100%';el.style.maxHeight='100%';$('preview').appendChild(el);$('infoBar').hidden=0;$('infoBar').innerHTML=`<span>${img.width}&times;${img.height}</span><span>${fmtBytes(blob.size)}</span>`},targetFmt)};img.src=srcDataUrl}
function loadFile(fp){srcFile=fp;srcDataUrl=api.readFileDataUrl(fp);const img=new Image();img.onload=()=>{$('preview').innerHTML='';$('preview').appendChild($('infoBar'));img.style.maxWidth='100%';img.style.maxHeight='100%';$('preview').appendChild(img);$('infoBar').hidden=0;$('infoBar').innerHTML=`<span>${img.width}&times;${img.height}</span>`;convert()};img.src=srcDataUrl}
$('dropZone').addEventListener('click',()=>{const f=api.selectFiles({title:'选择图片',multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});if(f.length)loadFile(f[0])});
$('dropZone').addEventListener('dragover',e=>{e.preventDefault();$('dropZone').classList.add('drag')});
$('dropZone').addEventListener('dragleave',()=>$('dropZone').classList.remove('drag'));
$('dropZone').addEventListener('drop',e=>{e.preventDefault();$('dropZone').classList.remove('drag');const f=e.dataTransfer.files[0];if(f){$('fileName').textContent=f.name;$('fileName').hidden=0;loadFile(f.path)}});
document.querySelectorAll('.fmt-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.fmt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');targetFmt=b.dataset.fmt;convert()}));
$('saveBtn').addEventListener('click',()=>{if(!outBlob)return;const r=new FileReader();r.onload=()=>{const ext={['image/png']:'.png',['image/jpeg']:'.jpg',['image/webp']:'.webp'}[targetFmt];const s=api.saveResult({dataUrl:r.result,defaultPath:'converted'+ext,title:'保存转换结果',filters:[{name:'图片',extensions:[ext.replace('.','')]}]});if(!s.cancelled){$('savedLabel').hidden=0;setTimeout(()=>$('savedLabel').hidden=1,2000)}};r.readAsDataURL(outBlob)});
</script></body></html>
