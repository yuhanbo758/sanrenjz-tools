<!DOCTYPE html>
<html lang="zh-CN" data-layout="image-stage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片优化器</title>
<style>
:root{
  --accent:#d63384;--accent-2:#e64980;--accent-soft:rgba(214,51,132,.1);--accent-line:rgba(214,51,132,.3);
  --bg:#fdf5fa;--surface:#fff;--surface-2:#fce8f1;--border:#f0d4e2;
  --ink:#2d0f1f;--muted:#7a526a;--faint:#a88098;
  --ok:#16a34a;--err:#dc2626;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;padding-top:32px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:18px;height:18px;color:#fff}
.head h1{margin:0;font-size:17px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.tabs{display:flex;gap:6px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:7px}
.tab svg{width:15px;height:15px}
.tab:hover{background:var(--surface-2)}.tab.active{background:var(--accent);color:#fff}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 320px;gap:0;overflow:hidden}
.stage{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:16px}
.drop-zone{flex:1;min-height:0;border:2px dashed var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:.15s;color:var(--faint);position:relative;overflow:hidden}
.drop-zone:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop-zone.has-img{border-style:solid;border-color:var(--border);padding:0;cursor:default}
.drop-zone.has-img:hover{background:transparent}
.drop-zone svg.dz{width:48px;height:48px;opacity:.35}
.preview-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.stage-info{flex:none;display:flex;gap:18px;padding:10px 4px;font:12px var(--mono);color:var(--muted)}
.stage-info .v{color:var(--ink);font-weight:600}
.side{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:auto}
.side-h{padding:16px 20px;border-bottom:1px solid var(--border);flex:none}
.side-h h2{margin:0 0 4px;font-size:15px;font-weight:700}
.side-h p{margin:0;font-size:12px;color:var(--muted)}
.opts{padding:18px 20px;flex:none}
.opt{margin-bottom:18px}
.opt label{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font:14px var(--mono);color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent-line)}
.sel{width:100%;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;outline:none}
.slider-row{display:flex;align-items:center;gap:10px}
.slider{flex:1;accent-color:var(--accent)}
.slider-val{font:600 13px var(--mono);color:var(--accent);min-width:48px;text-align:right}
.size-row{display:flex;gap:8px;align-items:center}
.size-row .inp{flex:1;text-align:center}
.size-row .x{color:var(--faint)}
.actions{padding:0 20px 20px;margin-top:auto;display:flex;flex-direction:column;gap:10px;flex:none}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent-line)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5}
.panel{display:none;flex-direction:column;gap:0;flex:1;min-height:0}
.panel.active{display:flex}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d0f1f;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e0bcd0;border-radius:4px}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div><h1>图片优化器</h1><p>批量调整质量、格式和尺寸，并即时比较体积</p></div>
    <div class="spacer"></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tool="image-compressor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14l3-3 4 4 5-5 4 4"/><path d="M4 20h16"/></svg>压缩</button>
    <button class="tab" data-tool="image-converter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M4 7l3-3M4 7l3 3M20 17h-10M20 17l-3-3M20 17l-3 3"/></svg>格式转换</button>
    <button class="tab" data-tool="image-resizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>缩放</button>
  </div>
  <div class="body">
    <div class="stage">
      <div class="drop-zone" id="dropZone">
        <svg class="dz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
        <div style="font-weight:600;color:var(--ink)">点击选择图片</div>
        <div style="font-size:12px">支持 PNG / JPG / WEBP / BMP</div>
      </div>
      <div class="stage-info">
        <span>尺寸: <span class="v" id="infoSize">-</span></span>
        <span>格式: <span class="v" id="infoFmt">-</span></span>
        <span>源文件: <span class="v" id="infoName">-</span></span>
      </div>
    </div>
    <aside class="side">
      <div class="side-h"><h2 id="optTitle">压缩</h2><p id="optDesc">调整 JPEG 质量以减小体积</p></div>
      <div class="opts">
        <div class="panel active" data-panel="image-compressor">
          <div class="opt"><label>JPEG 质量</label>
            <div class="slider-row"><input type="range" class="slider" id="compQuality" min="10" max="100" value="80"><span class="slider-val" id="compQVal">80</span></div>
          </div>
        </div>
        <div class="panel" data-panel="image-converter">
          <div class="opt"><label>目标格式</label>
            <select class="sel" id="convFmt"><option value="png">PNG (无损)</option><option value="jpg">JPEG (有损)</option></select>
          </div>
          <div class="opt" id="convQWrap" style="display:none"><label>JPEG 质量</label>
            <div class="slider-row"><input type="range" class="slider" id="convQuality" min="10" max="100" value="88"><span class="slider-val" id="convQVal">88</span></div>
          </div>
        </div>
        <div class="panel" data-panel="image-resizer">
          <div class="opt"><label>宽度 (px)</label>
            <div class="size-row"><input class="inp" id="rsW" type="number" placeholder="留空=按比例"><span class="x">×</span><input class="inp" id="rsH" type="number" placeholder="留空=按比例"></div>
          </div>
          <div class="opt"><label>JPEG 质量</label>
            <div class="slider-row"><input type="range" class="slider" id="rsQuality" min="10" max="100" value="88"><span class="slider-val" id="rsQVal">88</span></div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="processBtn" disabled>处理并保存</button>
      </div>
    </aside>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const api=window.pluginAPI;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
let current='image-compressor';let imgFile='';
const titles={compressor:{t:'压缩',d:'调整 JPEG 质量以减小体积'},converter:{t:'格式转换',d:'在 PNG 与 JPEG 之间转换'},resizer:{t:'缩放',d:'调整图片尺寸'}};
$$('.tab').forEach(t=>t.onclick=()=>{current=t.dataset.tool;const k=current.split('-')[1];$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('[data-panel]').forEach(p=>p.classList.toggle('active',p.dataset.panel===current));$('#optTitle').textContent=titles[k].t;$('#optDesc').textContent=titles[k].d;$('#convQWrap').style.display=k==='converter'&&$('#convFmt').value==='jpg'?'block':'none';});
['compQuality','convQuality','rsQuality'].forEach(id=>{$('#'+id).oninput=e=>$('#'+id.replace('quality','QVal').replace('Quality','QVal')).textContent=e.target.value;});
$('#convFmt').onchange=e=>$('#convQWrap').style.display=e.target.value==='jpg'?'block':'none';
$('#dropZone').onclick=()=>{const sel=api.selectFiles({multiple:false,filters:[{name:'图片',extensions:['png','jpg','jpeg','webp','bmp']}]});const f=Array.isArray(sel)?sel[0]:sel;if(f)loadImage(f);};
function loadImage(f){imgFile=f;const dz=$('#dropZone');dz.classList.add('has-img');dz.innerHTML=`<img class="preview-img" src="${api.readFileDataUrl(f)}">`;const nm=f.split(/[\\\/]/).pop();const ext=nm.split('.').pop().toLowerCase();$('#infoName').textContent=nm;$('#infoFmt').textContent=ext;const img=new Image();img.onload=()=>{$('#infoSize').textContent=img.width+'×'+img.height;};img.src=api.readFileDataUrl(f);$('#processBtn').disabled=false;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
$('#processBtn').onclick=async()=>{
  if(!imgFile){toast('请先选择图片');return;}
  const k=current.split('-')[1];let ext='png',quality=88;
  if(k==='compressor'){ext='jpg';quality=+$('#compQuality').value;}
  else if(k==='converter'){ext=$('#convFmt').value;quality=ext==='jpg'?+$('#convQuality').value:88;}
  else if(k==='resizer'){ext='jpg';quality=+$('#rsQuality').value;}
  const baseName=imgFile.replace(/\.[^.]+$/,'');
  const out=api.chooseSavePath({title:'保存图片',defaultPath:baseName.split(/[\\\/]/).pop()+'-optimized.'+ext,filters:[{name:'图片',extensions:[ext]}]});
  if(!out)return;
  const options={files:[imgFile],output:out,quality};
  if(k==='resizer'){const w=+$('#rsW').value,h=+$('#rsH').value;if(w)options.width=w;if(h)options.height=h;}
  const res=await api.runTask({toolId:current,input:'',options,execute:true});
  if(res.ok){const r=res.result;if(r.output){const kb=(r.bytes/1024).toFixed(1);toast('已保存，'+kb+' KB');loadImage(r.output);}}
  else toast(res.error);
};
window.addEventListener('plugin-enter',e=>{const f=e.detail?.action?.payload||e.detail?.action?.clipboardText||e.detail?.payload||e.detail?.clipboardText||'';if(f&&/\.(png|jpe?g|webp|bmp)$/i.test(f))loadImage(f);});
</script>
</body></html>
